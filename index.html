<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KoKrŠNeK">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<title>KoKrŠNeK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#050505;
    --card:#0B0B0B;
    --line:#1A3A1A;
    --ink:#E8F8E8;
    --muted:#6AAF7A;
    --accent:#4DBF6A;
    --accent-soft:rgba(77,191,106,0.12);
    --past:#5A8F6A;
    --past-soft:#050D07;
    --link:#7EDD8A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background-color:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    overscroll-behavior-y: none;
  }
  .app{
    height:100vh;
    width:100%;
    overflow-y:auto;
    scroll-snap-type:y proximity;
    position:relative;
    padding-bottom:160px;
    scroll-padding-bottom:160px;
    box-sizing:border-box;
    -webkit-overflow-scrolling:touch;
  }
  .search-btn{
    position:fixed;
    bottom:110px; right:18px;
    top:auto;
    z-index:20;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(11,11,11,0.7);
    border:1px solid rgba(60,180,80,0.45);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
  }
  #gearBtn{
    right:64px;
  }
  #gearBtn.connected{
    border-color:rgba(60,180,80,0.9);
    background:rgba(14,95,168,0.25);
  }
  .search-btn svg{
    width:18px; height:18px;
    stroke:var(--accent);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
  }

  .search-overlay{
    position:fixed;
    bottom:0; left:0; right:0;
    top:auto;
    width:100%;
    box-sizing:border-box;
    z-index:40;
    background:rgba(5,5,5,0.97);
    backdrop-filter:blur(4px);
    border-top:1px solid rgba(60,180,80,0.3);
    display:flex;
    flex-direction:column;
    padding:18px 18px 32px;
    max-height:75vh;
    transform:translateY(100%);
    transition:transform .2s ease;
  }
  .search-overlay.open{ transform:translateY(0); }

  .config-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(0,0,0,0.94);
    backdrop-filter:blur(2px);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    transform:translateY(-100%);
    transition:transform .15s ease;
  }
  .config-overlay.open{ transform:translateY(0); }
  .config-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
  }
  .config-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
  }
  .config-input{
    width:100%;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:10px 12px;
    border-radius:4px;
    outline:none;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .config-input:focus{ border-color:rgba(60,180,80,0.9); }
  .config-status{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin:8px 0 14px;
    min-height:18px;
  }
  .config-status.ok{ color:#3DB460; }
  .config-status.err{ color:#FF4444; }
  .config-btns{
    display:flex; gap:10px; margin-top:4px;
  }

  .search-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .search-row input[type="text"]{
    flex:1;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:11px 12px;
    border-radius:4px;
    outline:none;
  }
  .search-row input[type="text"]::placeholder{ color:var(--muted); }
  .search-close{
    width:38px; height:38px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--accent);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }

  .date-row-search{
    display:flex; align-items:center; gap:10px;
    margin-bottom:18px;
  }
  .date-row-search input[type="date"]{
    flex:1;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:9px 10px;
    border-radius:4px;
    outline:none;
    color-scheme:dark;
  }
  .cal-btn{
    flex-shrink:0;
    background:var(--accent);
    color:#000;
    border:none;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:9px 12px;
    border-radius:4px;
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
  }

  .search-results{
    flex:1;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-bottom:24px;
  }
  .result-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    border:1px solid rgba(60,180,80,0.22);
    border-radius:4px;
    padding:10px 12px;
    cursor:pointer;
  }
  .result-item:active{ background:rgba(60,180,80,0.08); }
  .result-main{ flex:1; min-width:0; }
  .result-title{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .map-pin{
    flex-shrink:0;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid rgba(60,180,80,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .map-pin svg{ width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2; }
  .no-results{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    margin-top:24px;
  }

  .topbar{
    position:fixed;
    top:auto !important;
    bottom:0; left:0; right:0;
    padding:10px 16px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    z-index:5;
    background:linear-gradient(transparent, var(--bg) 50%);
    pointer-events:none;
  }
  .topbar .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(18px, 6.5vw, 36px);
    letter-spacing:0.04em;
    color:var(--accent);
    text-transform:uppercase;
    width:100%;
    max-width:100%;
    text-align:center;
    white-space:nowrap;
  }
  .topbar .today{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .topbar .nameday{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--muted);
  }

  .slot{
    height:33.34dvh;
    min-height:180px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    position:relative;
    padding:8px 26px;
    box-sizing:border-box;
  }

  .dot{
    position:absolute;
    left:50%; top:50%;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    transform:translate(-50%,-50%);
    z-index:1;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:380px;
    transition:opacity .25s ease, transform .25s ease;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .eyebrow .pip{
    width:5px; height:5px;
    background:var(--muted);
    display:inline-block;
  }

  .date-row{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    color:var(--ink);
    line-height:1.05;
    margin:0 0 1px;
  }
  .time-row{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
    letter-spacing:0.04em;
  }
  .title-row{
    font-family:'JetBrains Mono', monospace;
    font-size:30px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0 0 4px;
    line-height:1.15;
  }
  .place-row{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .place-row::before{ content:"-= "; }
  .place-row::after{ content:" =-"; }

  /* --- NOW (center, dominant) --- */
  .slot.now .card{
    background:linear-gradient(180deg, rgba(60,180,80,0.08), rgba(0,0,0,0));
    border:2.5px solid rgba(60,180,80,0.75);
    border-radius:2px;
    padding:16px 20px 14px;
    position:relative;
    text-align:center;
  }
  .slot.now .card::before,
  .slot.now .card::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border:2.5px solid var(--accent);
  }
  .slot.now .card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .slot.now .card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .slot.now .eyebrow{ color:#E53935; justify-content:center; font-size:15.75px; }
  .slot.now .eyebrow .pip{ background:#E53935; }
  .slot.now .date-row{ font-size:22px; }
  .slot.now .title-row{
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    border-bottom:2px solid var(--accent);
    display:inline-block;
    padding-bottom:2px;
  }
  .slot.now .badge{
    display:inline-block;
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#000;
    background:var(--accent);
    padding:3px 9px;
    box-shadow:0 0 10px rgba(60,180,80,0.6);
  }

  /* --- FUTURE (above now) --- */
  .slot.future .card{
    text-align:center;
  }
  .slot.future .date-row{ font-size:22px; }
  .slot.future .title-row{ font-size:32px; font-weight:700; color:var(--ink); }
  .slot.future .eyebrow{ justify-content:center; color:var(--accent); }
  .slot.future .eyebrow .pip{ background:var(--accent); }

  /* --- PAST (below now, with photo link) --- */
  .slot.past .card{
    text-align:center;
  }
  .slot.past .date-row{ font-size:22px; }
  .slot.past .title-row{ font-size:32px; font-weight:700; color:var(--ink); }
  .slot.past .eyebrow{ justify-content:center; color:var(--accent); }
  .slot.past .eyebrow .pip{ background:var(--accent); }

  .photo-link{
    margin-top:9px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--link);
    background:var(--past-soft);
    border:1px solid rgba(60,180,80,0.3);
    padding:6px 12px;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .photo-link:active{ transform:scale(0.97); background:#071A0A; box-shadow:0 0 10px rgba(60,180,80,0.4); }
  .photo-link svg{ width:13px; height:13px; flex-shrink:0; }

  .ev-modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .ev-modal{
    background:#0F1117;
    border:1px solid rgba(60,180,80,0.4);
    border-radius:12px;
    width:100%; max-width:400px;
    max-height:80vh;
    overflow-y:auto;
    padding:24px 22px 20px;
    position:relative;
    animation: popIn .25s cubic-bezier(0.34,1.56,0.64,1);
    text-align:center;
  }
  .ev-modal-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; color:var(--muted);
    font-size:22px; cursor:pointer; line-height:1;
    padding:2px 6px;
  }
  .ev-modal-close:hover{ color:var(--ink); }
  .ev-modal-label{
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:3px; margin-top:14px;
    font-family:'JetBrains Mono',monospace;
  }
  .ev-modal-label:first-child{ margin-top:0; }
  .ev-modal-value{
    font-family:'JetBrains Mono',monospace;
    font-size:14px; color:var(--ink); line-height:1.5;
    word-break:break-word;
  }
  .ev-modal-title{
    font-family:'JetBrains Mono',monospace;
    font-size:20px; font-weight:700; color:var(--ink);
    margin-bottom:16px; line-height:1.3; padding-right:0;
  }
  .ev-modal-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--link); font-size:13px;
    font-family:'JetBrains Mono',monospace;
    text-decoration:none;
    border:1px solid rgba(60,180,80,0.3);
    padding:5px 12px; border-radius:100px; margin-top:4px;
  }
  .title-clickable{
    cursor:pointer; border-bottom:1px dashed rgba(60,180,80,0.4);
    transition:border-color .15s;
  }
  .title-clickable:hover{ border-color:var(--accent); }

  /* --- ALBUMS OVERLAY --- */
  .albums-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    pointer-events:none;
  }
  .albums-overlay.open{
    transform:translateX(0);
    pointer-events:auto;
  }
  .albums-topbar{
    padding:56px 20px 14px;
    background:var(--bg);
    border-bottom:1px solid rgba(60,180,80,0.15);
    text-align:center;
    flex-shrink:0;
  }
  .albums-topbar .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .albums-list{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
  }
  .albums-page{
    height:100vh;
    overflow-y:auto;
    background:var(--bg);
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
    box-sizing:border-box;
  }
  .albums-header{
    padding:60px 20px 14px;
    background:var(--bg);
    text-align:center;
  }
  .albums-header .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--accent);
    text-transform:uppercase;
    text-align:center;
    display:block;
  }
  .album-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid rgba(60,180,80,0.1);
    cursor:pointer;
    transition:background .15s;
  }
  .album-item:active{ background:rgba(60,180,80,0.06); }
  .album-dot{
    width:10px; height:10px; border-radius:50%;
    flex-shrink:0;
    background:var(--accent);
  }
  .album-info{ flex:1; min-width:0; }
  .album-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--muted);
    margin-bottom:3px;
    letter-spacing:0.03em;
  }
  .album-title{
    font-family:'JetBrains Mono',monospace;
    font-size:15px; font-weight:700;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .album-arrow{
    color:var(--accent); font-size:18px; flex-shrink:0;
  }
  .albums-empty{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:13px; color:var(--muted);
    margin-top:40px;
  }
  .back-btn{
    position:fixed;
    bottom:110px; left:18px;
    z-index:20;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(11,11,11,0.7);
    border:1px solid rgba(60,180,80,0.45);
    display:none;
    align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
    color:var(--accent);
    font-size:20px;
    line-height:1;
  }

  @keyframes slideDown{
    from{ transform:translateY(-20px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  @keyframes tipShow{
    0%{ opacity:0; }
    10%{ opacity:1; }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }
  @keyframes popIn{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    to{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .hint .arrow{ animation:none; }
  }
</style>
</head>
<body>

<div class="app" id="app">
</div>



<!-- Fixed UI outside h-wrap so transform doesn't affect them -->
<button class="search-btn" id="albumsBtn" aria-label="Alba fotek" style="right:auto;left:64px;z-index:25;" onclick="showAlbums()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L3 19"/></svg>
</button>

<button class="search-btn" id="homeBtn" aria-label="Přejít na aktuální událost" style="right:auto;left:18px;" onclick="
  fetchGoogleCalendarEvents().then(() => {
    var app=document.getElementById('app');
    var now=app.querySelector('.slot.now');
    if(!now) return;
    var top=0;
    var el=now;
    while(el && el!==app){top+=el.offsetTop;el=el.offsetParent;}
    var offset=top-(app.clientHeight/2)+(now.offsetHeight/2);
    app.style.scrollSnapType='none';
    app.scrollTo({top:Math.max(0,offset),behavior:'smooth'});
    setTimeout(()=>{ app.style.scrollSnapType=''; }, 800);
  });
">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
</button>

<button class="search-btn" id="feedbackBtn" aria-label="Nahlásit chybu" style="right:64px;border-color:rgba(229,57,53,0.6);background:rgba(229,57,53,0.12);" onclick="localStorage.getItem('welcomeSeen') ? showFeedback() : (localStorage.setItem('welcomeSeen','1'), showWelcome())">
  <svg viewBox="0 0 24 24" fill="none" stroke="#E53935" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
</button>


<button class="search-btn" id="searchBtn" aria-label="Hledat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
</button>

<div class="search-overlay" id="searchOverlay">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Hledat podle názvu nebo místa…" autocomplete="off">

const MONTHS = ["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
const DAYS = ["ne","po","út","st","čt","pá","so"];

function fmtDate(d){
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFull(d){
  return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(d, end){
  const t = (x)=> x.getHours().toString().padStart(2,'0')+":"+x.getMinutes().toString().padStart(2,'0');
  return end ? `${t(d)} – ${t(end)}` : t(d);
}

function isMultiDay(ev){
  const startDay = new Date(ev.start.getFullYear(), ev.start.getMonth(), ev.start.getDate());
  const endDay   = new Date(ev.end.getFullYear(),   ev.end.getMonth(),   ev.end.getDate());
  return endDay - startDay >= 86400000;
}

function fmtDateRange(ev){
  if(!isMultiDay(ev)) return fmtDate(ev.start);
  const endDisplay = new Date(ev.end.getTime() - 1);
  if(ev.start.getMonth() === endDisplay.getMonth() && ev.start.getFullYear() === endDisplay.getFullYear())
    return `${ev.start.getDate()}. – ${endDisplay.getDate()}. ${MONTHS[endDisplay.getMonth()]} ${endDisplay.getFullYear()}`;
  return `${fmtDate(ev.start)} – ${fmtDate(endDisplay)}`;
}

function fmtTimeRow(ev){
  if(isMultiDay(ev)){
    const endDisplay = new Date(ev.end.getTime() - 1);
    return `${fmtFull(ev.start)} – ${fmtFull(endDisplay)}`;
  }
  return fmtTime(ev.start, ev.end);
}

// =====================================================
// POČÍTADLO DNÍ

function getDaysText(ev){
  const today = new Date(); today.setHours(0,0,0,0);
  const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
  const diff = Math.round((evDay - today) / 86400000);
  if(diff === 0) return 'dnes';
  if(diff === 1) return 'zítra';
  if(diff === -1) return 'včera';
  if(diff > 0) return `za ${diff} dní`;
  return `před ${Math.abs(diff)} dny`;
}

// SDÍLENÍ UDÁLOSTI
// =====================================================
async function shareEvent(ev){
  const r = ev.raw || {};
  const isPast = ev.end < now;

  let textBase, shareUrl;

  if(isPast){
    // Minulé události — jen popis + případné fotky/soubory
    const extras = [];
    if(ev.photoAlbum) extras.push(ev.photoAlbum);
    if(ev.driveFiles && ev.driveFiles.length) ev.driveFiles.forEach(f => extras.push(`${f.title}: ${f.url}`));
    textBase = `${ev.title}\n${fmtDateRange(ev)}${ev.place ? '\n'+ev.place : ''}${extras.length ? '\n\n'+extras.join('\n') : ''}`;
    shareUrl = ev.photoAlbum || (ev.driveFiles?.[0]?.url) || undefined;
  } else {
    // Budoucí události — přidej odkaz na Google Calendar
    const link = r.htmlLink || '';
    textBase = `${ev.title}\n${fmtDateRange(ev)}${ev.place ? '\n'+ev.place : ''}`;
    shareUrl = link || undefined;
  }

  if(navigator.share){
    try{
      await navigator.share({ title: ev.title, text: textBase, url: shareUrl });
      return;
    }catch(e){}
  }
  await navigator.clipboard.writeText(textBase + (shareUrl && !textBase.includes(shareUrl) ? '\n\n'+shareUrl : ''));
  const btn = document.getElementById('shareEvBtn');
  if(btn){ btn.textContent = '✓ Zkopírováno'; setTimeout(()=>{ btn.textContent = 'Sdílet'; },2000); }
}

// =====================================================
function exportICS(ev){
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    `DTSTART:${fmt(ev.start)}`,
    `DTEND:${fmt(ev.end)}`,
    `SUMMARY:${ev.title}`,
    ev.place ? `LOCATION:${ev.place}` : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click();
}

function checkAnniversaries(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  if(localStorage.getItem('annivShownDate') === todayStr) return;

  const thisYear = today.getFullYear();
  const annivs = rawEvents.filter(ev => {
    const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
    const years = thisYear - evDay.getFullYear();
    return years > 0 &&
      evDay.getMonth() === today.getMonth() &&
      evDay.getDate() === today.getDate();
  });
  if(!annivs.length) return;

  localStorage.setItem('annivShownDate', todayStr);

  annivs.forEach(ev => {
    const years = thisYear - new Date(ev.start).getFullYear();
    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop';
    backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };

          display:block;width:100%;margin-top:16px;

}

async function fetchWeather(place, dateStr){
  try{
    // Geocoding přes Nominatim
    const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
      {headers:{'User-Agent':'KoKrSNeK-PWA'}});
    const geoData = await geo.json();
    if(!geoData.length) return null;
    const {lat, lon} = geoData[0];
    // Počasí přes Open-Meteo
    const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.daily) return null;
    const code = wxData.daily.weathercode[0];
    const max = Math.round(wxData.daily.temperature_2m_max[0]);
    const min = Math.round(wxData.daily.temperature_2m_min[0]);
    const rain = wxData.daily.precipitation_sum[0];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain+'mm':''}`;
  }catch(e){ return null; }
}

const now = new Date();

function at(daysOffset, h, m, durMin){
  const d = new Date(now);
  d.setDate(d.getDate()+daysOffset);
  d.setHours(h, m, 0, 0);
  const end = new Date(d.getTime() + durMin*60000);
  return {start:d, end};
}

  const diffDays = Math.round((d - new Date(now.getFullYear(),now.getMonth(),now.getDate())) / 86400000);
  if (diffDays === 1) return "Zítra";
  if (diffDays <= 7) return `Za ${diffDays} dní`;
  return "Nadcházející";
}

function renderTimeline(){
  app.innerHTML = "";

  if (rawEvents.length === 0){
    app.innerHTML = `<div class="slot"><div class="card" style="text-align:center;"><div class="title-row">Žádné události</div></div></div>`;
    return;
  }

  centerIndex = 0;
  for (let i=0;i<rawEvents.length;i++){
    if (rawEvents[i].end >= now){ centerIndex = i; break; }
    centerIndex = i;
  }

  const orderedIndices = [];
  for (let i = rawEvents.length - 1; i > centerIndex; i--) orderedIndices.push(i); // future, furthest first (top)
  orderedIndices.push(centerIndex); // now (center)
  for (let i = centerIndex - 1; i >= 0; i--) orderedIndices.push(i); // past, nearest-past first (just below now)

  // Roky zastoupené v událostech — globálně pro onclick
  window._yearsInTimeline = [...new Set(orderedIndices.map(i => rawEvents[i].start.getFullYear()))];
  let lastYear = null;

  orderedIndices.forEach((i) => {
    const ev = rawEvents[i];
    const isNow = i === centerIndex;
    const isPast = i < centerIndex;
    const kind = isNow ? "now" : (isPast ? "past" : "future");
    const evYear = ev.start.getFullYear();

    // Oddělovač roku
    if(evYear !== lastYear){
      const yd = document.createElement('div');
      yd.id = `yr_${evYear}`;
      yd.style.cssText = 'text-align:center;font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.15em;color:var(--muted);padding:10px 0 4px;cursor:pointer;user-select:none;';
      yd.textContent = `— ${evYear} —`;
      yd.onclick = () => openYearPicker(window._yearsInTimeline, evYear);
      app.appendChild(yd);
      lastYear = evYear;
    }

    const slot = document.createElement('div');
    slot.className = `slot ${kind}`;

    const color = getEventColor(ev);

    // Zjisti jestli událost probíhá právě teď nebo dnes
    const evStart = new Date(ev.start); evStart.setHours(0,0,0,0);
    const today = new Date(now); today.setHours(0,0,0,0);
    const isToday = evStart.getTime() === today.getTime() || (ev.start <= now && ev.end >= now);
    const isHappeningNow = ev.start <= now && ev.end >= now;

    let eyebrowText;
    if(isNow && isToday) eyebrowText = "Žhavíme";
    else if(isNow && !isToday) eyebrowText = "Nadcházející";
    else if(isPast) eyebrowText = "Skončilo";
    else eyebrowText = fmtRelativeFuture(ev.start);

    const countdownStyle = isNow
      ? `font-size:15.75px;color:#E53935;margin-left:6px;letter-spacing:0.04em;`
      : `font-size:10px;background:${color}22;color:${color};border-radius:100px;padding:2px 8px;margin-left:6px;letter-spacing:0.04em;`;
    // Pokud je Žhavíme (dnes), nezobrazujeme countdown
    const countdown = (!isPast && !(isNow && isToday)) ? `<span style="${countdownStyle}">${getDaysText(ev)}</span>` : '';

    slot.innerHTML = `
      <div class="card">
        ${isNow ? `<div onclick="openYearPicker(window._yearsInTimeline,${evYear})" style="font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.15em;color:var(--muted);text-align:center;margin-bottom:10px;cursor:pointer;user-select:none;">— ${evYear} —</div>` : ''}
        <div class="eyebrow">${isNow ? '' : `<span class="pip" style="background:${color};"></span>`}${eyebrowText}${countdown}</div>
        <div class="date-row">${fmtDateRange(ev)}</div>
        <div class="time-row">${fmtTimeRow(ev)}</div>
        <div class="title-row title-clickable" onclick="showEventDetail(${i})">${ev.title}</div>
        ${ev.place ? `<div class="place-row">${ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place}</div>` : ``}
        ${isNow && isHappeningNow ? `<span class="badge">probíhá teď</span>` : ``}
        ${isPast && ev.photoAlbum ? `<a class="photo-link" href="#" onclick="event.preventDefault();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">${photoSVG()}Album fotek</a>` : ``}
      </div>
    `;
    slot.dataset.idx = i;
    app.appendChild(slot);
  });

  const nowSlot = document.querySelector('.slot.now');
  if (nowSlot) nowSlot.scrollIntoView({block:"center"});
}

async function fetchGoogleCalendarEvents(){
  // status removed
  try{
    let allItems = [];
    let pageToken = null;
    const timeMin = '2000-01-01T00:00:00Z'; // všechny události od roku 2000
    do {
      let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events`
        + `?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&maxResults=2500`
        + `&timeMin=${encodeURIComponent(timeMin)}`;
      if(pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(!res.ok){
        return;
      }
      const items = (data.items||[]).filter(it => it.start&&(it.start.dateTime||it.start.date));
      allItems = allItems.concat(items);
      pageToken = data.nextPageToken || null;
    } while(pageToken);

    if(!allItems.length){ return; }

    rawEvents = allItems.map(it => {
      const start = new Date(it.start.dateTime || it.start.date+'T00:00:00');
      const end   = new Date((it.end&&(it.end.dateTime||it.end.date)) ? (it.end.dateTime||it.end.date+'T00:00:00') : start);
      let photoAlbum = null;
      let driveFiles = [];
      if(it.attachments){
        const p = it.attachments.find(a => /photos\.google\.com|photos\.app\.goo\.gl/.test(a.fileUrl||''));
        if(p) photoAlbum = p.fileUrl;
        // Všechny přílohy z Google Drive
        driveFiles = it.attachments
          .filter(a => a.fileUrl && !(/photos\.google\.com|photos\.app\.goo\.gl/.test(a.fileUrl)))
          .map(a => ({
            url: a.fileUrl,
            title: a.title || 'Soubor',
            mime: a.mimeType || '',
            icon: a.iconLink || ''
          }));
      }
      if(!photoAlbum && it.description){
        const clean = it.description.replace(/<[^>]+>/g, ' ');
        const m = clean.match(/https?:\/\/photos(?:\.app)?\.goo\.gl\/[^\s"'<>]+|https?:\/\/photos\.google\.com\/[^\s"'<>]+/);
        if(m) photoAlbum = m[0].replace(/&amp;/g,'&');
      }
      const title = (it.summary||'(bez názvu)').trim();
      if(!photoAlbum){
        const key = Object.keys(PHOTO_ALBUMS).find(k => k.trim().toLowerCase() === title.toLowerCase());
        if(key) photoAlbum = PHOTO_ALBUMS[key];
      }
      return { start, end, title, place: it.location||'', photoAlbum, driveFiles, raw: it };
    }).sort((a,b)=>a.start-b.start);
    renderTimeline();
    setTimeout(checkUpcomingNotifications, 1000);
    setTimeout(checkAnniversaries, 1500);
  }catch(e){
  }
}

function checkUpcomingNotifications(){
  const today = new Date();
  today.setHours(0,0,0,0);

  const upcoming = rawEvents.filter(ev => {
    const evDay = new Date(ev.start);
    evDay.setHours(0,0,0,0);
    const diffDays = Math.round((evDay - today) / 86400000);
    return diffDays > 0 && diffDays <= 5;
  });

  if (!upcoming.length) return;

  const todayStr = today.toISOString().slice(0,10);
  const lastShown = localStorage.getItem('notifShownDate');
  if (lastShown === todayStr) return;
  localStorage.setItem('notifShownDate', todayStr);

  upcoming.forEach((ev, idx) => {
    const evDay = new Date(ev.start);
    evDay.setHours(0,0,0,0);
    const diffDays = Math.round((evDay - today) / 86400000);
    const daysText = diffDays === 1 ? 'zítra' : `za ${diffDays} dní`;

    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop kokr-banner';
    backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };

    const evIdx = rawEvents.indexOf(ev);

    backdrop.innerHTML = `
      <div class="ev-modal">
        <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
        <div class="ev-modal-label" style="font-size:clamp(16px,5.5vw,26px);letter-spacing:0.06em;color:var(--accent);text-align:center;padding:4px 0;">Už se těšíš?</div>
        <div class="ev-modal-title">${ev.title}</div>
        <div class="ev-modal-label">Kdy</div>
        <div class="ev-modal-value">${fmtDateRange(ev)} · ${daysText}</div>
        ${ev.place ? `<div class="ev-modal-label">Místo</div><div class="ev-modal-value">${ev.place}</div>` : ''}
        <div class="ev-modal-value" style="margin-top:16px;font-size:clamp(11px,3.5vw,18px);color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Kokršneci na tebe ano.</div>
        <button onclick="this.closest('.ev-modal-backdrop').remove()" style="
          display:block; width:100%; margin-top:16px;
          background:var(--accent); border:none;
          color:#000; font-family:'JetBrains Mono',monospace; font-size:13px;
          padding:10px; border-radius:6px; cursor:pointer; letter-spacing:0.05em; font-weight:700;
        ">OK</button>
      </div>
    `;
    document.body.appendChild(backdrop);
    setTimeout(() => { if(backdrop.parentElement) backdrop.remove(); }, 15000);
  });

  // Pokus se také o systémovou notifikaci pokud je povolena
  if ('Notification' in window && Notification.permission === 'granted'){
    upcoming.forEach(ev => {
      const evDay = new Date(ev.start);
      evDay.setHours(0,0,0,0);
      const diffDays = Math.round((evDay - today) / 86400000);
      const daysText = diffDays === 1 ? 'zítra' : `za ${diffDays} dní`;
      new Notification(`Už se těšíš?`, {
        body: `${ev.title} — ${daysText} (${fmtDate(ev.start)})\n\nKokršneci na tebe ano.`,
        icon: 'icon-192v2.png',
      });
    });
  }
}







function showYearPicker(allYears, currentYear){
  const years = allYears.split(',');
  const existing = document.getElementById('yearPickerPopup');
  if(existing) existing.remove();

  const popup = document.createElement('div');
  popup.id = 'yearPickerPopup';
  popup.style.cssText = `
    position:fixed; z-index:200;
    left:50%; transform:translateX(-50%);
    top:50%;
    background:var(--card);
    border:1px solid rgba(60,180,80,0.4);
    border-radius:10px;
    padding:16px 20px;
    min-width:160px;
    transform:translate(-50%,-50%);
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  `;

  const title = document.createElement('div');
  title.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:0.1em;color:var(--muted);text-align:center;margin-bottom:12px;text-transform:uppercase;';
  title.textContent = 'Přejít na rok';
  popup.appendChild(title);

  years.forEach(year => {
    const btn = document.createElement('button');
    btn.textContent = year;
    btn.style.cssText = `
      display:block; width:100%; text-align:center;
      background:${year==currentYear?'rgba(60,180,80,0.15)':'transparent'};
      border:none; border-radius:6px;
      color:${year==currentYear?'var(--accent)':'var(--ink)'};
      font-family:'JetBrains Mono',monospace;
      font-size:18px; font-weight:700;
      padding:8px; cursor:pointer; margin-bottom:4px;
      letter-spacing:0.05em;
    `;
    btn.onclick = () => {
      popup.remove();
      const target = document.getElementById('albumYear_'+year);
      if(target){
        const modal = target.closest('.ev-modal');
        if(modal) modal.scrollTo({top: target.offsetTop - 10, behavior:'smooth'});
      }
    };
    popup.appendChild(btn);
  });

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '×';
  closeBtn.style.cssText = 'position:absolute;top:8px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;';
  closeBtn.onclick = () => popup.remove();
  popup.appendChild(closeBtn);

  document.body.appendChild(popup);

  // Zavřít kliknutím mimo
  setTimeout(() => {
    document.addEventListener('click', function close(e){
      if(!popup.contains(e.target)){ popup.remove(); document.removeEventListener('click',close); }
    });
  }, 100);
}

function showAlbums(){
  if(!calendarLoaded){
    // Kalendář ještě načítá — počkej a zkus znovu
    const loading = document.createElement('div');
    loading.style.cssText = 'position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);';
    loading.innerHTML = '<div style="font-family:JetBrains Mono,monospace;color:var(--accent);font-size:13px;">Načítám data…</div>';
    document.body.appendChild(loading);
    const wait = setInterval(() => {
      if(calendarLoaded){ clearInterval(wait); loading.remove(); _showAlbumsModal(); }
    }, 200);
    setTimeout(() => { clearInterval(wait); loading.remove(); _showAlbumsModal(); }, 8000);
    return;
  }
  _showAlbumsModal();
}

function _showAlbumsModal(){
  const curNow = new Date();
  const withAlbums = rawEvents
    .filter(ev => ev.photoAlbum && ev.end < curNow)
    .sort((a,b) => a.start - b.start); // nejstarší první celkově

  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };

  // Seskup podle roku, nejnovější rok nahoře, uvnitř roku chronologicky
  const byYear = {};
  withAlbums.forEach(ev => {
    const y = ev.start.getFullYear();
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(ev);
  });
  const years = Object.keys(byYear).map(Number).sort((a,b) => b-a);

  const allYears = years.join(',');

  let rows = '';
  if(withAlbums.length){
    years.forEach((year, yi) => {
      rows += `<div id="albumYear_${year}" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.15em;color:var(--accent);padding:14px 0 6px;${yi>0?'border-top:1px solid rgba(60,180,80,0.15);':''}cursor:pointer;user-select:none;" onclick="showYearPicker('${allYears}','${year}')">${year} ▾</div>`;
      byYear[year].forEach(ev => {
        rows += `
          <div class="album-item" onclick="this.closest('.ev-modal-backdrop').remove();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">
            <div class="album-dot" style="background:${getEventColor(ev)};"></div>
            <div class="album-info">
              <div class="album-date">${fmtDate(ev.start)}</div>
              <div class="album-title">${ev.title}</div>
            </div>
            <div class="album-arrow">›</div>
          </div>`;
      });
    });
  } else {
    rows = `<div class="albums-empty">Zatím žádná fotoalba<br><small style="color:var(--muted);font-size:11px;">(${rawEvents.filter(e=>e.end<curNow).length} minulých událostí)</small></div>`;
  }

  backdrop.innerHTML = `
    <div class="ev-modal">
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;">Fotoalba z akcí</div>
      ${rows}
    </div>`;
  document.body.appendChild(backdrop);
}

document.getElementById('albumsBtn').addEventListener('click', showAlbums);
document.getElementById('albumsBtn').addEventListener('touchend', function(e){ e.preventDefault(); showAlbums(); });

    + '<button id="welcomeCloseBtn" style="position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;">×</button>'

    + '</div>';
  document.body.appendChild(backdrop);
  function closeWelcome(){ var ov = document.getElementById('welcomeOverlay'); if(ov) ov.remove(); }
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeWelcome(); });
  document.getElementById('welcomeCloseBtn').addEventListener('click', closeWelcome);
  document.getElementById('welcomeCloseBtn2').addEventListener('click', closeWelcome);
}
