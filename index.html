async function exportAttendanceXlsx(){
  const btn = document.getElementById('exportAttendanceXlsxBtn');
  try{
    if(btn){ btn.textContent = '⬇ Exportuji…'; btn.disabled = true; }
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js');

    const snap = await db.collectionGroup('attendees').get();
    const events = {};      // eventId -> { title, start }
    const userTotals = {};  // user -> počet účastí
    const attended = {};    // `${user}__${eventId}` -> true

    snap.forEach(d => {
      const data = d.data();
      if(!data.user) return;
      const eventId = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      if(!eventId) return;
      if(!events[eventId]){
        events[eventId] = { title: data.eventTitle || eventId, start: data.eventStart ? new Date(data.eventStart) : null };
      }
      userTotals[data.user] = (userTotals[data.user] || 0) + 1;
      attended[data.user + '__' + eventId] = true;
    });

    const eventIds = Object.keys(events).sort((a,b) => {
      const ta = events[a].start ? events[a].start.getTime() : 0;
      const tb = events[b].start ? events[b].start.getTime() : 0;
      return ta - tb;
    });
    const users = Object.entries(userTotals).sort((a,b) => b[1] - a[1]).map(([u]) => u);
    const dateLabel = (d) => d ? `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.` : '?';

    // Řádek 1: název akce, Řádek 2: datum, Řádek 3+: přezdívka / celkem / ✓ matice
    const titleRow = ['', '', ...eventIds.map(id => events[id].title)];
    const dateRow = ['Přezdívka', 'Celkem', ...eventIds.map(id => dateLabel(events[id].start))];
    const dataRows = users.map(user => [
      user,
      userTotals[user],
      ...eventIds.map(id => attended[user + '__' + id] ? '👍' : '')
    ]);
    const aoa = [titleRow, dateRow, ...dataRows];

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 16 }, { wch: 8 }, ...eventIds.map(() => ({ wch: 13 }))];
    ws['!rows'] = [{ hpt: 34 }, { hpt: 16 }];
    ws['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, // "Přezdívka" přes obě hlavičkové řádky
      { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } },  // "Celkem" přes obě hlavičkové řádky
    ];
    ws['!views'] = [{ state: 'frozen', xSplit: 2, ySplit: 2, topLeftCell: 'C3', activePane: 'bottomRight' }];

    // --- Barvy a písmo (stejná paleta jako appka: tmavě zelený accent) ---
    const BORDER = { style: 'thin', color: { rgb: 'D9D9D9' } };
    const BORDER_ALL = { top: BORDER, bottom: BORDER, left: BORDER, right: BORDER };
    const HEADER_FILL = { patternType: 'solid', fgColor: { rgb: '2F7A56' } };
    const HEADER_FONT = { bold: true, color: { rgb: 'FFFFFF' }, sz: 11 };
    const NAME_FONT = { bold: true, sz: 11, color: { rgb: '1A2A22' } };
    const TOTAL_FILL = { patternType: 'solid', fgColor: { rgb: 'E7F3EC' } };
    const TOTAL_FONT = { bold: true, sz: 11, color: { rgb: '2F7A56' } };
    const CHECK_FILL = { patternType: 'solid', fgColor: { rgb: 'DCEFE3' } };
    const ODD_ROW_FILL = { patternType: 'solid', fgColor: { rgb: 'F7F8F7' } };

    const numRows = aoa.length, numCols = titleRow.length;
    for(let r = 0; r < numRows; r++){
      for(let c = 0; c < numCols; c++){
        const addr = XLSX.utils.encode_cell({ r, c });
        if(!ws[addr]) ws[addr] = { t: 's', v: '' };
        const style = { border: BORDER_ALL, alignment: { vertical: 'center', horizontal: c < 2 ? 'left' : 'center', wrapText: true } };
        if(r < 2){
          style.fill = HEADER_FILL;
          style.font = HEADER_FONT;
          style.alignment.horizontal = 'center';
        } else if(c === 0){
          style.font = NAME_FONT;
          if((r - 2) % 2 === 1) style.fill = ODD_ROW_FILL;
        } else if(c === 1){
          style.fill = TOTAL_FILL;
          style.font = TOTAL_FONT;
          style.alignment.horizontal = 'center';
        } else {
          if(ws[addr].v === '👍') style.fill = CHECK_FILL;
          else if((r - 2) % 2 === 1) style.fill = ODD_ROW_FILL;
        }
        ws[addr].s = style;
      }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Docházka');
    XLSX.writeFile(wb, 'kokrsnek-dochazka.xlsx');
  }catch(e){
    console.error('Chyba při exportu XLSX:', e);
    alert('Export se nepodařil: ' + e.message);
  }finally{
    if(btn){ btn.textContent = '⬇ Export do XLSX'; btn.disabled = false; }
  }
}

// Vlastní obrazovka s žádostí o notifikace, zobrazená sama od sebe po zadání
// přezdívky (u nových uživatelů) nebo po dalším otevření appky (u stávajících,
// pokud ještě notifikace nemají zapnuté ani vědomě odmítnuté). Safari na iOS
// vyžaduje, aby systémový dialog vyvolal PŘÍMO klik uživatele — proto appka
// nejdřív ukáže tenhle vlastní dialog a teprve klik na "Zapnout" spustí
// Notification.requestPermission() uvnitř toggleNotifications().
function maybePromptForNotifications(){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'default') return; // už rozhodnuto (povoleno/zamítnuto)
  if(localStorage.getItem('notifPromptShown')) return; // ať appka nenabízí pořád dokola
  localStorage.setItem('notifPromptShown', '1');

  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal" style="text-align:center;">
      <div class="ev-modal-title" style="margin-bottom:6px;">🔔 Zapnout upozornění?</div>
      <div style="font-family:'Inter', sans-serif;font-size:14px;color:var(--muted);margin-bottom:18px;">Ať ti nic neuteče — nové akce, komentáře, lajky, Dojdu/Nedojdu i zprávy od party.</div>
      <button id="notifPromptYes" style="display:block;width:100%;background:var(--accent);border:none;color:#12261C;font-family:'Inter', sans-serif;font-size:14px;padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;margin-bottom:8px;">Zapnout</button>
      <button id="notifPromptNo" style="display:block;width:100%;background:none;border:none;color:var(--muted);font-family:'Inter', sans-serif;font-size:13px;padding:10px;cursor:pointer;">Teď ne</button>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#notifPromptYes').onclick = () => { backdrop.remove(); toggleNotifications(); };
  backdrop.querySelector('#notifPromptNo').onclick = () => backdrop.remove();
}

});
