async function toggleChatReaction(threadId, msgId, emoji){  const user = getUserName();
  if(!user) return;
  try{
    const ref = db.collection('chats').doc(threadId).collection('messages').doc(msgId);
    const snap = await ref.get();
    const data = snap.data() || {};
    const reactions = data.reactions || {};
    const hasReacted = (reactions[emoji] || []).includes(user);
    // Jedna aktivní reakce na osobu — nejdřív ji všude odeber, pak případně přidej k vybranému emoji
    const newReactions = {};
    Object.keys(reactions).forEach(e => {
      const filtered = (reactions[e] || []).filter(u => u !== user);
      if(filtered.length) newReactions[e] = filtered;
    });
    if(!hasReacted){
      newReactions[emoji] = [...(newReactions[emoji] || []), user];
    }
    await ref.update({ reactions: newReactions });
    // Žádný ruční refresh — vlákno poslouchá živě přes onSnapshot výše.
  }catch(e){ console.error('Chyba při ukládání reakce na zprávu:', e); }
}

async function deleteChatMessage(threadId, msgId){
  if(!confirm('Smazat tuhle zprávu?')) return;
  try{
    await db.collection('chats').doc(threadId).collection('messages').doc(msgId).delete();
  }catch(e){ console.error('Chyba při mazání zprávy:', e); }
}

// Text zprávy se pro úpravu natahuje čerstvě z Firestore (ne z toho, co je
// zrovna vykreslené), ať se nemusí protahovat přes onclick atribut — u zprávy
// s uvozovkami nebo apostrofem by to rozbilo HTML.
async function editChatMessage(threadId, msgId){
  try{
    const ref = db.collection('chats').doc(threadId).collection('messages').doc(msgId);
    const snap = await ref.get();
    const data = snap.data() || {};
    const next = prompt('Upravit zprávu:', data.text || '');
    if(next === null) return;
    const trimmed = next.trim().slice(0,160);
    if(!trimmed) return;
    await ref.update({ text: trimmed, edited: true });
  }catch(e){ console.error('Chyba při úpravě zprávy:', e); }
}

// Připnutí/odepnutí zprávy nahoru ve vlákně (banner nad seznamem zpráv, viz
// renderPinnedBanner v openChatThread). Ukládá se jen krátký "otisk" zprávy
// (text / že jde o fotku, autor, čas) do dokumentu vlákna, ne celá zpráva —
// u fotky se tak neduplikuje celý obrázek jen kvůli náhledu v banneru.
async function toggleChatPin(threadId, msgId){
  try{
    const threadRef = db.collection('chats').doc(threadId);
    const [threadSnap, msgSnap] = await Promise.all([threadRef.get(), threadRef.collection('messages').doc(msgId).get()]);
    const currentPinned = (threadSnap.data() || {}).pinned;
    if(currentPinned && currentPinned.msgId === msgId){
      await threadRef.update({ pinned: firebase.firestore.FieldValue.delete() });
      return;
    }
    const data = msgSnap.data() || {};
    await threadRef.set({ pinned: { msgId, text: data.text || '', image: !!data.image, from: data.from || '', at: data.at || '' } }, { merge: true });
  }catch(e){ console.error('Chyba při připínání zprávy:', e); }
}

// Celoobrazovkový náhled fotky ze zprávy — obrázek je uložený jako data URL
// přímo v dokumentu (ne v Storage), takže by ho window.open() u některých
// prohlížečů odmítl otevřít jako samostatnou stránku; zobrazení přes vlastní
// overlay uvnitř appky tenhle problém nemá.
function openImageLightbox(src, gallery){
  gallery = (gallery && gallery.length) ? gallery : [src];
  let idx = gallery.indexOf(src);
  if(idx < 0) idx = 0;
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;';
  backdrop.innerHTML = `
    <img id="lightboxImg" src="${gallery[idx]}" style="max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;cursor:zoom-out;">
    ${gallery.length > 1 ? `
      <button id="lightboxPrev" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.14);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;">‹</button>
      <button id="lightboxNext" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.14);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;">›</button>
      <div id="lightboxCounter" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-size:12.5px;">${idx+1} / ${gallery.length}</div>
    ` : ''}`;
  document.body.appendChild(backdrop);
  backdrop.onclick = () => backdrop.remove();
  const imgEl = document.getElementById('lightboxImg');
  imgEl.onclick = e => e.stopPropagation();
  const show = (newIdx) => {
    idx = (newIdx + gallery.length) % gallery.length;
    imgEl.src = gallery[idx];
    const counter = document.getElementById('lightboxCounter');
    if(counter) counter.textContent = `${idx+1} / ${gallery.length}`;
  };
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');
  if(prevBtn) prevBtn.onclick = e => { e.stopPropagation(); show(idx-1); };
  if(nextBtn) nextBtn.onclick = e => { e.stopPropagation(); show(idx+1); };
  // Listování prstem doleva/doprava mezi fotkami, ne jen šipkami.
  let touchStartX = 0;
  backdrop.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
  backdrop.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(gallery.length > 1 && Math.abs(dx) > 50){ if(dx < 0) show(idx+1); else show(idx-1); }
  }, {passive:true});
}

async function czechIBAN(account, bank){
  const bban = bank.padStart(4,'0') + '000000' + account.padStart(10,'0');
  const numStr = bban + '1235' + '00';
  let rem = 0;
  for(const d of numStr) rem = (rem * 10 + parseInt(d)) % 97;
  return 'CZ' + String(98 - rem).padStart(2,'0') + bban;
}

// =====================================================
// NÁKLADY AKCE — appka si vede jen položky (Firestore, kolekce expensePdfs,
// klíč = stejný getEventKey jako u lajků/komentářů); appka si neukládá
// žádný soubor, jen položky — náhled se znovu poskládá z položek pokaždé,
// když se tlačítko/karta otevře, takže vždycky odpovídá aktuálním datům
// (drobná budoucí oprava položky se tak hned projeví i ve starším náhledu).
// =====================================================

// Nastaví vzhled a chování tlačítka "Náklady akce" podle toho, jestli už
// pro danou akci existují nějaké položky nákladů. Bez položek je tlačítko
// vizuálně zašedlé a klik na něj nic neudělá — vytvořit je jde jen dlouhým
// podržením (viz wireExpenseBtn), stejně jako podle zadání.
// Vlastní okénko na heslo místo nativního prompt() — prompt() vždycky
// vyvolá textovou klávesnici a nejde mu nastavit inputmode, takže by se
// u čtyřmístného čísla furt otvírala celá abeceda. Zůstává to Promise, ať se
// dá v dlouhém podržení počkat na výsledek přes await, stejně jako na prompt().
// =====================================================
// KDO CO PŘINESE — u nadcházejících akcí, hned nad Nákladi akce (ty jsou zas
// jen u minulých). Na rozdíl od nákladů žádné heslo — je to otevřené
// koordinování dopředu, ne účtování zpětně, takže by nemělo klást žádné
// překážky. Položky žijí jako samostatné dokumenty v podkolekci (ne jedno
// pole se seznamem v jednom dokumentu), aby si dva lidi mohli v stejnou
// chvíli přihlásit/odhlásit RŮZNÉ položky bez vzájemného přepsání.
// =====================================================

// Doplní za text tlačítka "Kdo co přinese" počet položek (jen když už nějaké
// jsou) a zapojí krátký stisk (otevře seznam) i skryté dlouhé podržení
// (pošle notifikaci celé partě po zadání hesla — viz broadcastBringList níže).
// Stejný osvědčený vzor jako u expenseBtn: skutečná akce se spouští až na
// touchend, ne na obyčejný onclick, ať se to spolehlivě odliší od dlouhého
// podržení i na iOS.
// Jen obnoví počet na tlačítku "Kdo co přinese" (bez znovu-navěšování
// dotykových posluchačů) — volá se z wireBringBtn při prvním vykreslení
// karty, a znovu po zavření otevřeného seznamu, ať se hned promítne
// cokoliv, co se v seznamu mezitím vzalo/pustilo/přidalo.
async function refreshBringBtnCount(idx, key){
  const countEl = document.getElementById('bringBtnCount_'+idx);
  if(!countEl) return;
  try{
    const snap = await db.collection('bringLists').doc(key).collection('items').get();
    if(snap.empty){
      countEl.textContent = '';
    } else {
      let taken = 0, free = 0;
      snap.forEach(d => { if(d.data().takenBy) taken++; else free++; });
      countEl.innerHTML = ` ${snap.size} (<span style="color:var(--accent);">${taken}</span>/<span style="color:var(--coral);">${free}</span>)`;
    }
  }catch(e){ console.error('Chyba při načítání počtu položek:', e); }
}

async function wireBringBtn(idx, key, ev){
  const btn = document.getElementById('bringBtn_'+idx);
  if(!btn) return;
  await refreshBringBtnCount(idx, key);

  let pressTimer, longPressed = false, startX = 0, startY = 0;
  btn.style.userSelect = 'none'; btn.style.webkitUserSelect = 'none'; btn.style.webkitTouchCallout = 'none';
  // POZOR: touchstart musí volat preventDefault() (a poslouchat s
  // {passive:false}), jinak si Android/Chrome po touchend ještě navíc
  // připraví svůj vlastní syntetický "click" — ten pak dokázal rovnou
  // zavřít okno, co jsme sami v touchend otevřeli, a tlačítko vypadalo
  // "mrtvé" (fungovalo jen dlouhé podržení, protože to jede čistě přes
  // setTimeout). Stejný vzor jako u expenseBtn výš.
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      const pwd = await askBroughtEditPassword();
      if(pwd === null) return;
      if(pwd !== '9640'){ alert('Špatné heslo.'); return; }
      openBroughtEditor(key, ev);
    }, 550);
  }, {passive:false});
  btn.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    e.preventDefault();
    if(longPressed) return;
    openBringList(key, ev);
  });
  btn.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  btn.addEventListener('contextmenu', e => e.preventDefault());
  // Záskok pro myš (desktop.html/prohlížeč bez dotyků) — touch událostem
  // se tu nic nespustí, takže obyčejný klik zůstává jako jediná cesta dovnitř.
  btn.addEventListener('click', () => { if(!('ontouchstart' in window)) openBringList(key, ev); });
}

// Skryté heslo pro rozeslání "Co kdo donese?" celé partě (dlouhé podržení
// tlačítka). Jiné heslo než u Nákladů akce, samostatný modál.
// U proběhlé/probíhající akce — jen ke ČTENÍ, žádné "Beru"/"Pustit" tlačítka.
// Zdroj dat je stejná kolekce jako u "Kdo co přinese" (appka ji nijak
// nekopíruje ani neuzamyká po startu akce — je to prostě týž seznam, jen se
// mu tady dívá jinou "optikou", zpětně).
function askBroughtEditPassword(){
  return new Promise((resolve) => {
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop';
    backdrop.onclick = e => { if(e.target===backdrop){ backdrop.remove(); resolve(null); } };
    backdrop.innerHTML = `
      <div class="ev-modal" style="text-align:center;">
        <div class="sheet-grabber-down" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
        <div class="ev-modal-title" style="margin-bottom:14px;">🔒 Heslo pro úpravu seznamu Přinesli</div>
        <input id="broughtPwdInput" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Heslo" style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:20px;padding:12px;border-radius:var(--radius-sm);outline:none;margin-bottom:14px;">
        <div style="display:flex;gap:8px;">
          <button id="broughtPwdCancel" style="flex:1;padding:11px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;">Zrušit</button>
          <button id="broughtPwdOk" style="flex:1;padding:11px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;cursor:pointer;">OK</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    const input = document.getElementById('broughtPwdInput');
    setTimeout(() => input.focus(), 60);
    const finish = (val) => { backdrop.remove(); resolve(val); };
    document.getElementById('broughtPwdCancel').onclick = () => finish(null);
    document.getElementById('broughtPwdOk').onclick = () => finish(input.value);
    input.addEventListener('keydown', e => { if(e.key==='Enter') finish(input.value); });
  });
}

async function wireBroughtBtn(idx, key, ev){
  const btn = document.getElementById('broughtBtn_'+idx);
  if(!btn) return;
  let hasItems = false;
  try{
    const snap = await db.collection('bringLists').doc(key).collection('items').limit(1).get();
    hasItems = !snap.empty;
  }catch(e){ console.error('Chyba při načítání seznamu věcí:', e); }
  btn.style.opacity = hasItems ? '1' : '0.45';

  // Krátký stisk = jen náhled (a jen když už něco je, viz hasItems výš).
  // Dlouhé podržení + heslo 9640 = editace seznamu — funguje i u prázdného
  // seznamu, ať jde retroaktivně něco přidat, i když se to předem přes
  // "Kdo co přinese" vůbec neřešilo.
  let pressTimer, longPressed = false, startX = 0, startY = 0;
  btn.style.userSelect = 'none'; btn.style.webkitUserSelect = 'none'; btn.style.webkitTouchCallout = 'none';
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      const pwd = await askBroughtEditPassword();
      if(pwd === null) return;
      if(pwd !== '9640'){ alert('Špatné heslo.'); return; }
      openBroughtEditor(key, ev);
    }, 550);
  }, {passive:false});
  btn.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    e.preventDefault();
    if(longPressed) return;
    if(hasItems) openBroughtList(key, ev);
  });
  btn.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', () => { if(!('ontouchstart' in window) && hasItems) openBroughtList(key, ev); });
}

async function openBroughtList(key, ev){

// Skrytá editace seznamu "Přinesli" u proběhlé akce (dlouhé podržení + heslo,
// viz wireBroughtBtn výš) — na rozdíl od openBroughtList tady jde jméno u
// položky zapsat libovolně (ne jen "beru za sebe" jako před akcí), položky
// přidávat i mazat. Ukládá se rovnou při opuštění políčka, žádné velké
// "Uložit" tlačítko na konci.
async function openBroughtEditor(key, ev){
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal">
      <div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="margin-bottom:2px;">✏️ Upravit „Přinesli“</div>
      <div style="font-family:'Inter', sans-serif;font-size:12.5px;color:var(--muted);margin-bottom:14px;text-align:center;">${ev.title||''}</div>
      <button id="broughtExportBtn" style="display:block;width:100%;margin-bottom:12px;padding:10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;">📤 Export do nákladů</button>
      <div id="broughtEditList" style="text-align:left;max-height:42vh;overflow-y:auto;margin-bottom:10px;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
      <div style="display:flex;gap:6px;">
        <input id="broughtNewName" placeholder="Nová položka…" style="flex:1.3;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;padding:9px 10px;border-radius:var(--radius-sm);outline:none;">
        <select id="broughtNewTaken" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;padding:9px 6px;border-radius:var(--radius-sm);outline:none;"><option value="">nikdo</option></select>
        <button id="broughtAddBtn" style="flex:0 0 auto;background:var(--accent);border:none;color:#fff;font-weight:700;font-size:13px;padding:0 14px;border-radius:var(--radius-sm);cursor:pointer;">+</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  const listEl = document.getElementById('broughtEditList');
  const itemsCol = db.collection('bringLists').doc(key).collection('items');

  // Seznam všech členů party pro rozbalovací "kdo" — místo psaní jména ručně.
  let partyNames = [];
  try{
    partyNames = await getAllKnownPartyNames();
  }catch(e){ console.error('Chyba při načítání seznamu party:', e); }
  // "Jiný…" na konci umožní zapsat i někoho mimo appku (viz
  // resolveTakenSelectValue níž) — jméno se pak dopíše jako vlastní <option>,
  // ať zůstane u položky vidět i po přenačtení.
  const takenOptions = (selected) => {
    let opts = `<option value="">nikdo</option>` + partyNames.map(n =>
      `<option value="${n}" ${n===selected?'selected':''}>${n}</option>`
    ).join('');
    if(selected && !partyNames.includes(selected)){
      opts += `<option value="${selected}" selected>${selected}</option>`;
    }
    opts += `<option value="__other__">Jiný…</option>`;
    return opts;
  };
  document.getElementById('broughtNewTaken').innerHTML = takenOptions('');

  // Po výběru "Jiný…" appka rovnou zeptá na jméno a přidá ho do selectu jako
  // novou volbu — funguje stejně u řádku i u pole pro novou položku.
  function resolveTakenSelectValue(selectEl){
    if(selectEl.value !== '__other__') return selectEl.value;
    const custom = prompt('Jméno:');
    if(!custom || !custom.trim()){ selectEl.value = ''; return ''; }
    const val = custom.trim();
    const otherOpt = [...selectEl.options].find(o => o.value === '__other__');
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    selectEl.insertBefore(opt, otherOpt);
    selectEl.value = val;
    return val;
  }

  const renderRow = (id, name, taken) => `
    <div data-row="${id}" style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);">
      <input class="bi-name" data-id="${id}" value="${name.replace(/"/g,'&quot;')}" style="flex:1.3;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;padding:7px 8px;border-radius:8px;outline:none;">
      <select class="bi-taken" data-id="${id}" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-family:'Inter',sans-serif;font-size:16px;padding:7px 4px;border-radius:8px;outline:none;">${takenOptions(taken)}</select>
      <button data-del="${id}" style="flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;">${trashIconSVG()}</button>
    </div>`;

  const wireRow = (id) => {
    const row = listEl.querySelector(`[data-row="${id}"]`);
    if(!row) return;
    // eventStart/eventTitle se dopisují při KAŽDÉ úpravě schválně — starší
    // položky (zadané ještě před tím, než appka datum akce u položek vůbec
    // ukládala) ho nemají, takže si Cloud Function neměla podle čeho ověřit,
    // že jde o proběhlou akci, a notifikaci (i tobě) přesto poslala. Tímhle
    // se to při první úpravě "dohojí" i zpětně.
    const retroFields = { eventStart: ev.start ? ev.start.toISOString() : '', eventTitle: ev.title || '' };
    row.querySelector('.bi-name').addEventListener('blur', async (e) => {
      try{ await itemsCol.doc(id).update({ name: e.target.value.trim() || '(bez názvu)', ...retroFields }); }catch(err){ console.error(err); }
    });
    row.querySelector('.bi-taken').addEventListener('change', async (e) => {
      const val = resolveTakenSelectValue(e.target);
      try{ await itemsCol.doc(id).update({ takenBy: val || null, ...retroFields }); }catch(err){ console.error(err); }
    });
    row.querySelector('[data-del]').onclick = async () => {
      if(!confirm('Smazat tuhle položku?')) return;
      try{ await itemsCol.doc(id).delete(); row.remove(); }catch(err){ console.error(err); }
    };
  };

  try{
    const snap = await itemsCol.orderBy('at').get();
    if(snap.empty){
      listEl.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px;">Zatím žádné položky.</div>';
    } else {
      listEl.innerHTML = snap.docs.map(d => renderRow(d.id, d.data().name || '', d.data().takenBy || '')).join('');
      snap.docs.forEach(d => wireRow(d.id));
    }
  }catch(e){
    console.error('Chyba při načítání seznamu věcí:', e);
    listEl.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:12px;">Nepodařilo se načíst</div>';
  }

  document.getElementById('broughtAddBtn').onclick = async () => {
    const nameInput = document.getElementById('broughtNewName');
    const takenSelect = document.getElementById('broughtNewTaken');
    const name = nameInput.value.trim();
    if(!name) return;
    const taken = resolveTakenSelectValue(takenSelect);
    try{
      // eventStart se posílá spolu s položkou schválně — Cloud Function podle
      // něj pozná, že jde o už proběhlou akci, a NEPOŠLE kvůli týhle úpravě
      // žádnou notifikaci (na rozdíl od živého "Kdo co přinese" před akcí,
      // kde notifikace smysl dávají).
      const ref = await itemsCol.add({
        name, takenBy: taken || null, addedBy: getUserName() || '', eventTitle: ev.title || '',
        eventStart: ev.start ? ev.start.toISOString() : '', at: new Date().toISOString(),
      });
      if(listEl.querySelector('div')?.textContent === 'Zatím žádné položky.') listEl.innerHTML = '';
      listEl.insertAdjacentHTML('beforeend', renderRow(ref.id, name, taken));
      wireRow(ref.id);
      nameInput.value = ''; takenSelect.value = '';
    }catch(e){ console.error('Chyba při přidávání položky:', e); alert('Nepodařilo se přidat položku.'); }
  };

  document.getElementById('broughtExportBtn').onclick = () => openBroughtExportPicker(key, ev, itemsCol);
}

// Zaškrtávací výběr z "Přinesli" -> "Náklady akce" (viz tlačítko "📤 Export do
// nákladů" v openBroughtEditor výš). Náklady mají teď stejné heslo (9640)
// takže se pořád ptá, i když se sem přišlo skrz editor Přinesli (9640) —
// stejná hranice jako běžný vstup do Nákladů akce.
async function openBroughtExportPicker(key, ev, itemsCol){
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal">
      <div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:12px;">📤 Export do nákladů</div>
      <div id="exportPickList" style="text-align:left;max-height:44vh;overflow-y:auto;margin-bottom:14px;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
      <button id="exportPickBtn" style="display:block;width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;cursor:pointer;">Přidat vybrané do nákladů</button>
    </div>`;
  document.body.appendChild(backdrop);

  const listEl = document.getElementById('exportPickList');
  let names = [];
  try{
    const snap = await itemsCol.orderBy('at').get();
    names = [...new Set(snap.docs.map(d => (d.data().name || '').trim()).filter(Boolean))];
    listEl.innerHTML = names.length
      ? names.map((n, i) => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);cursor:pointer;">
          <input type="checkbox" data-name="${n.replace(/"/g,'&quot;')}" style="width:18px;height:18px;flex:0 0 auto;">
          ${n}
        </label>`).join('')
      : '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Seznam Přinesli je prázdný.</div>';
  }catch(e){
    console.error('Chyba při načítání seznamu věcí:', e);
    listEl.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:12px;">Nepodařilo se načíst</div>';
    return;
  }

  document.getElementById('exportPickBtn').onclick = async () => {
    const picked = [...listEl.querySelectorAll('[data-name]:checked')].map(c => c.dataset.name);
    if(!picked.length){ alert('Vyber aspoň jednu položku.'); return; }
    const pwd = await askExpensePassword(ev);
    if(pwd !== '9640'){ if(pwd !== null) alert('Špatné heslo'); return; }
    let currentItems = [], currentContributions = [];
    try{
      const expSnap = await db.collection('expensePdfs').doc(key).get();
      if(expSnap.exists){
        currentItems = expSnap.data().items || [];
        currentContributions = expSnap.data().contributions || [];
      }
    }catch(e){ console.error('Chyba při načítání nákladů:', e); }
    const merged = [...currentItems, ...picked.map(name => ({ name, qty: '', price: 0 }))];
    backdrop.remove();
    openExpenseEditor(key, ev, merged, currentContributions);
  };
}

function askBringBroadcastPassword(){
  return new Promise((resolve) => {
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

// Skutečné odeslání — jen když seznam má aspoň jednu položku a heslo sedí.
// Zapíše se dokument do bringBroadcasts/, o zbytek (notifikace celé partě
// s proklikem rovnou do tohoto seznamu) se postará Cloud Function.
// Dlouhé podržení titulku "🎒 Kdo co přinese" UVNITŘ otevřeného seznamu (ne
// tlačítka na kartě — to teď otevírá editaci, viz wireBringBtn výš) — pošle
// notifikaci celé partě. Stejný vzor jako u náhledu nákladů
// (wireExpenseReceiptBroadcast) — žádné heslo, protože samotný seznam taky
// žádné nevyžaduje.
function wireBringListTitleBroadcast(key, ev){
  const el = document.getElementById('bringListTitle');
  if(!el) return;
  let pressTimer, longPressed = false, startX = 0, startY = 0;
  el.style.userSelect = 'none'; el.style.webkitUserSelect = 'none'; el.style.webkitTouchCallout = 'none';
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      await broadcastBringList(key, ev);
    }, 550);
  }, {passive:false});
  el.addEventListener('touchend', e => { clearTimeout(pressTimer); e.preventDefault(); });
  el.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  el.addEventListener('contextmenu', e => e.preventDefault());
}

async function broadcastBringList(key, ev){
  let hasItems = false;
  try{
    const snap = await db.collection('bringLists').doc(key).collection('items').limit(1).get();
    hasItems = !snap.empty;
  }catch(e){ console.error('Chyba při kontrole seznamu:', e); return; }
  if(!hasItems){ alert('Seznam je zatím prázdný — nejdřív přidej aspoň jednu položku.'); return; }

  const pwd = await askBringBroadcastPassword();
  if(pwd === null) return;
  if(pwd !== '9640'){ alert('Špatné heslo.'); return; }

  const me = getUserName();
  try{
    await db.collection('bringBroadcasts').add({
      eventKey: key,
      eventTitle: ev.title || '',
      requestedBy: me || '',
      at: new Date().toISOString(),
    });
    alert('Upozornění odesláno celé partě.');
  }catch(e){ console.error('Chyba při odesílání upozornění:', e); alert('Nepodařilo se odeslat upozornění.'); }
}

async function wireExpenseBtn(idx, key, ev){
  const btn = document.getElementById('expenseBtn_'+idx);
  if(!btn) return;
  let items = [];
  let contributions = [];
  try{
    const snap = await db.collection('expensePdfs').doc(key).get();
    if(snap.exists){
      items = snap.data().items || [];
      contributions = snap.data().contributions || [];
    }
  }catch(e){ console.error('Chyba při načítání nákladů akce:', e); }

  // Aktuální stav se drží přímo na tlačítku (ne jen v uzávěru téhle funkce),
  // ať ho jde po vytvoření/úpravě nákladů zvenku (viz openExpenseEditor)
  // jednoduše přepsat, aniž by bylo potřeba znovu registrovat posluchače
  // dotyku — to by totiž vedlo k jejich zdvojení a dlouhé podržení by pak
  // zbytečně spouštělo akci dvakrát.
  btn._expenseItems = items;
  btn._expenseContributions = contributions;
  btn._expenseHasData = items.length > 0;
  btn.style.opacity = btn._expenseHasData ? '1' : '0.45';
  btn.style.cursor = btn._expenseHasData ? 'pointer' : 'default';

  // POZOR: normální onclick tady nestačí. Jakmile má tlačítko i vlastní
  // touchstart/touchend logiku (kvůli dlouhému podržení), spolehlivější je
  // krátký dotek řešit přímo v touchend (stejný vzor jako u Dojdu/Nedojdu
  // výš) — jinak se na některých zařízeních prohlížeč zmate v tom, jestli
  // ještě má/nemá vyvolat i normální klik, a tlačítko pak vypadá "mrtvé".
  let pressTimer, longPressed = false, startX = 0, startY = 0;
  btn.style.userSelect = 'none';
  btn.style.webkitUserSelect = 'none';
  btn.style.webkitTouchCallout = 'none';
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      const pwd = await askExpensePassword(ev);
      if(pwd !== '9640'){ if(pwd !== null) alert('Špatné heslo'); return; }
      // Znovu načte aktuální položky z Firestore, ať editor neotevře starou
      // (prázdnou) kopii z doby, kdy se karta poprvé vykreslila, kdyby mezi
      // tím uživatel náklady ve stejné relaci už jednou vytvořil/upravil.
      let currentItems = btn._expenseItems;
      let currentContributions = btn._expenseContributions;
      try{
        const snap = await db.collection('expensePdfs').doc(key).get();
        if(snap.exists){
          currentItems = snap.data().items || [];
          currentContributions = snap.data().contributions || [];
        }
      }catch(e){}
      openExpenseEditor(key, ev, currentItems, currentContributions);
    }, 500);
  }, {passive:false});
  btn.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    e.preventDefault();
    if(longPressed) return;
    if(btn._expenseHasData) showExpenseReceipt(key, ev, btn._expenseItems, btn._expenseContributions);
  });
  btn.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  btn.addEventListener('contextmenu', e => e.preventDefault());
  // Fallback pro myš (desktop, kde touch eventy nechodí)
  btn.addEventListener('click', () => {
    if(!('ontouchstart' in window) && btn._expenseHasData) showExpenseReceipt(key, ev, btn._expenseItems, btn._expenseContributions);
  });
}

    `).join('');
    const contribRows = contributions.map((c, i) => `
      <div data-type="contrib" data-idx="${i}" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;font-size:13px;cursor:pointer;">
        <span style="flex:1;color:var(--accent);display:flex;align-items:center;gap:6px;">${moneyIconSVG()}přispěl(a) ${c.name}</span>
        <span style="color:var(--accent);font-weight:600;min-width:60px;text-align:right;">${c.amount} Kč</span>
        <button data-remove="contrib" data-idx="${i}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1;">×</button>
      </div>
    `).join('');
    listEl.innerHTML = (itemRows + contribRows) || `<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px;">Zatím žádné položky</div>`;

    listEl.querySelectorAll('[data-remove]').forEach(delBtn => {
      delBtn.onclick = (e) => {
        e.stopPropagation();
        const i = Number(delBtn.dataset.idx);
        if(delBtn.dataset.remove === 'item') items.splice(i,1); else contributions.splice(i,1);
        if(editing && editing.type === (delBtn.dataset.remove === 'item' ? 'item' : 'contrib') && editing.index === i) resetEditing();
        renderItemsList();
      };
    });
    listEl.querySelectorAll('[data-type]').forEach(row => {
      row.onclick = () => {
        const i = Number(row.dataset.idx);
        const type = row.dataset.type;
        editing = { type, index: i };
        if(type === 'item'){
          const it = items[i];
          nameInput.value = it.name;
          qtyInput.value = it.qty || '';
          priceInput.value = it.price;
        } else {
          const c = contributions[i];
          nameInput.value = 'přispěl(a) ' + c.name;
          qtyInput.value = '';
          priceInput.value = c.amount;
        }
        addBtn.textContent = 'Uložit';
        nameInput.focus();
      };
    });
  }
  renderItemsList();

  addBtn.onclick = () => {
    const rawName = nameInput.value.trim();
    const price = parseFloat(priceInput.value.replace(',','.'));
    if(!rawName || isNaN(price)){ alert('Vyplň aspoň položku a cenu.'); return; }

    // "přispěl(a) JMÉNO" — diakriticky netečné porovnání (normalizeCz), ať to
    // pozná i bez háčků/čárek; jméno se ale uloží tak, jak ho člověk napsal.
    const normalized = normalizeCz(rawName);
    const prefixMatch = normalized.match(/^prispel[a]?\s*/);
    if(prefixMatch){
      const contributorName = rawName.slice(prefixMatch[0].length).replace(/^[:\-\s]+/, '').trim();
      if(!contributorName){ alert('Chybí jméno za "přispěl(a)".'); return; }
      const entry = { name: contributorName, amount: Math.round(price) };
      if(editing && editing.type === 'contrib') contributions[editing.index] = entry;
      else contributions.push(entry);
    } else {
      const qty = qtyInput.value.trim();
      const entry = { name: rawName, qty, price: Math.round(price) };
      if(editing && editing.type === 'item') items[editing.index] = entry;
      else items.push(entry);
    }

    nameInput.value = ''; qtyInput.value = ''; priceInput.value = '';
    resetEditing();
    nameInput.focus();
    renderItemsList();
  };

  document.getElementById('expCreateBtn').onclick = async () => {
    if(!items.length && !contributions.length){ alert('Přidej aspoň jednu položku.'); return; }
    const createBtn = document.getElementById('expCreateBtn');
    createBtn.disabled = true;
    createBtn.textContent = 'Ukládám…';
    try{
      await db.collection('expensePdfs').doc(key).set({
        eventTitle: ev.title || '',
        eventStart: ev.start ? ev.start.toISOString() : '',
        items,
        contributions,
        updatedAt: new Date().toISOString(),
      });
      backdrop.remove();
      showExpenseReceipt(key, ev, items, contributions);
      // Znovu prověří stav tlačítka na kartě (teď už s daty -> přestane být
      // zašedlé) — přepíše se jen stav uložený na samotném tlačítku (viz
      // wireExpenseBtn), žádné nové posluchače dotyku se nepřidávají (ty se
      // věší jen jednou při vykreslení karty, zdvojení by dlouhé podržení
      // spouštělo víckrát najednou).
      document.querySelectorAll('[id^="expenseBtn_"]').forEach(b => {
        const idx = b.id.replace('expenseBtn_','');
        if(window['evKey_'+idx] === key){
          b._expenseItems = items;
          b._expenseContributions = contributions;
          b._expenseHasData = true;
          b.style.opacity = '1';
          b.style.cursor = 'pointer';
        }
      });
    }catch(e){
      console.error('Chyba při ukládání nákladů akce:', e);
      alert('Nepodařilo se uložit náklady akce.');
      createBtn.disabled = false;
      createBtn.textContent = 'Vytvořit';
    }
  };
}

// Ukáže náklady akce jako jednoduchý náhled přímo v appce — přesně podle
// vzorového formátu (nadpis, datum, tabulka položek, celkové náklady, řádek
// "přispěli"/"plus-mínus" a QR kód s platebními údaji dole), ale jako obyčejné
// HTML, ne PDF. Zkoušelo se to dřív přes knihovnu jsPDF, ta ale neumí česká
// písmenka (diakritika mizela/rozjížděla se) a appka žádné PDF soubor
// stejně nepotřebovala — stačí náhled, ne něco k odeslání/vytištění mimo appku.
//
// plus/mínus = celkové náklady mínus součet příspěvků (může vyjít i záporně,

  `).join('') : `<div style="font-size:12.5px;color:var(--muted);text-align:left;">zatím nikdo</div>`;
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal" style="text-align:center;">
      <div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" id="expenseReceiptTitle" style="margin-bottom:2px;">${ev.title || ''}</div>
      <div style="font-family:'Inter', sans-serif;font-size:12.5px;color:var(--muted);margin-bottom:16px;">${dateStr}</div>
      <div style="text-align:left;display:flex;justify-content:space-between;font-family:'Inter', sans-serif;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;padding-bottom:6px;border-bottom:1px solid var(--line);">

      </div>
      <div style="margin-top:10px;font-family:'Inter', sans-serif;text-align:left;">

  document.body.appendChild(backdrop);
  wireExpenseReceiptBroadcast(key, ev);

// Skryté dlouhé podržení názvu akce v náhledu nákladů — pošle notifikaci
// jen lidem, co jsou u akce v "Zúčastnili se" (ne celé partě), s proklikem
// rovnou zpátky do tohohle náhledu nákladů. Žádné heslo — kdo se sem
// dostal (náhled nákladů nikdy heslo nevyžadoval), může i tohle.
function wireExpenseReceiptBroadcast(key, ev){
  const el = document.getElementById('expenseReceiptTitle');
  if(!el) return;
  let pressTimer, longPressed = false, startX = 0, startY = 0;
  el.style.userSelect = 'none'; el.style.webkitUserSelect = 'none'; el.style.webkitTouchCallout = 'none';
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      await broadcastExpenseToAttendees(key, ev);
    }, 550);
  }, {passive:false});
  el.addEventListener('touchend', e => { clearTimeout(pressTimer); e.preventDefault(); });
  el.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  el.addEventListener('contextmenu', e => e.preventDefault());
}

async function broadcastExpenseToAttendees(key, ev){
  let recipients = [];
  try{
    const attendSnap = await db.collection('events').doc(key).collection('attendees').get();
    recipients = attendSnap.docs.map(d => d.id);
  }catch(e){ console.error('Chyba při načítání zúčastněných:', e); alert('Nepodařilo se načíst seznam zúčastněných.'); return; }
  if(!recipients.length){ alert('U téhle akce zatím nikdo není v "Zúčastnili se".'); return; }
  try{
    await db.collection('expenseBroadcasts').add({
      eventKey: key, eventTitle: ev.title || '', requestedBy: getUserName() || '',
      recipients, at: new Date().toISOString(),
    });
    alert('Upozornění odesláno zúčastněným.');
  }catch(e){ console.error('Chyba při odesílání upozornění:', e); alert('Nepodařilo se odeslat upozornění.'); }
}

// součtem dole — bez QR kódu a bez poděkování (na rozdíl od showExpenseReceipt
// tohle není platební výzva k jedné konkrétní akci, jen čtecí souhrn). Bere
// v potaz jen akce, co už nějaké náklady mají zadané (expensePdfs).
async function showYearlyExpenseSummary(year){
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal" style="text-align:center;">
      <div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;">${calendarIconSVG()} Náklady za rok ${year}</div>
      <div id="yearSummaryList" style="text-align:left;">
        <div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  const listEl = document.getElementById('yearSummaryList');
  try{
    const snap = await db.collection('expensePdfs').get();
    const rows = [];
    snap.forEach(d => {
      const data = d.data();
      if(!data.eventStart) return;
      const dt = new Date(data.eventStart);
      if(dt.getFullYear() !== year) return;
      const cost = (data.items||[]).reduce((s,it) => s + (Number(it.price)||0), 0);
      const contrib = (data.contributions||[]).reduce((s,c) => s + (Number(c.amount)||0), 0);
      rows.push({ title: data.eventTitle || '(bez názvu)', dt, cost, contrib });
    });
    rows.sort((a,b) => a.dt - b.dt);

    if(!rows.length){
      listEl.innerHTML = `<div style="color:var(--muted);font-size:12.5px;text-align:center;padding:12px;">Za rok ${year} zatím nemá žádná akce zadané náklady.</div>`;
      return;
    }

    const grandCost = rows.reduce((s,r) => s + r.cost, 0);
    const grandContrib = rows.reduce((s,r) => s + r.contrib, 0);

    const rowsHtml = rows.map(r => `
      <div style="padding:9px 0;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;">
        <div style="font-size:13.5px;font-weight:600;color:var(--ink);">${r.title}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:3px;">${DAYS_FULL[r.dt.getDay()]} ${r.dt.getDate()}.${r.dt.getMonth()+1}.${r.dt.getFullYear()}</div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;">
          <span style="color:var(--coral);">náklady: ${r.cost} Kč</span>
          <span style="color:var(--accent);">příspěvky: ${r.contrib} Kč</span>
        </div>
      </div>
    `).join('');

    listEl.innerHTML = `
      ${rowsHtml}
      <div style="margin-top:14px;font-family:'Inter', sans-serif;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:var(--ink);">celkové náklady</span>
          <span style="font-size:18px;font-weight:700;color:var(--coral);">${grandCost} Kč</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <span style="font-size:13px;color:var(--ink);">celkové příspěvky</span>
          <span style="font-size:18px;font-weight:700;color:var(--accent);">${grandContrib} Kč</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <span style="font-size:13px;color:var(--ink);">plus/mínus</span>
          <span style="font-size:18px;font-weight:700;color:var(--ink);">${grandCost - grandContrib} Kč</span>
        </div>
      </div>
    `;
  }catch(e){
    console.error('Chyba při načítání ročního přehledu nákladů:', e);
    listEl.innerHTML = `<div style="color:var(--muted);font-size:12.5px;text-align:center;padding:12px;">Nepodařilo se načíst přehled.</div>`;
  }
}


// Jeden dotaz na osobu, ale jen jednou pro každé jedinečné jméno v seznamu.
async function fillAvatars(container){
  const spans = container.querySelectorAll('.mini-avatar');
  if(!spans.length) return;
  try{
    const names = [...new Set([...spans].map(s => s.dataset.name))];
    const results = await Promise.all(names.map(n => db.collection('userProfiles').doc(n).get()));
    const map = {};
    names.forEach((n,i) => { map[n] = (results[i].exists && results[i].data().avatar) ? results[i].data().avatar : ''; });
    spans.forEach(s => { s.textContent = map[s.dataset.name] || ''; });
  }catch(e){ /* necháme výchozí 👤 */ }
}

async function refreshAttendance(evIdx, key, isFuture){
  try{
    const [attendSnap, declineSnap] = await Promise.all([
      db.collection('events').doc(key).collection('attendees').get(),
      db.collection('events').doc(key).collection('declines').get()
    ]);
    const user = localStorage.getItem('kokrsnekUser');
    if(isFuture){
      const going = attendSnap.docs.some(d => d.id === user);
      const notGoing = declineSnap.docs.some(d => d.id === user);
      const attendBtn = document.getElementById('attendBtn_'+evIdx);
      if(attendBtn){
        attendBtn.textContent = (going ? '👍 Jdu' : '👍 Dojdu') + (attendSnap.size ? ' ('+attendSnap.size+')' : '');
        attendBtn.style.color = going ? 'var(--accent)' : 'var(--ink)';
        attendBtn.style.borderColor = going ? 'var(--accent)' : 'var(--line)';
      }
      const declineBtn = document.getElementById('declineBtn_'+evIdx);
      if(declineBtn){
        declineBtn.textContent = (notGoing ? '👎 Nejdu' : '👎 Nedojdu') + (declineSnap.size ? ' ('+declineSnap.size+')' : '');
        declineBtn.style.color = notGoing ? 'var(--coral)' : 'var(--ink)';
        declineBtn.style.borderColor = notGoing ? 'var(--coral)' : 'var(--line)';
      }
    } else {
      const row = document.getElementById('attendedRow_'+evIdx);
      if(row){
        const parts = [];
        const attendNames = attendSnap.docs.map(d => d.id);
        parts.push(`<div class="ev-modal-label">Zúčastnili se</div><div id="attendedNamesVal_${evIdx}" class="ev-modal-value" style="cursor:pointer;">${attendNames.length ? attendNames.join(', ') : '—'}</div>`);
        if(!declineSnap.empty){
          const names = declineSnap.docs.map(d => d.id).join(', ');
          parts.push(`<div class="ev-modal-label">Nedorazili</div><div class="ev-modal-value" style="cursor:pointer;" onclick="showDecliners(${evIdx}, window['evKey_'+${evIdx}])">${names}</div>`);
        }
        // "Zúčastnili se" se u minulých akcí zobrazuje VŽDYCKY (i prázdné,
        // jako "—") — na rozdíl od dřívějška, kdy se celý řádek schoval,
        // když nikdo nedal Dojdu. Potřebuje totiž mít vždycky kam dlouze
        // podržet kvůli skryté opravě docházky (viz wireAttendedEdit níže).
        row.style.display = 'block';
        row.innerHTML = parts.join('');
        wireAttendedEdit(evIdx, key);
      }
    }
  }catch(e){ console.error('attendance refresh error',e); }
}

// Skryté podržení na "Zúčastnili se" u minulé/probíhající akce — krátký
// stisk pořád jen otevírá běžný přehled (showAttendees), dlouhé podržení po
// zadání hesla otevře editor pro dodatečnou opravu docházky (typicky: někdo
// neřekl Dojdu předem, ale nakonec na akci dorazil). Stejný osvědčený vzor
// dotykových událostí jako u bringBtn/expenseBtn výš.
function wireAttendedEdit(evIdx, key){
  const el = document.getElementById('attendedNamesVal_'+evIdx);
  if(!el) return;
  let pressTimer, longPressed = false, startX = 0, startY = 0;
  el.style.userSelect = 'none'; el.style.webkitUserSelect = 'none'; el.style.webkitTouchCallout = 'none';
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
    pressTimer = setTimeout(async () => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      const pwd = await askAttendeesEditPassword();
      if(pwd === null) return;
      if(pwd !== '9640'){ alert('Špatné heslo.'); return; }
      openAttendeesEditor(evIdx, key);
    }, 550);
  }, {passive:false});
  el.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    e.preventDefault();
    if(longPressed) return;
    showAttendees(evIdx, key);
  });
  el.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
  }, {passive:true});
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', () => { if(!('ontouchstart' in window)) showAttendees(evIdx, key); });
}

function askAttendeesEditPassword(){
  return new Promise((resolve) => {
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop';
    backdrop.onclick = e => { if(e.target===backdrop){ backdrop.remove(); resolve(null); } };
    backdrop.innerHTML = `
      <div class="ev-modal" style="text-align:center;">
        <div class="sheet-grabber-down" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
        <div class="ev-modal-title" style="margin-bottom:14px;">🔒 Heslo pro opravu docházky</div>
        <input id="attendPwdInput" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Heslo" style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:20px;padding:12px;border-radius:var(--radius-sm);outline:none;margin-bottom:14px;">

          <button id="attendPwdOk" style="flex:1;padding:11px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;cursor:pointer;">OK</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    const input = document.getElementById('attendPwdInput');
    setTimeout(() => input.focus(), 60);
    const finish = (val) => { backdrop.remove(); resolve(val); };

  imageInput.addEventListener('change', () => {
    const picked = imageInput.files ? [...imageInput.files] : [];
    selectedFiles = [...selectedFiles, ...picked].slice(0, MAX_COMMENT_IMAGES);

        const perImageBudget = Math.max(120*1024, Math.floor(820*1024 / selectedFiles.length));

        const list = document.getElementById('commentList_'+evIdx);

      }, 200);
    }catch(e){
      sendBtn.textContent = 'Odeslat';
      sendBtn.disabled = false;
      imageBtn.disabled = false;
      alert('Chyba: '+e.message);
    }
  });

async function deleteComment(evIdx, key, docId){
  const pwd = prompt('Zadej heslo pro smazání:');
  if(pwd !== '8006293768'){ alert('Špatné heslo'); return; }
  const ref = db.collection('events').doc(key).collection('comments');
  // Smaž komentář i všechny jeho odpovědi (rekurzivně, kdyby byly odpovědi na odpovědi)
  const deleteWithReplies = async (id) => {
    const repliesSnap = await ref.where('parentId', '==', id).get();
    for(const r of repliesSnap.docs){

  refreshComments(evIdx, key);

async function toggleCommentReaction(evIdx, key, commentId, emoji){
  const user = getUserName();
  if(!user) return;
  try{
    const ref = db.collection('events').doc(key).collection('comments').doc(commentId);
    const snap = await ref.get();
    const data = snap.data() || {};
    const reactions = data.reactions || {};
    const hasReacted = (reactions[emoji] || []).includes(user);

    // Jedna aktivní reakce na osobu — nejdřív ji všude odeber, pak případně přidej k vybranému emoji
    const newReactions = {};
    Object.keys(reactions).forEach(e => {
      const filtered = (reactions[e] || []).filter(u => u !== user);
      if(filtered.length) newReactions[e] = filtered;
    });
    if(!hasReacted){
      newReactions[emoji] = [...(newReactions[emoji] || []), user];
    }
    await ref.update({ reactions: newReactions });
    refreshComments(evIdx, key);
  }catch(e){
    console.error('Chyba při ukládání reakce:', e);
  }
}

// Dlouhé podržení textu komentáře = otevři výběr emoji reakce (stejný vzor
// jako u zpráv v chatu, viz wireChatLongPress). Volá se znovu po každém
// překreslení seznamu komentářů, protože refreshComments() vždycky přepíše
// celé innerHTML a s ním zmizí i dřív přiřazené posluchače.
function wireCommentLongPress(list, evIdx, key){
  list.querySelectorAll('[data-comment-id]').forEach(el => {
    const commentId = el.dataset.commentId;
    const textEl = el.querySelector('.comment-text');
    if(!textEl) return;
    let pressTimer, longPressed = false, startX = 0, startY = 0;
    textEl.addEventListener('touchstart', e => {
      longPressed = false;
      const t = e.touches && e.touches[0];
      startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
      pressTimer = setTimeout(() => {
        longPressed = true;
        if(navigator.vibrate) navigator.vibrate(15);
        showCommentEmojiPicker(evIdx, key, commentId, textEl);
      }, 450);
    }, {passive:true});
    textEl.addEventListener('touchend', () => clearTimeout(pressTimer));
    textEl.addEventListener('touchmove', e => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
    }, {passive:true});
    textEl.addEventListener('contextmenu', e => e.preventDefault());
  });
}

// Malá bublina s 5 emoji, stejná jako v chatu (viz showChatEmojiPicker) —
// jen místo zprávy reaguje na komentář.
function showCommentEmojiPicker(evIdx, key, commentId, anchorEl){
  document.getElementById('chatEmojiPicker')?.remove();
  const rect = anchorEl.getBoundingClientRect();
  const picker = document.createElement('div');
  picker.id = 'chatEmojiPicker';
  const left = Math.max(8, Math.min(rect.left, window.innerWidth - 210));
  const top = Math.max(8, rect.top - 46);
  picker.style.cssText = `position:fixed;z-index:95;left:${left}px;top:${top}px;background:var(--bg2);border:1px solid var(--line);border-radius:100px;padding:6px 8px;display:flex;gap:8px;box-shadow:var(--shadow-md);`;
  picker.innerHTML = ['👍','❤️','😂','😮','😢'].map(em =>
    `<button data-em="${em}" style="background:none;border:none;font-size:21px;cursor:pointer;padding:2px;line-height:1;">${em}</button>`
  ).join('');
  document.body.appendChild(picker);
  picker.querySelectorAll('[data-em]').forEach(btn => {
    btn.onclick = () => { toggleCommentReaction(evIdx, key, commentId, btn.dataset.em); picker.remove(); };
  });
  setTimeout(() => {
    document.addEventListener('click', function c(e){ if(!picker.contains(e.target)){ picker.remove(); document.removeEventListener('click', c); } });
  }, 50);
}

async function refreshComments(evIdx, key){
  const list = document.getElementById('commentList_'+evIdx);
  if(!list) return;
  const QUICK_COMMENT_EMOJIS = ['👍','❤️','😂','😮','😢'];
  const currentUser = localStorage.getItem('kokrsnekUser') || '';
  try{
    const snap = await db.collection('events').doc(key).collection('comments').get();
    const docs = snap.docs.sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
    const renderComment = (d, depth) => {
      const data = d.data();
      const time = data.at ? new Date(data.at).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'}) : '';
      const indent = Math.min(depth, 4) * 12;
      const childReplies = docs.filter(r => r.data().parentId === d.id)
        .sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
      const reactions = data.reactions || {};
      // Řádek reakcí se ukazuje jen když už na komentáři nějaká reakce je
      // (ťuknutím na ni jde vlastní reakci přidat/odebrat) — výběr NOVÉ emoji
      // jde přes dlouhé podržení textu komentáře (viz wireCommentLongPress
      // níže), stejně jako u zpráv v chatu. Natrvalo vypsaných 5 ikon pod
      // každým komentářem totiž na delší diskuzi zbytečně rušilo.
      const reactionsRow = QUICK_COMMENT_EMOJIS.filter(em => (reactions[em]||[]).length > 0).map(em => {
        const users = reactions[em] || [];
        const active = users.includes(currentUser);
        return `<button onclick="toggleCommentReaction(${evIdx},'${key}','${d.id}','${em}')" style="
          background:${active ? 'var(--accent-soft)' : 'var(--surface)'};
          border:1px solid ${active ? 'rgba(62,143,104,0.5)' : 'var(--line)'};
          border-radius:100px; padding:3px 8px; font-size:12.5px; cursor:pointer;
          display:inline-flex; align-items:center; gap:3px; color:var(--ink); line-height:1.3;
        ">${em}<span style="font-size:10.5px;color:var(--muted);font-family:'Inter', sans-serif;">${users.length}</span></button>`;
      }).join('');
      return `<div data-comment-id="${d.id}" style="padding:8px 0 4px;${depth > 0 ? `margin-left:${indent}px;border-left:2px solid var(--line);padding-left:10px;` : 'border-bottom:1px solid var(--line);'}">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span ${personLink(data.user)} style="font-size:12px;font-weight:700;color:var(--accent);font-family:'Inter', sans-serif;${PERSON_LINK_STYLE}">${data.user}</span>
          <span style="font-size:11.5px;color:var(--muted);font-family:'Inter', sans-serif;">${time}</span>
          <button onclick="openCommentEditor(${evIdx},window['evKey_'+${evIdx}],'${d.id}')" style="background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0;font-family:'Inter', sans-serif;font-weight:500;display:inline-flex;align-items:center;gap:4px;">${replyIconSVG()}odpovědět</button>
          <button onclick="deleteComment(${evIdx},'${key}','${d.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;margin-left:auto;display:inline-flex;align-items:center;">${trashIconSVG()}</button>
        </div>
        <div class="comment-text" style="font-size:14px;color:var(--ink);margin-top:3px;font-family:'Inter', sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;">${data.text}</div>
        ${(data.images && data.images.length) ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;">${data.images.map(src => `<img src="${src}" onclick="event.stopPropagation();openImageLightbox(this.src, getCommentGalleryImages(${evIdx}))" style="width:74px;height:74px;object-fit:cover;border-radius:8px;cursor:zoom-in;">`).join('')}</div>` : ''}
        ${reactionsRow ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;">${reactionsRow}</div>` : ''}
        ${childReplies.map(r => renderComment(r, depth + 1)).join('')}
      </div>`;
    };

    const roots = docs.filter(d => !d.data().parentId);

    list.innerHTML = roots.length === 0
      ? '<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px;font-family:Inter,sans-serif;">Zatím žádné komentáře</div>'
      : roots.map(d => renderComment(d, 0)).join('');
    wireCommentLongPress(list, evIdx, key);
  }catch(e){
    const list2 = document.getElementById('commentList_'+evIdx);
    if(list2) list2.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:8px;font-family:Inter,sans-serif;">'+e.message+'</div>';
  }
}

function openQuizLeaderboardDirect(){
  document.getElementById('quizBackdrop')?.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.id = 'quizBackdrop';
  backdrop.onclick = (e) => { if(e.target===backdrop){ backdrop.remove(); } };
  backdrop.innerHTML = `
    <div class="ev-modal" style="text-align:center;position:relative;"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>

      <div id="quizModalContent"></div>
    </div>`;
  document.body.appendChild(backdrop);
  showQuizLeaderboard();
}

function pickQuizQuestion(){
  const qs = window.QUIZ_QUESTIONS;
  const st = window.quizState;
  // Prvních QUIZ_EU_COUNT otázek v poli jsou evropské země (viz jejich
  // pořadí v QUIZ_QUESTIONS výš) — appka losuje nejdřív jen z nich. Až
  // vystřídá úplně všechny, teprve pak přibere i zbytek světa. Jakmile
  // dojde i tenhle větší okruh, celý cyklus se sám vrátí zase na Evropu.
  const euCount = window.QUIZ_EU_COUNT || qs.length;
  const euUsedCount = st.usedIndices.filter(i => i < euCount).length;
  let pool = euUsedCount < euCount ? euCount : qs.length;
  if(st.usedIndices.length >= pool) st.usedIndices = [];
  const euUsedAfterReset = st.usedIndices.filter(i => i < euCount).length;
  pool = euUsedAfterReset < euCount ? euCount : qs.length;
  let idx;
  do { idx = Math.floor(Math.random()*pool); } while(st.usedIndices.includes(idx));
  st.usedIndices.push(idx);
  return qs[idx];
}

function nextQuizQuestion(){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  st.token = (st.token || 0) + 1;
  const myToken = st.token;
  const question = pickQuizQuestion();
  st.timeLeft = 10;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const order = [0,1,2].sort(() => Math.random()-0.5);
  content.innerHTML = `
    <div style="font-family:'Inter', sans-serif;font-size:12px;letter-spacing:0.02em;color:var(--muted);font-weight:600;margin-bottom:6px;">Série: ${st.streak}</div>
    <div id="quizTimer" style="font-family:'Inter', sans-serif;font-size:30px;font-weight:800;color:var(--accent);margin-bottom:10px;">10</div>
    <div class="ev-modal-title" style="margin-bottom:16px;">${question.q}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${order.map(i => `<button onclick="answerQuiz(${i === question.correct})" style="
        background:var(--surface);border:1px solid var(--line);
        color:var(--ink);font-family:'Inter', sans-serif;font-weight:600;font-size:15px;
        padding:13px;border-radius:var(--radius-sm);cursor:pointer;">${question.a[i]}</button>`).join('')}
    </div>
  `;
  const timerEl = document.getElementById('quizTimer');
  let myIntervalId;
  myIntervalId = setInterval(() => {
    if(window.quizState !== st || st.token !== myToken){ clearInterval(myIntervalId); return; } // osiřelý/zastaralý časovač — ignoruj a nezasahuj do aktuální hry
    st.timeLeft--;
    if(timerEl) timerEl.textContent = st.timeLeft;
    if(st.timeLeft <= 3 && timerEl) timerEl.style.color = '#E2664F';
    if(st.timeLeft <= 0){
      clearInterval(myIntervalId);
      answerQuiz(false, 'vypršel čas');
    }
  }, 1000);
  st.timerInterval = myIntervalId;
}

function answerQuiz(isCorrect, reason){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  if(isCorrect){
    st.streak++;
    nextQuizQuestion();
  } else {
    endQuiz(reason || 'špatná odpověď (klik)');
  }
}

function endQuiz(reason){
  const st = window.quizState;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const savedName = localStorage.getItem('kokrsnekUser') || '';
  const streakWord = st.streak===1 ? 'otázku' : (st.streak>=2 && st.streak<=4 ? 'otázky' : 'otázek');
  content.innerHTML = `

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => {
      const netInfo = navigator.onLine ? 'telefon si myslí, že je online' : 'telefon hlásí, že je OFFLINE';
      reject(new Error(`Vypršel časový limit (databáze neodpověděla do ${ms/1000}s — ${netInfo})`));
    }, ms))
  ]);
}

// Zkusí akci vícekrát za sebou, než se definitivně vzdá (pro nespolehlivé připojení)
async function withRetry(fn, attempts = 2){
  let lastErr;
  for(let i = 0; i < attempts; i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; console.warn(`Pokus ${i+1}/${attempts} selhal:`, e.message); }
  }
  throw lastErr;
}

async function submitQuizScore(){
  const st = window.quizState;
  const input = document.getElementById('quizNameInput');
  const name = normName(input?.value || '');
  if(!name){ input?.focus(); return; }
  localStorage.setItem('kokrsnekUser', name);
  const content = document.getElementById('quizModalContent');
  let saveError = null;
  try{
    const ref = db.collection('events').doc('_quiz_leaderboard').collection('scores').doc(name);
    // Ulož pokus do historie a zjisti dosavadní nejlepší skóre paralelně (rychlejší, méně náchylné na výpadek)
    const [, snap] = await withRetry(() => Promise.all([
      withTimeout(ref.collection('attempts').add({ score: st.streak, at: new Date().toISOString() }), 8000),
      withTimeout(ref.get(), 8000),
    ]));
    const prevBest = snap.exists ? (snap.data().score || 0) : -1;
    if(st.streak > prevBest){
      await withRetry(() => withTimeout(ref.set({ name, score: st.streak, at: new Date().toISOString() }), 8000));
    }
  }catch(e){
    saveError = e;
    console.error('Chyba při ukládání skóre kvízu:', e);
  }
  showQuizLeaderboard(saveError);
}

// Zavírání dialogů tažením za čárku (swipe-to-dismiss), jako u nativních iOS sheetů.
// Čárka je normální součástí karty (žádné sticky, žádné vyjímání z DOM) - při tažení se
// prostě hýbe spolu s celou kartou jako jeden kus, žádné zvláštní zacházení není potřeba.
function liftGrabber(grabber){}
function updateGrabberTop(grabber, delta){}
function restoreGrabber(grabber){}

(() => {
  let dragState = null;
  const ENGAGE_DISTANCE = 8; // od kolika px začneme sheet vizuálně posouvat (jen vizuální feedback)
  const TAP_MAX_DISTANCE = 25; // reálný prst se při ťuknutí vždy trochu hne - tohle je tolerance, ne 0
  const TAP_MAX_DURATION = 300; // ms - rychlý krátký dotek = ťuknutí, ne tažení

  document.addEventListener('touchstart', (e) => {
    const grabber = e.target.closest('.sheet-grabber-down, .sheet-grabber-up');
    if(!grabber) return;
    const sheet = grabber.parentElement;
    if(!sheet) return;
    const t = e.touches[0];
    dragState = {
      grabber, sheet,
      mode: grabber.classList.contains('sheet-grabber-up') ? 'up' : 'down',
      startY: t.clientY,
      startTime: Date.now(),
      currentY: t.clientY,
      height: sheet.getBoundingClientRect().height,
      engaged: false // teprve po překročení ENGAGE_DISTANCE začneme sheet vizuálně posouvat
    };
  }, {passive:true});

  document.addEventListener('touchmove', (e) => {
    if(!dragState) return;
    const t = e.touches[0];
    dragState.currentY = t.clientY;
    let rawDelta = t.clientY - dragState.startY;

    if(!dragState.engaged){
      if(Math.abs(rawDelta) < ENGAGE_DISTANCE) return;
      dragState.engaged = true;
      dragState.sheet.style.transition = 'none';
      liftGrabber(dragState.grabber);
      // Textové pole (kurzor) by při vizuálním odtahování dialogu jinak zůstalo viset na místě, tak ho hned schováme
      if(document.activeElement && document.activeElement.tagName === 'INPUT'){
        document.activeElement.blur();
      }
    }

    let delta = rawDelta;
    if(dragState.mode === 'down'){
      if(delta < 0) delta = 0;
    } else {
      if(delta > 0) delta = 0;
    }
    dragState.delta = delta;
    dragState.sheet.style.transform = `translateY(${delta}px)`;
    updateGrabberTop(dragState.grabber, delta);
  }, {passive:true});

  function closeGrabber(grabber){
    restoreGrabber(grabber); // vrať čárku zpátky do DOM stromu dialogu, ať zavírací akce najde svého rodiče
    if(grabber === searchClose){
      closeSearch();
    } else {
      grabber.click();
    }
  }

  function endDrag(e){
    if(!dragState) return;
    const { sheet, grabber, mode, delta, height, engaged, startY, currentY, startTime } = dragState;
    dragState = null;

    const elapsed = Date.now() - startTime;
    const finalDistance = Math.abs((currentY - startY) || 0);

    // Rychlý a krátký dotek = ťuknutí, bez ohledu na to, jestli mezitím prst zavadil o pár px navíc
    if(elapsed <= TAP_MAX_DURATION && finalDistance <= TAP_MAX_DISTANCE){
      if(engaged){
        sheet.style.transition = 'transform .2s ease';
        sheet.style.transform = 'translateY(0)';
        restoreGrabber(grabber);
      }
      // Po zavření tímhle dotykem prohlížeč ještě sám vyšle svůj vlastní 'click' - bez potlačení
      // by dopadl na to, co se pod zavřeným dialogem objeví (proklik na kartu pod ním).
      if(e && e.cancelable) e.preventDefault();
      closeGrabber(grabber);
      return;
    }

    if(!engaged) return; // ani ťuknutí, ani tažení (např. dlouhé podržení bez pohybu) - nic neděláme

    const threshold = Math.min(120, height * 0.28);
    const absDelta = Math.abs(delta || 0);
    sheet.style.transition = 'transform .28s cubic-bezier(0.32,0.72,0,1)';

    if(absDelta > threshold){
      // Dotáhni mimo obrazovku a pak dialog skutečně zavři
      const exitY = mode === 'down' ? height + 40 : -(height + 40);
      sheet.style.transform = `translateY(${exitY}px)`;
      if(e && e.cancelable) e.preventDefault();
      setTimeout(() => { closeGrabber(grabber); }, 220);
    } else {
      sheet.style.transform = 'translateY(0)';
      restoreGrabber(grabber);
    }
  }
  document.addEventListener('touchend', endDrag, {passive:false});
  // iOS umí gesto zrušit (touchcancel) místo dokončit (touchend), např. když si myslí, že jde o scroll.
  // Bez tohohle by dialog zůstal viset uprostřed tažení.
  document.addEventListener('touchcancel', endDrag);
})();

// Obecné dlouhé podržení prvku, které nekoliduje s krátkým tapem ani se
// systémovou nabídkou iOS (kopírovat/vyhledat apod.).
function attachLongPress(el, onLongPress, ms){
  if(!el) return;
  ms = ms || 600;
  let timer, longPressed = false, sx = 0, sy = 0;
  el.style.userSelect = 'none';
  el.style.webkitUserSelect = 'none';
  el.style.webkitTouchCallout = 'none';
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    longPressed = false;
    const t = e.touches && e.touches[0];
    sx = t ? t.clientX : 0; sy = t ? t.clientY : 0;
    timer = setTimeout(() => { longPressed = true; onLongPress(); }, ms);
  }, {passive:false});
  el.addEventListener('touchend', (e) => {
    clearTimeout(timer);
    e.preventDefault();
    if(longPressed) return;
    el.click();
  });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    if(Math.hypot(t.clientX - sx, t.clientY - sy) > 15) clearTimeout(timer);
  }, {passive:true});
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// Jednorázově dotáhne externí <script> (SheetJS pro export do xlsx), jen když je poprvé potřeba.
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Nepodařilo se načíst ' + src));
    document.head.appendChild(s);
  });
}
