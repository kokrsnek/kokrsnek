<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KoKrŠNeK">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<title>KoKrŠNeK</title>
<script>
  if(localStorage.getItem('kokrsnekTheme') === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#1C1B20;
    --bg2:#232128;
    --card:#26242C;
    --line:var(--surface);
    --ink:#F3F0EC;
    --muted:#9E97AC;
    --accent:#3E8F68;
    --accent-soft:rgba(62,143,104,0.16);
    --amber:#E8A23D;
    --amber-soft:rgba(232,162,61,0.16);
    --coral:#E2664F;
    --coral-soft:rgba(226,102,79,0.14);
    --past:#8A8496;
    --past-soft:#211F26;
    --past-blue-soft:rgba(90,140,220,0.30);
    --coral-tint:rgba(226,102,79,0.30);
    --link:#5BC28C;
    --shadow-sm:0 2px 10px rgba(0,0,0,0.25);
    --shadow-md:0 10px 30px rgba(0,0,0,0.35);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --surface:rgba(255,255,255,0.06);
    --surface-strong:rgba(255,255,255,0.14);
    --nav-bg:rgba(60,57,68,0.88);
    --nav-border:rgba(255,255,255,0.14);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#F6F4EF;
    --bg2:#FFFFFF;
    --card:#FFFFFF;
    --line:rgba(20,18,14,0.09);
    --ink:#242229;
    --muted:#837E8A;
    --accent:#2F7A56;
    --accent-soft:rgba(47,122,86,0.12);
    --amber:#C7852A;
    --amber-soft:rgba(199,133,42,0.14);
    --coral:#C24B34;
    --coral-soft:rgba(194,75,52,0.12);
    --past:#6B6675;
    --past-soft:#EDEBE6;
    --past-blue-soft:rgba(62,111,196,0.20);
    --coral-tint:rgba(194,75,52,0.18);
    --link:#227A50;
    --shadow-sm:0 2px 10px rgba(20,18,14,0.07);
    --shadow-md:0 10px 30px rgba(20,18,14,0.12);
    --surface:rgba(20,18,14,0.045);
    --surface-strong:rgba(20,18,14,0.09);
    --nav-bg:rgba(255,255,255,0.92);
    --nav-border:rgba(20,18,14,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background-color:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    overscroll-behavior-y: none;
  }
  .app{
    height:100vh;
    width:100%;
    overflow-y:auto;
    scroll-snap-type:y proximity;
    position:relative;
    padding-bottom:160px;
    scroll-padding-bottom:160px;
    box-sizing:border-box;
    -webkit-overflow-scrolling:touch;
  }
  .search-btn{
    position:fixed;
    bottom:110px; right:18px;
    top:auto;
    z-index:20;
    width:46px; height:46px;
    border-radius:15px;
    background:var(--nav-bg);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--nav-border);
    box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
    transition:transform .15s ease;
  }
  .search-btn:active{ transform:scale(0.92); }
  #gearBtn{
    right:64px;
  }
  #gearBtn.connected{
    border-color:rgba(62,143,104,0.9);
    background:rgba(62,143,104,0.2);
  }
  .search-btn svg{
    width:19px; height:19px;
    fill:var(--ink);
  }
  #feedbackBtn svg{
    fill:var(--coral);
  }
  #feedbackBtn, #feedbackBtn svg{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  .search-overlay{
    position:fixed;
    top:0; left:0; right:0;
    height:50dvh; min-height:220px;
    z-index:40;
    background:var(--bg2);
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,12px) 16px 12px;
    box-sizing:border-box;
    box-shadow:var(--shadow-md);
    transform:translateY(-100%);
    transition:transform .25s ease;
    border-radius:0 0 24px 24px;
  }
  .search-overlay.open{ transform:translateY(0); }

  .config-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(20,19,24,0.97);
    backdrop-filter:blur(8px);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    transform:translateY(-100%);
    transition:transform .15s ease;
  }
  .config-overlay.open{ transform:translateY(0); }
  .config-title{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:18px;
  }
  .config-label{
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
  }
  .config-input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    outline:none;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .config-input:focus{ border-color:var(--accent); }
  .config-status{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--muted);
    margin:8px 0 14px;
    min-height:18px;
  }
  .config-status.ok{ color:var(--accent); }
  .config-status.err{ color:var(--coral); }
  .config-btns{
    display:flex; gap:10px; margin-top:4px;
  }

  .search-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .search-row input[type="text"]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    padding:12px 16px;
    border-radius:100px;
    outline:none;
  }
  .search-row input[type="text"]:focus{ border-color:var(--accent); }
  .search-row input[type="text"]::placeholder{ color:var(--muted); }
  .search-close{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--surface);
    border:none;
    color:var(--ink);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }

  .date-row-search{
    display:flex; align-items:center; gap:10px;
    margin-bottom:18px;
  }
  .date-row-search input[type="date"]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    outline:none;
    color-scheme:dark;
  }
  .cal-btn{
    flex-shrink:0;
    background:var(--accent);
    color:#12261C;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:10px 14px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
  }

  .search-results{
    flex:1;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-bottom:24px;
  }
  .result-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    cursor:pointer;
  }
  .result-item:active{ background:var(--surface); }
  .result-main{ flex:1; min-width:0; }
  .result-title{
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-meta{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .map-pin{
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--accent-soft);
    border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .map-pin svg{ width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2; }
  .no-results{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
    margin-top:24px;
  }

  .topbar{
    position:fixed;
    top:auto !important;
    bottom:0; left:0; right:0;
    padding:10px 16px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    z-index:5;
    background:linear-gradient(transparent, var(--bg) 55%);
    pointer-events:none;
  }
  .topbar .label{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:clamp(17px, 5.8vw, 30px);
    letter-spacing:-0.01em;
    color:var(--ink);
    width:100%;
    max-width:100%;
    text-align:center;
    white-space:nowrap;
  }
  .topbar .today{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .topbar .nameday{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--muted);
  }

  .slot{
    height:33.34dvh;
    min-height:180px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    position:relative;
    padding:8px 26px;
    box-sizing:border-box;
  }

  .dot{
    position:absolute;
    left:50%; top:50%;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    transform:translate(-50%,-50%);
    z-index:1;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:380px;
    transition:opacity .25s ease, transform .25s ease;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 22px 20px;
    box-shadow:var(--shadow-sm);
    text-align:center;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .eyebrow .pip{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--muted);
    display:inline-block;
  }

  .date-row{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    line-height:1.15;
    margin:0 0 2px;
  }
  .time-row{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
    letter-spacing:0.02em;
  }
  .title-row{
    font-family:'Inter', sans-serif;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.015em;
    margin:0 0 6px;
    line-height:1.2;
    color:var(--ink);
  }
  .place-row{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .place-row::before, .place-row::after{ content:none; }

  /* --- NOW (center, dominant) --- */
  .slot.now .card{
    background:linear-gradient(165deg, var(--accent-soft), var(--card) 55%);
    border:1px solid rgba(62,143,104,0.4);
    border-radius:var(--radius-lg);
    padding:24px 22px 20px;
    position:relative;
    box-shadow:0 0 0 1px rgba(62,143,104,0.15), 0 16px 40px rgba(0,0,0,0.4);
  }
  .slot.now .eyebrow{ color:var(--coral); font-size:13px; font-weight:700; }
  .slot.now .eyebrow .pip{ background:var(--coral); box-shadow:0 0 0 4px var(--coral-soft); }
  .slot.now .date-row{ font-size:23px; }
  .slot.now .title-row{
    font-size:29px;
    font-weight:800;
    color:var(--ink);
  }
  .slot.now .badge{
    display:inline-block;
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.01em;
    color:#12261C;
    background:var(--accent);
    padding:5px 14px;
    border-radius:100px;
    box-shadow:0 4px 14px rgba(62,143,104,0.4);
  }

  /* --- FUTURE (above now) --- */
  .slot.future .card{
    background:linear-gradient(165deg, var(--coral-tint), var(--card) 70%);
    opacity:0.92;
  }
  .slot.future .date-row{ font-size:19px; }
  .slot.future .title-row{ font-size:24px; font-weight:750; color:var(--ink); }
  .slot.future .eyebrow{ color:var(--accent); }
  .slot.future .eyebrow .pip{ background:var(--accent); }

  /* --- PAST (below now, with photo link) --- */
  .slot.past .card{
    background:linear-gradient(165deg, var(--past-blue-soft), var(--card) 70%);
    opacity:0.85;
  }
  .slot.past .date-row{ font-size:19px; }
  .slot.past .title-row{ font-size:24px; font-weight:750; color:var(--ink); }
  .slot.past .eyebrow{ color:var(--past); }
  .slot.past .eyebrow .pip{ background:var(--past); }

  .photo-link{
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--ink);
    background:var(--accent-soft);
    border:1px solid rgba(62,143,104,0.3);
    padding:8px 16px;
    border-radius:100px;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
  }
  .photo-link:active{ transform:scale(0.96); background:rgba(62,143,104,0.28); }
  .photo-link svg{ width:14px; height:14px; flex-shrink:0; }

  .sheet-grabber-down, .sheet-grabber-up{
    touch-action:none;
  }
  .ev-modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    padding:0;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes sheetUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .ev-modal{
    background:var(--bg2);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:28px 28px 0 0;
    width:100%; max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    padding:14px 22px calc(24px + env(safe-area-inset-bottom, 0px));
    position:relative;
    animation: sheetUp .3s cubic-bezier(0.32,0.72,0,1);
    text-align:center;
    box-shadow:0 -12px 40px rgba(0,0,0,0.4);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .ev-modal input, .ev-modal textarea{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  .ev-modal-close{
    display:none;
  }
  .ev-modal-label{
    font-family:'Inter',sans-serif;
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin-bottom:4px; margin-top:16px;
  }
  .ev-modal-label:first-child{ margin-top:0; }
  .ev-modal-value{
    font-family:'Inter',sans-serif;
    font-size:15px; font-weight:500; color:var(--ink); line-height:1.5;
    word-break:break-word;
  }
  .ev-modal-title{
    font-family:'Inter',sans-serif;
    font-size:22px; font-weight:800; color:var(--ink);
    letter-spacing:-0.01em;
    margin-bottom:16px; line-height:1.25; padding-right:0;
  }
  .ev-modal-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink); font-size:13px; font-weight:600;
    font-family:'Inter',sans-serif;
    text-decoration:none;
    background:var(--accent-soft);
    border:1px solid rgba(62,143,104,0.3);
    padding:6px 14px; border-radius:100px; margin-top:4px;
  }
  .album-tile{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; box-sizing:border-box;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md); padding:14px 16px; margin-top:4px;
    color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .album-tile-icon{
    flex-shrink:0; width:40px; height:40px; border-radius:var(--radius-sm);
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .album-tile-icon svg{ width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:2; }
  .album-tile-text{ text-align:center; }
  .album-tile-title{
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:700; color:var(--ink);
  }
  .album-tile-sub{
    font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin-top:2px;
  }
  .album-tile-arrow{ flex-shrink:0; color:var(--muted); font-size:18px; }
  .title-clickable{
    cursor:pointer; border-bottom:1px dashed rgba(62,143,104,0.4);
    transition:border-color .15s;
    -webkit-tap-highlight-color: rgba(62,143,104,0.2);
    touch-action: manipulation;
  }
  .title-clickable:hover{ border-color:var(--accent); }

  /* --- ALBUMS OVERLAY --- */
  .albums-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    pointer-events:none;
  }
  .albums-overlay.open{
    transform:translateX(0);
    pointer-events:auto;
  }
  .albums-topbar{
    padding:56px 20px 16px;
    background:var(--bg2);
    border-bottom:1px solid var(--line);
    text-align:center;
    flex-shrink:0;
  }
  .albums-topbar .label{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .albums-list{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
  }
  .albums-page{
    height:100vh;
    overflow-y:auto;
    background:var(--bg);
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
    box-sizing:border-box;
  }
  .albums-header{
    padding:60px 20px 16px;
    background:var(--bg);
    text-align:center;
  }
  .albums-header .label{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.01em;
    color:var(--ink);
    text-align:center;
    display:block;
  }
  .album-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .15s;
  }
  .album-item:active{ background:var(--surface); }
  .album-badge-slot{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    margin-right:2px;
  }
  .album-new-tag{
    font-family:'Inter',sans-serif;
    font-size:10px; font-weight:800; letter-spacing:0.02em;
    color:var(--coral);
    background:var(--coral-soft);
    padding:3px 7px;
    border-radius:100px;
    white-space:nowrap;
  }
  .album-info{ flex:1; min-width:0; text-align:left; }
  .album-date{
    font-family:'Inter',sans-serif;
    font-size:12px; color:var(--muted); font-weight:500;
    margin-bottom:3px;
  }
  .album-title{

const DAYS = ["ne","po","út","st","čt","pá","so"];

function fmtDate(d){
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFull(d){
  return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(d, end){
  const t = (x)=> x.getHours().toString().padStart(2,'0')+":"+x.getMinutes().toString().padStart(2,'0');
  return end ? `${t(d)} – ${t(end)}` : t(d);
}

function isMultiDay(ev){
  const startDay = new Date(ev.start.getFullYear(), ev.start.getMonth(), ev.start.getDate());
  const endDay   = new Date(ev.end.getFullYear(),   ev.end.getMonth(),   ev.end.getDate());
  return endDay - startDay >= 86400000;
}

function fmtDateRange(ev){
  if(!isMultiDay(ev)) return fmtDate(ev.start);
  const endDisplay = new Date(ev.end.getTime() - 1);
  if(ev.start.getMonth() === endDisplay.getMonth() && ev.start.getFullYear() === endDisplay.getFullYear())
    return `${ev.start.getDate()}. – ${endDisplay.getDate()}. ${MONTHS[endDisplay.getMonth()]} ${endDisplay.getFullYear()}`;
  return `${fmtDate(ev.start)} – ${fmtDate(endDisplay)}`;
}

function fmtTimeRow(ev){
  if(isMultiDay(ev)){
    const endDisplay = new Date(ev.end.getTime() - 1);
    return `${fmtFull(ev.start)} – ${fmtFull(endDisplay)}`;
  }
  return fmtTime(ev.start, ev.end);
}

const GCAL_COLORS = {
  '1':'#7986CB','2':'#33B679','3':'#8E24AA','4':'#E67C73',

function getDaysText(ev){
  const today = new Date(); today.setHours(0,0,0,0);
  const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
  const diff = Math.round((evDay - today) / 86400000);
  if(diff === 0) return 'dnes';
  if(diff === 1) return 'zítra';
  if(diff === -1) return 'včera';
  if(diff > 0) return `za ${diff} dní`;
  return `před ${Math.abs(diff)} dny`;
}

// =====================================================
// SDÍLENÍ UDÁLOSTI
// =====================================================
function getPlaceCoords(place){
  if(!place) return null;
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `${decMatch[1]},${decMatch[2]}`;
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return SEARCH_KNOWN_PLACES[clean];
  }
  return null;
}

async function shareEvent(ev){
  const r = ev.raw || {};
  const isPast = ev.end < now;
  const NL = '\r\n'; // CRLF — Gmail appka na iOS občas slučuje samotné \n, s \r\n je zalomení spolehlivější
  const intro = `KoKrŠNeci tě zvou na…`;
  const introFull = `KoKrŠNeci tě zvou na ${ev.title}`;
  const dateWithDay = isMultiDay(ev) ? fmtDateRange(ev) : `${fmtFull(ev.start)} od ${fmtTime(ev.start)}`;

  let wxLine = '';
  if(ev.place){
    const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const wx = await fetchWeatherAtTime(ev.place, ev.start, getPlaceCoords(ev.place), isAllDay);
    if(wx) wxLine = wx;
  }

  let textBase, shareUrl;

  if(isPast){
    // Minulé události — popis + mapa místa + případné fotky/soubory
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    if(ev.photoAlbum) extras.push(`📸 Album fotek: ${ev.photoAlbum}`);
    if(ev.driveFiles && ev.driveFiles.length) ev.driveFiles.forEach(f => extras.push(`📄 ${f.title}: ${f.url}`));
    textBase = `${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = undefined;
  } else {
    // Budoucí události — přidej odkaz na Google Calendar a mapu místa
    const link = r.htmlLink || '';
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    textBase = `${intro}${NL}${NL}${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = link || undefined;
  }

  if(navigator.share){
    try{
      await navigator.share({ title: introFull, text: textBase, url: shareUrl });
      return;
    }catch(e){}
  }
  await navigator.clipboard.writeText(textBase + (shareUrl && !textBase.includes(shareUrl) ? NL+NL+shareUrl : ''));
  const btn = document.getElementById('shareEvBtn');
  if(btn){ btn.textContent = '✓ Zkopírováno'; setTimeout(()=>{ btn.textContent = 'Sdílet'; },2000); }
}

// EXPORT DO KALENDÁŘE (.ics)
// =====================================================
function exportICS(ev){
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    `DTSTART:${fmt(ev.start)}`,
    `DTEND:${fmt(ev.end)}`,
    `SUMMARY:${ev.title}`,
    ev.place ? `LOCATION:${ev.place}` : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click();
}

function launchConfetti(){
  const colors = ['#3E8F68', '#e5c07b', '#e06c75', '#61afef', '#c678dd', '#ffffff'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:500;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);
  for(let i = 0; i < 70; i++){
    const piece = document.createElement('div');
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const duration = 5 + Math.random() * 3;
    const delay = Math.random() * 1;
    const rotate = Math.random() * 360;
    const color = colors[Math.floor(Math.random() * colors.length)];
    piece.style.cssText = `
      position:absolute; top:-20px; left:${left}%;
      width:${size}px; height:${size * 0.4}px;
      background:${color};
      opacity:0.9;
      transform:rotate(${rotate}deg);
      animation:confettiFall ${duration}s ease-in ${delay}s forwards;
    `;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 9000);
}

  showBirthdayDialog(item.title, item.text, () => showBirthdayQueue(queue));
}

function checkWeatherEffect(){
  if(!navigator.geolocation) return;
  const perm = localStorage.getItem('kokrsnekLocationWeatherPermission');
  if(perm === 'denied') return;

  const runWithCoords = (lat, lon) => {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
      .then(r => r.json())
      .then(data => {
        const code = data.current_weather && data.current_weather.weathercode;
        if(code === undefined || code === null) return;

        // WMO kódy počasí — rozlišení síly srážek
        const RAIN_LIGHT = [51, 56, 61, 66, 80];
        const RAIN_MODERATE = [53, 63, 81];
        const RAIN_HEAVY = [55, 57, 65, 67, 82];
        const SNOW_LIGHT = [71, 77, 85];
        const SNOW_MODERATE = [73];
        const SNOW_HEAVY = [75, 86];

        if(RAIN_LIGHT.includes(code)) startWeatherEffect('rain', 'light');
        else if(RAIN_MODERATE.includes(code)) startWeatherEffect('rain', 'moderate');
        else if(RAIN_HEAVY.includes(code)) startWeatherEffect('rain', 'heavy');
        else if(SNOW_LIGHT.includes(code)) startWeatherEffect('snow', 'light');
        else if(SNOW_MODERATE.includes(code)) startWeatherEffect('snow', 'moderate');
        else if(SNOW_HEAVY.includes(code)) startWeatherEffect('snow', 'heavy');
      })
      .catch(e => console.error('Chyba při zjišťování počasí pro efekt:', e));
  };

  if(perm === 'granted'){
    navigator.geolocation.getCurrentPosition(
      pos => runWithCoords(pos.coords.latitude, pos.coords.longitude),
      err => console.warn('Poloha nedostupná:', err),
      { maximumAge: 30 * 60 * 1000 }
    );
    return;
  }

  // Poprvé — appka se zeptá; výsledek (povoleno/zamítnuto) si zapamatuje a příště se už neptá
  navigator.geolocation.getCurrentPosition(
    pos => {
      localStorage.setItem('kokrsnekLocationWeatherPermission', 'granted');
      runWithCoords(pos.coords.latitude, pos.coords.longitude);
    },
    err => {
      localStorage.setItem('kokrsnekLocationWeatherPermission', 'denied');
    }
  );
}

let _weatherEffectRunning = null;
const WEATHER_EFFECT_INTERVALS = {
  rain: { light: 160, moderate: 70, heavy: 30 },
  snow: { light: 420, moderate: 220, heavy: 100 }
};
function startWeatherEffect(type, intensity){
  if(_weatherEffectRunning) return; // efekt už běží
  _weatherEffectRunning = type;
  intensity = intensity || 'moderate';

  const SNOWFLAKE_SHAPES = [
    // jednoduchý křížek se šesti rameny
    `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M4.2 6l15.6 12M4.2 18L19.8 6M2 12h20"/></svg>`,
    // vločka s drobnými větvičkami
    `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round"><path d="M12 3v18M12 3l-2 2M12 3l2 2M12 21l-2-2M12 21l2-2M4 7.5l16 9M4 7.5l2.7-.3M4 7.5l1 2.5M20 16.5l-2.7.3M20 16.5l-1-2.5M20 7.5L4 16.5M20 7.5l-2.7-.3M20 7.5l-1 2.5M4 16.5l2.7.3M4 16.5l1-2.5"/></svg>`,
    // šesticípá hvězda
    `<svg viewBox="0 0 24 24" fill="white"><path d="M12 2l1.6 6.2L20 6l-4.4 4.8L20 18l-6.4-2.2L12 22l-1.6-6.2L4 18l4.4-4.8L4 6l6.4 2.2z"/></svg>`,
    // malá tečka
    `<svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="4"/></svg>`,
    // křížek s tečkami na koncích
    `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v18M3 12h18M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/><circle cx="12" cy="3" r="1.2" fill="white"/><circle cx="12" cy="21" r="1.2" fill="white"/><circle cx="3" cy="12" r="1.2" fill="white"/><circle cx="21" cy="12" r="1.2" fill="white"/></svg>`,
  ];

  const container = document.createElement('div');
  container.id = 'weatherEffectContainer';
  container.style.cssText = 'position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);

  const windDir = Math.random() < 0.5 ? -1 : 1;
  const windAngleDeg = 13;

  setInterval(() => {
    const piece = document.createElement('div');
    if(type === 'rain'){
      const left = Math.random() * 100;
      const duration = 0.6 + Math.random() * 0.4;
      const height = 32 + Math.random() * 20;
      const rdrift = windDir * (70 + Math.random() * 25);
      piece.style.cssText = `
        position:absolute; top:-20px; left:${left}%;
        width:6px; height:${height}px;
        --rdrift:${rdrift}px;
        animation:rainFall ${duration}s linear forwards;
      `;
      piece.innerHTML = `<div style="width:100%;height:100%;transform:rotate(${windDir * windAngleDeg}deg);background:linear-gradient(to bottom, transparent, rgba(80,150,255,0.95));"></div>`;
    } else {
      const left = Math.random() * 100;
      const duration = 4 + Math.random() * 3;
      const size = 12 + Math.random() * 16;
      const drift = Math.random() * 40 - 20;
      const rotate = Math.random() * 360;
      const shape = SNOWFLAKE_SHAPES[Math.floor(Math.random() * SNOWFLAKE_SHAPES.length)];
      piece.style.cssText = `
        position:absolute; top:-20px; left:${left}%;
        width:${size}px; height:${size}px;
        opacity:${0.6 + Math.random() * 0.35};
        --drift:${drift}px;
        animation:snowFall ${duration}s linear forwards;
      `;
      piece.innerHTML = `<div style="width:100%;height:100%;transform:rotate(${rotate}deg);">${shape}</div>`;
    }
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 8000);
  }, WEATHER_EFFECT_INTERVALS[type][intensity]);
}

async function fetchWeather(place, dateStr, coords){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    // Zjisti jestli jde o minulé nebo budoucí datum
    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.daily) return null;
    const code = wxData.daily.weathercode[0];
    const max = Math.round(wxData.daily.temperature_2m_max[0]);
    const min = Math.round(wxData.daily.temperature_2m_min[0]);
    const rain = wxData.daily.precipitation_sum[0];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

async function fetchWeatherRange(place, dateStr, coords, hourStart, hourEnd){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time) return null;

    // Vyber jen hodiny v zadaném rozmezí (výchozí 9:00–22:00)
    const temps = [], rains = [], codes = [];
    wxData.hourly.time.forEach((t, i) => {
      const h = parseInt(t.slice(11,13));
      if(h >= hourStart && h <= hourEnd){
        temps.push(wxData.hourly.temperature_2m[i]);
        rains.push(wxData.hourly.precipitation[i]);
        codes.push(wxData.hourly.weathercode[i]);
      }
    });
    if(!temps.length) return null;

    const min = Math.round(Math.min(...temps));
    const max = Math.round(Math.max(...temps));
    const rain = rains.reduce((a,b) => a+b, 0);
    const code = Math.max(...codes); // nejhorší kód počasí v rámci okna = nejvýstižnější ikona
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain.toFixed(1)+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

async function fetchWeatherAtTime(place, dateObj, coords, isAllDay){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const dateStr = dateObj.toISOString().split('T')[0];
    const hour = isAllDay ? 9 : dateObj.getHours();

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time) return null;

    const targetTime = `${dateStr}T${hour.toString().padStart(2,'0')}:00`;
    let idx = wxData.hourly.time.indexOf(targetTime);
    if(idx === -1) idx = 0;

    const temp = Math.round(wxData.hourly.temperature_2m[idx]);
    const rain = wxData.hourly.precipitation[idx];
    const code = wxData.hourly.weathercode[idx];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    const timeLabel = `${hour.toString().padStart(2,'0')}:00`;
    return `${icon} ${temp}°C v ${timeLabel}${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

let now = new Date();

function at(daysOffset, h, m, durMin){
  const d = new Date(now);
  d.setDate(d.getDate()+daysOffset);
  d.setHours(h, m, 0, 0);
  const end = new Date(d.getTime() + durMin*60000);
  return {start:d, end};
}

function getNameday(d){
  const key = `${d.getDate()}.${d.getMonth()+1}`;
  return NAMEDAYS[key] || "";
}

const DAYS_FULL = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];

function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('kokrsnekTheme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('kokrsnekTheme', 'light');
  }
  syncThemeIcon();
}

function syncThemeIcon(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if(!moon || !sun) return;
  moon.style.display = isLight ? 'none' : 'block';
  sun.style.display = isLight ? 'block' : 'none';
}
syncThemeIcon();

function refreshNow(){
  now = new Date();
  todayLabelEl.textContent = `Dnes je ${DAYS_FULL[now.getDay()]} ${now.getDate()}. ${MONTHS_FULL[now.getMonth()]} ${now.getFullYear()}`;
  const nameday = getNameday(now);
  namedayLabelEl.textContent = nameday ? `Svátek má ${nameday}` : "";
}

function fmtRelativeFuture(d){
  const diffDays = Math.round((d - new Date(now.getFullYear(),now.getMonth(),now.getDate())) / 86400000);
  if (diffDays === 1) return "Zítra";
  if (diffDays <= 7) return `Za ${diffDays} dní`;
  return "Nadcházející";
}

function stripHtml(str){ return (str||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').trim(); }

function showEventDetail(idx){
  const ev = rawEvents[idx];

  // Označ, že si uživatel právě prohlédl tuto událost (pro odznak nových komentářů/lajků na kartě)

  // Sestaví řádky detailu
  const rows = [];

  // Datum a čas
  const dateVal = isMultiDay(ev)
    ? fmtDateRange(ev)
    : `${fmtDateRange(ev)}  ·  ${fmtTime(ev.start, ev.end)}`;
  rows.push({label:'Datum a čas', value: dateVal});

  if(ev.place){
    // Zjisti jestli místo obsahuje URL na mapy
    const KNOWN_PLACES = {
      'bouda':     '49.432694,16.622583',
      'hastrman':  '49.463861,16.496667',
      'funibrouk': '49.446694,16.665611',
      'sjíždění':  '49.482333,16.608556',
      'sjizdeni':  '49.482333,16.608556',
    };
    const urlMatch = ev.place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
    const mapUrl = urlMatch ? urlMatch[0] : null;
    let gpsCoords = null;
    const decMatch = ev.place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
    if(decMatch) gpsCoords = `${decMatch[1]},${decMatch[2]}`;
    if(!gpsCoords){
      const dmsMatch = ev.place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
      if(dmsMatch){
        let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
        let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
        if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
        if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
        gpsCoords = `${lat.toFixed(6)},${lng.toFixed(6)}`;
      }
    }
    if(!gpsCoords && !mapUrl){
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      for(const word of words){
        const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
        if(KNOWN_PLACES[clean]){ gpsCoords = KNOWN_PLACES[clean]; break; }
      }
    }
    let placeLabel = ev.place
      .replace(urlMatch ? urlMatch[0] : '', '')
      .replace(/\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[NSns][,\s]+\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[EWew]/, '')
      .replace(decMatch ? decMatch[0] : '', '')
      .trim() || 'Zobrazit místo';
    placeLabel = shortenPlace(placeLabel);
    rows.push({label:'Místo', value: placeLabel, mapUrl, gpsCoords, isPlace: true});
  }

  // Popis
  const desc = stripHtml(r.description).replace(/https?:\/\/photos(?:\.app)?\.goo\.gl\/\S+/g,'').replace(/https?:\/\/photos\.google\.com\/\S+/g,'').trim();
  if(desc) rows.push({label:'Popis', value: desc});

  // Organizátor (zobrazí se na konci, pod komentáři)
  let organizerValue = null;
  let isDefaultOrganizer = false;
  if(r.organizer && r.organizer.displayName && r.organizer.displayName !== r.organizer.email){
    organizerValue = r.organizer.displayName;

    organizerValue = 'KoKrŠNeK v.t.s.';

    orgEl.addEventListener('touchstart', (e) => {
      orgLongPressed = false;
      const t = e.touches && e.touches[0];
      orgStartX = t ? t.clientX : 0;
      orgStartY = t ? t.clientY : 0;
      orgPressTimer = setTimeout(() => {
        orgLongPressed = true;
        try{ openQuizLeaderboardDirect(); }
        catch(err){ console.error('Chyba při otevírání žebříčku:', err); }
      }, 500);
    }, {passive:true});
    orgEl.addEventListener('touchend', e => {
      clearTimeout(orgPressTimer);
      e.preventDefault(); // potlač simulovaný click po doteku, ať se kvíz nespustí 2×
      if(orgLongPressed) return;
      try{ startQuiz(); }
      catch(err){ console.error('Chyba při spouštění kvízu:', err); }

      const t = e.touches && e.touches[0];
      if(!t) return;
      const dx = t.clientX - orgStartX, dy = t.clientY - orgStartY;
      if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(orgPressTimer);

function compressImageToBase64(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function fetchCardStats(ev, uid, row){
  if(!row) row = document.getElementById('statsRow_'+uid);
  if(!row) return;
  try{
    const key = getEventKey(ev);
    const [commentsSnap, likesSnap] = await Promise.all([
      db.collection('events').doc(key).collection('comments').get(),
      db.collection('events').doc(key).collection('likes').get()
    ]);
    const lastSeenRaw = localStorage.getItem('kokrsnekSeen_' + key);
    const lastSeen = lastSeenRaw ? new Date(lastSeenRaw) : null;

    const commentCount = commentsSnap.size;
    const likeCount = likesSnap.size;

    const newestOf = (snap) => snap.docs.reduce((max, d) => {
      const at = d.data().at;
      const t = at ? new Date(at) : null;
      return (t && (!max || t > max)) ? t : max;
    }, null);

    const newestComment = newestOf(commentsSnap);
    const newestLike = newestOf(likesSnap);

    const commentsNew = commentCount > 0 && (!lastSeen || (newestComment && newestComment > lastSeen));
    const likesNew = likeCount > 0 && (!lastSeen || (newestLike && newestLike > lastSeen));

    const mutedColor = 'var(--muted)';
    const commentColor = commentsNew ? 'var(--accent)' : mutedColor;
    const likeColor = likesNew ? '#E2664F' : mutedColor;

    row.innerHTML = `
      <span style="display:flex;align-items:center;gap:4px;color:${commentColor};font-family:'JetBrains Mono',monospace;font-size:11px;">${commentIconSVG()}${commentCount}</span>

    `;
  }catch(e){
    console.error('Chyba při načítání statistik karty:', e);
  }
}

function buildTimelineSlot(ev, i, isNow, isPast, uidSuffix){
  const uid = uidSuffix !== undefined ? uidSuffix : i;
  const kind = isNow ? "now" : (isPast ? "past" : "future");
  const evYear = ev.start.getFullYear();
  const color = getEventColor(ev);

  const evStart = new Date(ev.start); evStart.setHours(0,0,0,0);
  const today = new Date(now); today.setHours(0,0,0,0);
  const isToday = evStart.getTime() === today.getTime() || (ev.start <= now && ev.end >= now);
  const isHappeningNow = ev.start <= now && ev.end >= now;

  let eyebrowText;
  if(isNow && isToday) eyebrowText = "Žhavíme";
  else if(isNow && !isToday) eyebrowText = "Nadcházející";
  else if(isPast) eyebrowText = "Skončilo";
  else eyebrowText = fmtRelativeFuture(ev.start);

  const countdownStyle = isNow
    ? `font-size:15.75px;color:#E2664F;margin-left:6px;letter-spacing:0.04em;`
    : `font-size:10px;background:${color}22;color:${color};border-radius:100px;padding:2px 8px;margin-left:6px;letter-spacing:0.04em;`;
  const countdown = (!isPast && !(isNow && isToday)) ? `<span style="${countdownStyle}">${getDaysText(ev)}</span>` : '';

  const slot = document.createElement('div');
  slot.className = `slot ${kind}`;
  slot.innerHTML = `
    <div class="card" onclick="showEventDetail(${i})" style="cursor:pointer;">
      ${isNow ? `<div onclick="event.stopPropagation();openYearPicker(window._yearsInTimeline,${evYear})" style="font-family:'Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.03em;color:var(--muted);text-align:center;margin-bottom:10px;cursor:pointer;user-select:none;">— ${evYear} —</div>` : ''}
      <div class="eyebrow">${isNow ? '' : `<span class="pip" style="background:${color};"></span>`}${eyebrowText}${countdown}</div>
      <div class="date-row">${fmtDateRange(ev)}</div>
      <div class="time-row">${fmtTimeRow(ev)}</div>
      <div class="title-row" id="titleRow_${uid}">${ev.title}</div>
      ${ev.place ? `<div class="place-row">${shortenPlace(ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place)}</div>` : ``}
      ${isNow && !isPast && ev.place ? `<div id="slotWx_${uid}" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px;"></div>` : ''}
      ${isNow && isHappeningNow ? `<span class="badge">probíhá teď</span>` : ``}
      ${isPast && ev.photoAlbum ? `<a class="photo-link" href="#" onclick="event.preventDefault();event.stopPropagation();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">${photoSVG()}Album fotek</a>` : ``}
      <div id="statsRow_${uid}" style="display:flex;justify-content:center;gap:16px;margin-top:8px;"></div>
    </div>
  `;
  slot.dataset.idx = i;
  fetchCardStats(ev, uid, slot.querySelector('#statsRow_'+uid));

  if(isNow && !isPast && ev.place){
    const wxDateStr = ev.start.toISOString().split('T')[0];
    const wxCoords = (() => {
      const KNOWN_PLACES = {'bouda':'49.432694,16.622583','hastrman':'49.463861,16.496667','funibrouk':'49.446694,16.665611','sjíždění':'49.482333,16.608556','sjizdeni':'49.482333,16.608556'};
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      for(const w of words){ const c=w.replace(/[^a-záčďéěíňóřšťůúýž]/g,''); if(KNOWN_PLACES[c]) return KNOWN_PLACES[c]; }
      return null;
    })();
    const isAllDayNow = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const startHourNow = isAllDayNow ? 9 : ev.start.getHours();
    fetchWeatherRange(ev.place, wxDateStr, wxCoords, startHourNow, 22).then(wx => {
      const el = document.getElementById('slotWx_'+uid);
      if(el && wx) el.textContent = wx;
    });
  }

  // Dlouhé podržení kdekoliv na kartě -> filtrovaná mini-timeline stejných opakujících se akcí
  setTimeout(() => {
    const cardEl = slot.querySelector('.card');
    if(!cardEl) return;
    let pressTimer, longPressed = false;
    let titleStartX = 0, titleStartY = 0;
    cardEl.style.webkitTouchCallout = 'none';
    cardEl.addEventListener('touchstart', (e) => {
      longPressed = false;
      const t = e.touches && e.touches[0];
      titleStartX = t ? t.clientX : 0;
      titleStartY = t ? t.clientY : 0;
      pressTimer = setTimeout(() => {
        longPressed = true;
        try{ openEventGroupTimeline(ev.title); }
        catch(err){ console.error('Chyba při otevírání filtrované timeline:', err); }
      }, 500);
    }, {passive:true});
    cardEl.addEventListener('touchend', e => {
      clearTimeout(pressTimer);
      if(longPressed) e.preventDefault();
    });
    cardEl.addEventListener('touchmove', (e) => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      const dx = t.clientX - titleStartX, dy = t.clientY - titleStartY;
      if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
    }, {passive:true});
    cardEl.addEventListener('contextmenu', e => e.preventDefault());
  }, 0);

  return slot;
}

function renderTimeline(instantScroll = true){
  app.innerHTML = "";

  if (rawEvents.length === 0){
    app.innerHTML = `<div class="slot"><div class="card" style="text-align:center;"><div class="title-row">Žádné události</div></div></div>`;
    return;
  }

  centerIndex = 0;
  for (let i=0;i<rawEvents.length;i++){
    if (rawEvents[i].end >= now){ centerIndex = i; break; }
    centerIndex = i;
  }

  const orderedIndices = [];
  for (let i = rawEvents.length - 1; i > centerIndex; i--) orderedIndices.push(i); // future, furthest first (top)
  orderedIndices.push(centerIndex); // now (center)
  for (let i = centerIndex - 1; i >= 0; i--) orderedIndices.push(i); // past, nearest-past first (just below now)

  // Roky zastoupené v událostech — globálně pro onclick
  window._yearsInTimeline = [...new Set(orderedIndices.map(i => rawEvents[i].start.getFullYear()))];
  let lastYear = null;

  orderedIndices.forEach((i) => {
    const ev = rawEvents[i];
    const isNow = i === centerIndex;
    const isPast = i < centerIndex;
    const kind = isNow ? "now" : (isPast ? "past" : "future");
    const evYear = ev.start.getFullYear();

    // Oddělovač roku
    if(evYear !== lastYear){
      const yd = document.createElement('div');
      yd.id = `yr_${evYear}`;
      yd.style.cssText = 'text-align:center;font-family:"JetBrains Mono",monospace;color:var(--muted);padding:14px 0 8px;cursor:pointer;user-select:none;';
      if(lastYear !== null){
        yd.innerHTML = `
          <div style="font-size:18px;letter-spacing:0.15em;">${lastYear}</div>
          <div style="width:56px;height:1px;background:rgba(120,150,130,0.4);margin:6px auto;"></div>
          <div style="font-size:18px;letter-spacing:0.15em;">${evYear}</div>
        `;
      } else {
        yd.innerHTML = `<div style="font-size:18px;letter-spacing:0.15em;">— ${evYear} —</div>`;
      }
      yd.onclick = () => openYearPicker(window._yearsInTimeline, evYear);
      app.appendChild(yd);
      lastYear = evYear;
    }

    const slot = buildTimelineSlot(ev, i, isNow, isPast);
    app.appendChild(slot);
  });

  const nowSlot = document.querySelector('.slot.now');
  if (nowSlot && instantScroll) nowSlot.scrollIntoView({block:"center"});
}

          }));

        if(m) photoAlbum = m[0].replace(/&amp;/g,'&');
      }
      const title = (it.summary||'(bez názvu)').trim();
      if(!photoAlbum){
        const key = Object.keys(PHOTO_ALBUMS).find(k => k.trim().toLowerCase() === title.toLowerCase());
        if(key) photoAlbum = PHOTO_ALBUMS[key];
      }
      const updated = it.updated ? new Date(it.updated) : null;
      return { start, end, title, place: it.location||'', photoAlbum, driveFiles, updated, raw: it };
    }).sort((a,b)=>a.start-b.start);
    renderTimeline(instantScroll);
    updateAlbumsBadge();
    setTimeout(checkUpcomingNotifications, 1000);
    setTimeout(checkAnniversaries, 1500);
    setTimeout(checkBirthdaysAndNamedays, 2000);
    setTimeout(checkWeatherEffect, 2500);
  }catch(e){
  }
}

const SEARCH_KNOWN_PLACES = {
  'bouda':     '49.432694,16.622583',
  'hastrman':  '49.463861,16.496667',
  'funibrouk': '49.446694,16.665611',
  'sjíždění':  '49.482333,16.608556',
  'sjizdeni':  '49.482333,16.608556',
};
function mapUrl(place){
  if(!place) return `https://www.google.com/maps/search/?api=1&query=`;
  // 1) přímý odkaz na Google Maps v textu místa
  const urlMatch = place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
  if(urlMatch) return urlMatch[0];
  // 2) desetinné GPS souřadnice v textu (např. "49.432694,16.622583")
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `https://www.google.com/maps/search/?api=1&query=${decMatch[1]},${decMatch[2]}`;
  // 3) souřadnice ve formátu stupně/minuty/vteřiny
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  // 4) známá pojmenovaná místa (bouda, hastrman, ...)
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return `https://www.google.com/maps/search/?api=1&query=${SEARCH_KNOWN_PLACES[clean]}`;
  }
  // 5) fallback — hledat podle textu místa
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
}
function calDayUrl(d){
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `https://calendar.google.com/calendar/u/0/r/day/${y}/${m}/${day}`;
}

let _searchRenderToken = 0;

function renderResults(query){
  const myToken = ++_searchRenderToken;
  const q = query.trim().toLowerCase();
  searchResults.innerHTML = "";
  if (!q){ return; }
  const matches = rawEvents
    .map((ev, i) => ({ev, i}))
    .filter(({ev}) => ev.title.toLowerCase().includes(q) || (ev.place && ev.place.toLowerCase().includes(q)));

  if (matches.length === 0){
    searchResults.innerHTML = `<div class="no-results">Žádná událost neodpovídá hledání</div>`;
    return;
  }

  // Řazení jako hlavní timeline: chronologicky vzestupně, najdi "aktuální" (nejbližší k teď),
  // pak posklládej DOM tak, aby scrollem nahoru šly budoucí (nejvzdálenější nahoře) a scrollem
  // dolů minulé (nejstarší dole) — aktuální položka je po vykreslení zarovnaná nahoru výsledků.
  const curNow = new Date();
  const chrono = [...matches].sort((a,b) => a.ev.start - b.ev.start);
  let centerIndex = chrono.findIndex(({ev}) => ev.end >= curNow);
  if (centerIndex === -1) centerIndex = chrono.length - 1; // všechny nalezené jsou minulé → nejnovější z nich bude "aktuální"

  const ordered = [];
  for (let idx = chrono.length - 1; idx > centerIndex; idx--) ordered.push(chrono[idx]); // budoucí, nejvzdálenější první
  ordered.push(chrono[centerIndex]); // aktuální / nejbližší
  for (let idx = centerIndex - 1; idx >= 0; idx--) ordered.push(chrono[idx]); // minulé, nejnovější první

  let currentRow = null;
  ordered.forEach(({ev, i}, pos) => {
    const row = document.createElement('div');
    row.className = 'result-item';
    const isCurrent = pos === (chrono.length - 1 - centerIndex);
    if (isCurrent) row.style.cssText = 'border-color:rgba(62,143,104,0.7);background:rgba(62,143,104,0.08);';
    row.innerHTML = `
      <div class="result-main">
        ${isCurrent ? `<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;">aktuální</div>` : ``}
        <div class="result-title">${ev.title}${ev.photoAlbum ? ` <span title="Má fotoalbum" style="display:inline-flex;vertical-align:middle;margin-left:4px;">${albumIconSVG()}</span>` : ``}</div>
        <div class="result-meta">${fmtDate(ev.start)} · ${fmtTime(ev.start, ev.end)}${ev.place ? ' · '+ev.place : ''}</div>
      </div>
      ${ev.place ? `<a class="map-pin" href="${mapUrl(ev.place)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${pinSVG()}</a>` : ``}
    `;
    row.addEventListener('click', () => {
      closeSearch();
      setTimeout(() => {
        const app = document.getElementById('app');
        const target = document.querySelector(`.slot[data-idx="${i}"]`);
        if(target && app){
          app.style.scrollSnapType = 'none';
          const offset = target.offsetTop - (app.clientHeight/2) + (target.offsetHeight/2);
          app.scrollTo({top: Math.max(0, offset), behavior:'smooth'});
          setTimeout(() => app.style.scrollSnapType = '', 800);
        }
      }, 50);
    });
    searchResults.appendChild(row);
    if (isCurrent) currentRow = row;
  });

  if (currentRow){
    requestAnimationFrame(() => {
      if (myToken !== _searchRenderToken) return; // mezitím proběhlo novější hledání, tohle je zastaralé
      currentRow.scrollIntoView({block: 'start', behavior: 'auto'});
    });
  }
}

function checkUpcomingNotifications(){

  localStorage.setItem('notifShownDate', todayStr);

  upcoming.forEach((ev, idx) => {
    const evDay = new Date(ev.start);
    evDay.setHours(0,0,0,0);

    const backdrop = document.createElement('div');

        <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
        <div class="ev-modal-label" style="font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(18px,5.5vw,26px);letter-spacing:-0.01em;text-transform:none;color:var(--ink);text-align:center;padding:4px 0;">Už se těšíš?</div>
        <div class="ev-modal-title">${ev.title}</div>
        <div class="ev-modal-label">Kdy</div>
        <div class="ev-modal-value">${fmtDateRange(ev)} · ${daysText}</div>
        ${ev.place ? `<div class="ev-modal-label">Místo</div><div class="ev-modal-value">${ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place}</div>` : ''}
        ${ev.place ? `<div id="notifWx_${evIdx}" style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px;"></div>` : ''}

          display:block; width:100%; margin-top:16px;
          background:var(--accent); border:none;
          color:#12261C; font-family:'Inter',sans-serif; font-size:14px;
          padding:12px; border-radius:var(--radius-sm); cursor:pointer; font-weight:700;
        ">OK</button>
      </div>
    `;
    document.body.appendChild(backdrop);
    setTimeout(() => { if(backdrop.parentElement) backdrop.remove(); }, 15000);

    // Načti počasí pro notifikaci
    if(ev.place){
      const wxDateStr = ev.start.toISOString().split('T')[0];
      const KNOWN_PLACES = {'bouda':'49.432694,16.622583','hastrman':'49.463861,16.496667','funibrouk':'49.446694,16.665611','sjíždění':'49.482333,16.608556','sjizdeni':'49.482333,16.608556'};
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      let wxCoords = null;

      const startHourNotif = isAllDayNotif ? 9 : ev.start.getHours();

function shortenPlace(place){
  if(!place) return place;
  const cutMatch = place.match(/\s\d|\bOkres\b|,/);
  if(cutMatch) return place.slice(0, cutMatch.index).trim() || place;
  return place;
}

function stripOrdinalPrefix(title){
  return title.replace(/^\d+\.\s*/, '').trim();
}

function normalizeGroupTitle(title){
  const stripped = stripOrdinalPrefix(title);
  return stripped.charAt(0).toUpperCase() + stripped.slice(1);
}

function openEventGroupTimeline(rawTitle){
  const key = normalizeGroupTitle(rawTitle);
  const matchIndices = [];
  rawEvents.forEach((ev, idx) => { if(normalizeGroupTitle(ev.title) === key) matchIndices.push(idx); });
  if(matchIndices.length === 0) return;

  // Najdi "teď" v rámci téhle podmnožiny (stejná logika jako hlavní timeline)
  let subCenter = matchIndices[0];
  for(const idx of matchIndices){
    if(rawEvents[idx].end >= now){ subCenter = idx; break; }
    subCenter = idx;
  }
  const centerPos = matchIndices.indexOf(subCenter);

  const ordered = [];
  for(let p = matchIndices.length - 1; p > centerPos; p--) ordered.push({idx: matchIndices[p], kind:'future'});
  ordered.push({idx: subCenter, kind:'now'});
  for(let p = centerPos - 1; p >= 0; p--) ordered.push({idx: matchIndices[p], kind:'past'});

  const overlay = document.createElement('div');
  overlay.id = 'eventGroupOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;';
  const marqueeDuration = Math.max(6, key.length * 0.35);
  overlay.innerHTML = `
    <div class="app" id="eventGroupApp" style="flex:1;"></div>
    <div style="flex-shrink:0;background:var(--bg2);position:relative;padding:8px 20px max(14px, env(safe-area-inset-bottom)) 20px;display:flex;flex-direction:column;align-items:center;border-top:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-md);">
      <div onclick="closeEventGroupTimeline()" style="width:44px;height:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <div style="width:100%;overflow:hidden;position:relative;height:22px;">
        <div style="position:absolute;top:0;left:0;white-space:nowrap;font-family:'Inter',sans-serif;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;animation:marqueeScroll ${marqueeDuration}s linear infinite;">${key}</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const groupApp = document.getElementById('eventGroupApp');
  const spacerTop = document.createElement('div');
  spacerTop.style.cssText = 'height:50vh;';
  groupApp.appendChild(spacerTop);
  ordered.forEach(({idx, kind}) => {
    const ev = rawEvents[idx];
    const slot = buildTimelineSlot(ev, idx, kind==='now', kind==='past', 'grp'+idx);
    groupApp.appendChild(slot);

  groupApp.appendChild(spacerBottom);

  const nowSlot = groupApp.querySelector('.slot.now');
  if(nowSlot) nowSlot.scrollIntoView({block:'center'});

  if(modeBtn) modeBtn.textContent = mode === 'date' ? 'Dle akce' : 'Dle data';

  if(mode === 'date'){
    const byYear = {};
    withAlbums.forEach(ev => {
      const y = ev.start.getFullYear();
      if(!byYear[y]) byYear[y] = [];
      byYear[y].push(ev);
    });
    const years = Object.keys(byYear).map(Number).sort((a,b) => b-a);
    const allYears = years.join(',');

    let rows = '';
    if(withAlbums.length){
      years.forEach((year, yi) => {
        rows += `<div id="albumYear_${year}" style="text-align:center;font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:-0.01em;color:var(--ink);padding:16px 0 8px;${yi>0?'border-top:1px solid var(--line);':''}cursor:pointer;user-select:none;" onclick="showYearPicker('${allYears}','${year}')">${year} ▾</div>`;
        byYear[year].forEach(ev => {
          const isNew = window._newAlbumKeys && window._newAlbumKeys.has(getEventKey(ev));
          rows += `
            <div class="album-item" onclick="checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">
              <div class="album-info">
                <div class="album-date">${fmtDate(ev.start)}</div>
                <div class="album-title">${ev.title}</div>
              </div>
              <div class="album-badge-slot">${isNew ? '<span class="album-new-tag">NOVÉ</span>' : ''}</div>
              <div class="album-arrow">›</div>
            </div>`;
        });
      });
    } else {
      rows = `<div class="albums-empty">Zatím žádná fotoalba<br><small style="color:var(--muted);font-size:11px;">(${rawEvents.filter(e=>e.end<curNow).length} minulých událostí)</small></div>`;
    }
    content.innerHTML = rows;
  } else {
    // Dle akce — unikátní názvy (bez úvodní číslovky), s vlastním pořadím
    const byTitle = {};
    withAlbums.forEach(ev => {
      let key = normalizeGroupTitle(ev.title);
      if(!byTitle[key]) byTitle[key] = [];
      byTitle[key].push(ev);
    });

    const PRIORITY_ORDER = ["Rolf","Velkopáteční pochod","Pálení čarodějnic","Výroční oheň","Zakončení léta","Mikuláš u Hastrmana","Vánoční pochod","Silvestrovský výšlap"];

    const titles = Object.keys(byTitle).sort((a,b) => {
      const ia = PRIORITY_ORDER.indexOf(a);
      const ib = PRIORITY_ORDER.indexOf(b);
      if(ia !== -1 && ib !== -1) return ia - ib;
      if(ia !== -1) return -1;
      if(ib !== -1) return 1;
      // ostatní akce — chronologicky od nejnovější (dle posledního výskytu)
      const lastA = Math.max(...byTitle[a].map(ev => ev.start.getTime()));
      const lastB = Math.max(...byTitle[b].map(ev => ev.start.getTime()));
      return lastB - lastA;
    });

    let rows = '';
    if(titles.length){
      titles.forEach(title => {
        const list = byTitle[title];
        const clickAction = list.length === 1
          ? `checkAlbumAccess('${list[0].photoAlbum.replace(/'/g,"\\'")}')`
          : `showAlbumInstances('${title.replace(/'/g,"\\'")}')`;
        const hasNew = window._newAlbumKeys && list.some(ev => window._newAlbumKeys.has(getEventKey(ev)));
        rows += `
          <div class="album-item" onclick="${clickAction}">
            <div class="album-info">
              <div class="album-title">${title}</div>
              ${list.length>1 ? `<div class="album-date">${list.length}× v historii</div>` : `<div class="album-date">${fmtDate(list[0].start)}</div>`}
            </div>
            <div class="album-badge-slot">${hasNew ? '<span class="album-new-tag">NOVÉ</span>' : ''}</div>
            <div class="album-arrow">›</div>
          </div>`;
      });
    } else {
      rows = `<div class="albums-empty">Zatím žádná fotoalba</div>`;
    }
    content.innerHTML = rows;
  }
}

function getEventKey(ev){
  return (ev.raw && ev.raw.id) ? ev.raw.id : ev.title.replace(/[^a-zA-Z0-9]/g,'_') + '_' + ev.start.toISOString().slice(0,10);
}

async function czechIBAN(account, bank){
  const bban = bank.padStart(4,'0') + '000000' + account.padStart(10,'0');
  const numStr = bban + '1235' + '00';
  let rem = 0;
  for(const d of numStr) rem = (rem * 10 + parseInt(d)) % 97;
  return 'CZ' + String(98 - rem).padStart(2,'0') + bban;
}

    const ref = db.collection('events').doc(key).collection('likes').doc(user);

    if(!text) return;
    const user = getUserName();
    if(!user) return;

    try{

      await refreshComments(evIdx, key);

        if(list) list.scrollTop = list.scrollHeight;
      }, 200);
    }catch(e){
      sendBtn.textContent = 'Odeslat';
      sendBtn.disabled = false;
      alert('Chyba: '+e.message);
    }
  });
}

async function postComment(evIdx, parentId){
  try{
    const ev = rawEvents[evIdx];
    const key = getEventKey(ev);
    const inputId = parentId ? 'replyInput_'+parentId : 'commentInput_'+evIdx;
    const input = document.getElementById(inputId);
    const text = (input&&input.value||'').trim();
    if(!text) return;
    const user = getUserName();
    if(!user) return;
    await db.collection('events').doc(key).collection('comments').add({
      user, text, at: new Date().toISOString(), parentId: parentId||null
    });
    input.value = '';
    const replyBox = document.getElementById('replyBox_'+parentId);
    if(replyBox) replyBox.style.display = 'none';
    refreshComments(evIdx, key);
  }catch(e){ console.error('comment error',e); alert('Chyba: '+e.message); }
}

async function deleteComment(evIdx, key, docId){
  const pwd = prompt('Zadej heslo pro smazání:');
  if(pwd !== '8006293768'){ alert('Špatné heslo'); return; }
  const ref = db.collection('events').doc(key).collection('comments');
  // Smaž komentář i všechny jeho odpovědi (rekurzivně, kdyby byly odpovědi na odpovědi)
  const deleteWithReplies = async (id) => {
    const repliesSnap = await ref.where('parentId', '==', id).get();
    for(const r of repliesSnap.docs){
      await deleteWithReplies(r.id);
    }
    await ref.doc(id).delete();
  };
  await deleteWithReplies(docId);
  refreshComments(evIdx, key);
}

function toggleReply(parentId){
  const box = document.getElementById('replyBox_'+parentId);
  if(!box) return;
  box.style.display = box.style.display === 'none' ? 'flex' : 'none';
  if(box.style.display === 'flex') document.getElementById('replyInput_'+parentId)?.focus();
}

async function toggleCommentReaction(evIdx, key, commentId, emoji){
  const user = getUserName();
  if(!user) return;
  try{
    const ref = db.collection('events').doc(key).collection('comments').doc(commentId);
    const snap = await ref.get();
    const data = snap.data() || {};
    const reactions = data.reactions || {};
    const hasReacted = (reactions[emoji] || []).includes(user);

    // Jedna aktivní reakce na osobu — nejdřív ji všude odeber, pak případně přidej k vybranému emoji
    const newReactions = {};
    Object.keys(reactions).forEach(e => {
      const filtered = (reactions[e] || []).filter(u => u !== user);
      if(filtered.length) newReactions[e] = filtered;
    });
    if(!hasReacted){
      newReactions[emoji] = [...(newReactions[emoji] || []), user];
    }
    await ref.update({ reactions: newReactions });
    refreshComments(evIdx, key);
  }catch(e){
    console.error('Chyba při ukládání reakce:', e);
  }
}

async function refreshComments(evIdx, key){
  const list = document.getElementById('commentList_'+evIdx);
  if(!list) return;
  const QUICK_COMMENT_EMOJIS = ['👍','❤️','😂','😮','😢'];
  const currentUser = localStorage.getItem('kokrsnekUser') || '';
  try{
    const snap = await db.collection('events').doc(key).collection('comments').get();
    const docs = snap.docs.sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
    const renderComment = (d, depth) => {
      const data = d.data();
      const time = data.at ? new Date(data.at).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'}) : '';
      const indent = Math.min(depth, 4) * 12;
      const childReplies = docs.filter(r => r.data().parentId === d.id)
        .sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
      const reactions = data.reactions || {};
      const reactionsRow = QUICK_COMMENT_EMOJIS.map(em => {
        const users = reactions[em] || [];
        const active = users.includes(currentUser);
        return `<button onclick="toggleCommentReaction(${evIdx},'${key}','${d.id}','${em}')" style="
          background:${active ? 'var(--accent-soft)' : 'var(--surface)'};
          border:1px solid ${active ? 'rgba(62,143,104,0.5)' : 'var(--line)'};
          border-radius:100px; padding:3px 8px; font-size:12.5px; cursor:pointer;
          display:inline-flex; align-items:center; gap:3px; color:var(--ink); line-height:1.3;
        ">${em}${users.length > 0 ? `<span style="font-size:10.5px;color:var(--muted);font-family:'Inter',sans-serif;">${users.length}</span>` : ''}</button>`;
      }).join('');
      return `<div style="padding:8px 0 4px;${depth > 0 ? `margin-left:${indent}px;border-left:2px solid var(--line);padding-left:10px;` : 'border-bottom:1px solid var(--line);'}">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-size:12px;font-weight:700;color:var(--accent);font-family:'Inter',sans-serif;">${data.user}</span>
          <span style="font-size:11.5px;color:var(--muted);font-family:'Inter',sans-serif;">${time}</span>
          <button onclick="openCommentEditor(${evIdx},window['evKey_'+${evIdx}],'${d.id}')" style="background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0;font-family:'Inter',sans-serif;font-weight:500;">↩ odpovědět</button>
          <button onclick="deleteComment(${evIdx},'${key}','${d.id}')" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-left:auto;">🗑</button>
        </div>
        <div style="font-size:14px;color:var(--ink);margin-top:3px;font-family:'Inter',sans-serif;">${data.text}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;">${reactionsRow}</div>
        ${childReplies.map(r => renderComment(r, depth + 1)).join('')}
      </div>`;
    };

    const roots = docs.filter(d => !d.data().parentId);

    list.innerHTML = roots.length === 0
      ? '<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px;font-family:\'Inter\',sans-serif;">Zatím žádné komentáře</div>'
      : roots.map(d => renderComment(d, 0)).join('');
  }catch(e){
    const list2 = document.getElementById('commentList_'+evIdx);
    if(list2) list2.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:8px;font-family:\'Inter\',sans-serif;">'+e.message+'</div>';
  }
}

function pickQuizQuestion(){
  const qs = window.QUIZ_QUESTIONS;
  const st = window.quizState;
  if(st.usedIndices.length >= qs.length) st.usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random()*qs.length); } while(st.usedIndices.includes(idx));
  st.usedIndices.push(idx);
  return qs[idx];
}

function nextQuizQuestion(){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  st.token = (st.token || 0) + 1;
  const myToken = st.token;
  const question = pickQuizQuestion();
  st.timeLeft = 10;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const order = [0,1,2].sort(() => Math.random()-0.5);
  content.innerHTML = `
    <div style="font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.02em;color:var(--muted);font-weight:600;margin-bottom:6px;">Série: ${st.streak}</div>
    <div id="quizTimer" style="font-family:'Inter',sans-serif;font-size:30px;font-weight:800;color:var(--accent);margin-bottom:10px;">10</div>
    <div class="ev-modal-title" style="margin-bottom:16px;">${question.q}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${order.map(i => `<button onclick="answerQuiz(${i === question.correct})" style="
        background:var(--surface);border:1px solid var(--line);
        color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
        padding:13px;border-radius:var(--radius-sm);cursor:pointer;">${question.a[i]}</button>`).join('')}
    </div>
  `;
  const timerEl = document.getElementById('quizTimer');
  let myIntervalId;
  myIntervalId = setInterval(() => {
    if(window.quizState !== st || st.token !== myToken){ clearInterval(myIntervalId); return; } // osiřelý/zastaralý časovač — ignoruj a nezasahuj do aktuální hry
    st.timeLeft--;
    if(timerEl) timerEl.textContent = st.timeLeft;
    if(st.timeLeft <= 3 && timerEl) timerEl.style.color = '#E2664F';
    if(st.timeLeft <= 0){
      clearInterval(myIntervalId);
      answerQuiz(false, 'vypršel čas');
    }
  }, 1000);
  st.timerInterval = myIntervalId;
}

function answerQuiz(isCorrect, reason){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  if(isCorrect){
    st.streak++;
    nextQuizQuestion();
  } else {
    endQuiz(reason || 'špatná odpověď (klik)');
  }
}

function endQuiz(reason){
  const st = window.quizState;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const savedName = localStorage.getItem('kokrsnekUser') || '';
  const streakWord = st.streak===1 ? 'otázku' : (st.streak>=2 && st.streak<=4 ? 'otázky' : 'otázek');
  content.innerHTML = `
    <div class="ev-modal-title" style="margin-bottom:6px;">Konec!</div>
    <div class="ev-modal-label" style="margin-bottom:16px;font-size:14.5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);">Uhodl jsi <span style="color:var(--accent);font-weight:700;">${st.streak}</span> ${streakWord} v řadě</div>
    <input id="quizNameInput" type="text" placeholder="Tvoje jméno…" value="${savedName}" style="
      width:100%; box-sizing:border-box;
      background:var(--surface); border:1px solid var(--line);
      color:var(--ink); font-family:'Inter',sans-serif;
      font-size:16px; padding:12px 14px; border-radius:var(--radius-sm); outline:none; margin-bottom:12px;
    ">
    <button onclick="submitQuizScore()" style="
      display:block;width:100%;
      background:var(--accent);border:none;color:#12261C;
      font-family:'Inter',sans-serif;font-size:14px;
      padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;
    ">Uložit a zobrazit žebříček</button>
  `;
  setTimeout(() => document.getElementById('quizNameInput')?.focus(), 100);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => {
      const netInfo = navigator.onLine ? 'telefon si myslí, že je online' : 'telefon hlásí, že je OFFLINE';
      reject(new Error(`Vypršel časový limit (databáze neodpověděla do ${ms/1000}s — ${netInfo})`));
    }, ms))
  ]);
}

// Zkusí akci vícekrát za sebou, než se definitivně vzdá (pro nespolehlivé připojení)
async function withRetry(fn, attempts = 2){
  let lastErr;
  for(let i = 0; i < attempts; i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; console.warn(`Pokus ${i+1}/${attempts} selhal:`, e.message); }
  }
  throw lastErr;
}

async function submitQuizScore(){
  const st = window.quizState;
  const input = document.getElementById('quizNameInput');
  const name = (input?.value || '').trim();
  if(!name){ input?.focus(); return; }
  localStorage.setItem('kokrsnekUser', name);
  const content = document.getElementById('quizModalContent');
  let saveError = null;
  try{
    const ref = db.collection('events').doc('_quiz_leaderboard').collection('scores').doc(name);
    // Ulož pokus do historie a zjisti dosavadní nejlepší skóre paralelně (rychlejší, méně náchylné na výpadek)
    const [, snap] = await withRetry(() => Promise.all([
      withTimeout(ref.collection('attempts').add({ score: st.streak, at: new Date().toISOString() }), 8000),
      withTimeout(ref.get(), 8000),
    ]));
    const prevBest = snap.exists ? (snap.data().score || 0) : -1;
    if(st.streak > prevBest){
      await withRetry(() => withTimeout(ref.set({ name, score: st.streak, at: new Date().toISOString() }), 8000));
    }
  }catch(e){
    saveError = e;
    console.error('Chyba při ukládání skóre kvízu:', e);
  }
  showQuizLeaderboard(saveError);
}
