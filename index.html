        background:var(--surface);border:1px solid var(--line);color:var(--ink);
        font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
        padding:11px;border-radius:var(--radius-sm);cursor:pointer;">← Zpět na žebříček</button>
    `;
  }
}

// Když se uživatel vrátí do appky (např. druhý den, appka zůstala jen na pozadí), obnov datum a timeline
let _lastKnownDay = new Date().toDateString();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  const today = new Date().toDateString();
  if(today !== _lastKnownDay){
    _lastKnownDay = today;
    refreshNow();
    fetchGoogleCalendarEvents();
  }
});

// Zavírání dialogů tažením za čárku (swipe-to-dismiss), jako u nativních iOS sheetů.
// Čárka je normální součástí karty (žádné sticky, žádné vyjímání z DOM) - při tažení se
// prostě hýbe spolu s celou kartou jako jeden kus, žádné zvláštní zacházení není potřeba.
function liftGrabber(grabber){}
function updateGrabberTop(grabber, delta){}
function restoreGrabber(grabber){}

(() => {
  let dragState = null;
  const ENGAGE_DISTANCE = 8; // od kolika px začneme sheet vizuálně posouvat (jen vizuální feedback)
  const TAP_MAX_DISTANCE = 25; // reálný prst se při ťuknutí vždy trochu hne - tohle je tolerance, ne 0
  const TAP_MAX_DURATION = 300; // ms - rychlý krátký dotek = ťuknutí, ne tažení

  document.addEventListener('touchstart', (e) => {
    const grabber = e.target.closest('.sheet-grabber-down, .sheet-grabber-up');
    if(!grabber) return;
    const sheet = grabber.parentElement;
    if(!sheet) return;
    const t = e.touches[0];
    dragState = {
      grabber, sheet,
      mode: grabber.classList.contains('sheet-grabber-up') ? 'up' : 'down',
      startY: t.clientY,
      startTime: Date.now(),
      currentY: t.clientY,
      height: sheet.getBoundingClientRect().height,
      engaged: false // teprve po překročení ENGAGE_DISTANCE začneme sheet vizuálně posouvat
    };
  }, {passive:true});

  document.addEventListener('touchmove', (e) => {
    if(!dragState) return;
    const t = e.touches[0];
    dragState.currentY = t.clientY;
    let rawDelta = t.clientY - dragState.startY;

    if(!dragState.engaged){
      if(Math.abs(rawDelta) < ENGAGE_DISTANCE) return;
      dragState.engaged = true;
      dragState.sheet.style.transition = 'none';
      liftGrabber(dragState.grabber);
      // Textové pole (kurzor) by při vizuálním odtahování dialogu jinak zůstalo viset na místě, tak ho hned schováme
      if(document.activeElement && document.activeElement.tagName === 'INPUT'){
        document.activeElement.blur();
      }
    }

    let delta = rawDelta;
    if(dragState.mode === 'down'){
      if(delta < 0) delta = 0;
    } else {
      if(delta > 0) delta = 0;
    }
    dragState.delta = delta;
    dragState.sheet.style.transform = `translateY(${delta}px)`;
    updateGrabberTop(dragState.grabber, delta);
  }, {passive:true});

  function closeGrabber(grabber){
    restoreGrabber(grabber); // vrať čárku zpátky do DOM stromu dialogu, ať zavírací akce najde svého rodiče
    if(grabber === searchClose){
      closeSearch();
    } else {
      grabber.click();
    }
  }

  function endDrag(){
    if(!dragState) return;
    const { sheet, grabber, mode, delta, height, engaged, startY, currentY, startTime } = dragState;
    dragState = null;

    const elapsed = Date.now() - startTime;
    const finalDistance = Math.abs((currentY - startY) || 0);

    // Rychlý a krátký dotek = ťuknutí, bez ohledu na to, jestli mezitím prst zavadil o pár px navíc
    if(elapsed <= TAP_MAX_DURATION && finalDistance <= TAP_MAX_DISTANCE){
      if(engaged){
        sheet.style.transition = 'transform .2s ease';
        sheet.style.transform = 'translateY(0)';
        restoreGrabber(grabber);
      }
      closeGrabber(grabber);
      return;
    }

    if(!engaged) return; // ani ťuknutí, ani tažení (např. dlouhé podržení bez pohybu) - nic neděláme

    const threshold = Math.min(120, height * 0.28);
    const absDelta = Math.abs(delta || 0);
    sheet.style.transition = 'transform .28s cubic-bezier(0.32,0.72,0,1)';

    if(absDelta > threshold){
      // Dotáhni mimo obrazovku a pak dialog skutečně zavři
      const exitY = mode === 'down' ? height + 40 : -(height + 40);
      sheet.style.transform = `translateY(${exitY}px)`;
      setTimeout(() => { closeGrabber(grabber); }, 220);
    } else {
      sheet.style.transform = 'translateY(0)';
      restoreGrabber(grabber);
    }
  }
  document.addEventListener('touchend', endDrag);
  // iOS umí gesto zrušit (touchcancel) místo dokončit (touchend), např. když si myslí, že jde o scroll.
  // Bez tohohle by dialog zůstal viset uprostřed tažení.
  document.addEventListener('touchcancel', endDrag);
})();

// Zavírání dialogů tažením dolů odkudkoliv po jejich ploše (ne jen za čárku) - jako u nativních iOS sheetů.
// Funguje jen když je obsah scrollnutý úplně nahoru, ať to nekoliduje se čtením/scrollováním.
(() => {
  let bodyDrag = null;
  const ENGAGE_DISTANCE = 30; // vyšší práh než u čárky - běžné zachvění prstu při klikání na tlačítko nesmí spustit zavírání
  const EXCLUDE_SELECTOR = 'button, a, input, textarea, select, [id^="commentList_"]';

  document.addEventListener('touchstart', (e) => {
    if(e.target.closest('.sheet-grabber-down, .sheet-grabber-up')) return; // o to se stará předchozí blok
    if(e.target.closest(EXCLUDE_SELECTOR)) return; // tlačítka, odkazy a vnořený scroll komentářů necháme být
    const sheet = e.target.closest('.ev-modal');
    if(!sheet) return;
    if(sheet.scrollTop > 0) return; // není nahoře - ať funguje normální scroll

    const grabber = sheet.querySelector('.sheet-grabber-down');
    if(!grabber) return; // umíme zavřít jen "down" sheety, které mají čárku dole doplněnou

    const t = e.touches[0];
    bodyDrag = {
      sheet, grabber,
      startX: t.clientX, startY: t.clientY,
      height: sheet.getBoundingClientRect().height,
      engaged: false
    };
  }, {passive:true});

  document.addEventListener('touchmove', (e) => {
    if(!bodyDrag) return;
    const t = e.touches[0];
    const dy = t.clientY - bodyDrag.startY;
    const dx = t.clientX - bodyDrag.startX;

    if(!bodyDrag.engaged){
      if(bodyDrag.sheet.scrollTop > 0){ bodyDrag = null; return; } // mezitím se to samo odscrollovalo
      if(dy < ENGAGE_DISTANCE || Math.abs(dx) > dy) return; // musí to být zřetelný tah dolů, ne do strany
      bodyDrag.engaged = true;
      bodyDrag.sheet.style.transition = 'none';
      liftGrabber(bodyDrag.grabber);
      if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')){
        document.activeElement.blur();
      }
    }

    e.preventDefault(); // potlač nativní rubber-band scroll, ať se to nepere s naším posouváním
    bodyDrag.delta = Math.max(0, dy);
    bodyDrag.sheet.style.transform = `translateY(${bodyDrag.delta}px)`;
    updateGrabberTop(bodyDrag.grabber, bodyDrag.delta);
  }, {passive:false});

  function endBodyDrag(){
    if(!bodyDrag) return;
    const { sheet, grabber, delta, height, engaged } = bodyDrag;
    bodyDrag = null;
    if(!engaged) return;

    const threshold = Math.min(120, height * 0.28);
    sheet.style.transition = 'transform .28s cubic-bezier(0.32,0.72,0,1)';

    if((delta || 0) > threshold){
      sheet.style.transform = `translateY(${height + 40}px)`;
      setTimeout(() => { restoreGrabber(grabber); grabber.click(); }, 220);
    } else {
      sheet.style.transform = 'translateY(0)';
      restoreGrabber(grabber);
    }
  }
  document.addEventListener('touchend', endBodyDrag);
  document.addEventListener('touchcancel', endBodyDrag);
})();

renderTimeline();
setTimeout(showWelcome, 300);
</script>
