<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KoKrŠNeK">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<title>KoKrŠNeK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#050505;
    --card:#0B0B0B;
    --line:#1A3A1A;
    --ink:#E8F8E8;
    --muted:#6AAF7A;
    --accent:#4DBF6A;
    --accent-soft:rgba(77,191,106,0.12);
    --past:#5A8F6A;
    --past-soft:#050D07;
    --link:#7EDD8A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background-color:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    overscroll-behavior-y: none;
  }
  .app{
    height:100vh;
    width:100%;
    overflow-y:auto;
    scroll-snap-type:y proximity;
    position:relative;
    padding-bottom:160px;
    scroll-padding-bottom:160px;
    box-sizing:border-box;
    -webkit-overflow-scrolling:touch;
  }
  .search-btn{
    position:fixed;
    bottom:110px; right:18px;
    top:auto;
    z-index:20;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(11,11,11,0.7);
    border:1px solid rgba(60,180,80,0.45);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
  }
  #gearBtn{
    right:64px;
  }
  #gearBtn.connected{
    border-color:rgba(60,180,80,0.9);
    background:rgba(14,95,168,0.25);
  }
  .search-btn svg{
    width:18px; height:18px;
    stroke:var(--accent);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
  }

  .search-overlay{
    position:fixed;
    top:0; left:0; right:0;
    height:50dvh; min-height:220px;
    z-index:40;
    background:var(--card);
    border-bottom:2px solid rgba(60,180,80,0.4);
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,12px) 16px 12px;
    box-sizing:border-box;
    box-shadow:0 4px 24px rgba(0,0,0,0.5);
    transform:translateY(-100%);
    transition:transform .25s ease;
  }
  .search-overlay.open{ transform:translateY(0); }

  .config-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(0,0,0,0.94);
    backdrop-filter:blur(2px);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    transform:translateY(-100%);
    transition:transform .15s ease;
  }
  .config-overlay.open{ transform:translateY(0); }
  .config-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
  }
  .config-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
  }
  .config-input{
    width:100%;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:10px 12px;
    border-radius:4px;
    outline:none;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .config-input:focus{ border-color:rgba(60,180,80,0.9); }
  .config-status{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin:8px 0 14px;
    min-height:18px;
  }
  .config-status.ok{ color:#3DB460; }
  .config-status.err{ color:#FF4444; }
  .config-btns{
    display:flex; gap:10px; margin-top:4px;
  }

  .search-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .search-row input[type="text"]{
    flex:1;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:11px 12px;
    border-radius:4px;
    outline:none;
  }
  .search-row input[type="text"]::placeholder{ color:var(--muted); }
  .search-close{
    width:38px; height:38px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--accent);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }

  .date-row-search{
    display:flex; align-items:center; gap:10px;
    margin-bottom:18px;
  }
  .date-row-search input[type="date"]{
    flex:1;
    background:#0B0B0B;
    border:1px solid rgba(60,180,80,0.4);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:9px 10px;
    border-radius:4px;
    outline:none;
    color-scheme:dark;
  }
  .cal-btn{
    flex-shrink:0;
    background:var(--accent);
    color:#000;
    border:none;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:9px 12px;
    border-radius:4px;
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
  }

  .search-results{
    flex:1;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-bottom:24px;
  }
  .result-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    border:1px solid rgba(60,180,80,0.22);
    border-radius:4px;
    padding:10px 12px;
    cursor:pointer;
  }
  .result-item:active{ background:rgba(60,180,80,0.08); }
  .result-main{ flex:1; min-width:0; }
  .result-title{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .map-pin{
    flex-shrink:0;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid rgba(60,180,80,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .map-pin svg{ width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2; }
  .no-results{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    margin-top:24px;
  }

  .topbar{
    position:fixed;
    top:auto !important;
    bottom:0; left:0; right:0;
    padding:10px 16px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    z-index:5;
    background:linear-gradient(transparent, var(--bg) 50%);
    pointer-events:none;
  }
  .topbar .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(18px, 6.5vw, 36px);
    letter-spacing:0.04em;
    color:var(--accent);
    text-transform:uppercase;
    width:100%;
    max-width:100%;
    text-align:center;
    white-space:nowrap;
  }
  .topbar .today{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .topbar .nameday{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--muted);
  }

  .slot{
    height:33.34dvh;
    min-height:180px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:center;
    position:relative;
    padding:8px 26px;
    box-sizing:border-box;
  }

  .dot{
    position:absolute;
    left:50%; top:50%;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    transform:translate(-50%,-50%);
    z-index:1;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:380px;
    transition:opacity .25s ease, transform .25s ease;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .eyebrow .pip{
    width:5px; height:5px;
    background:var(--muted);
    display:inline-block;
  }

  .date-row{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    color:var(--ink);
    line-height:1.05;
    margin:0 0 1px;
  }
  .time-row{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
    letter-spacing:0.04em;
  }
  .title-row{
    font-family:'JetBrains Mono', monospace;
    font-size:30px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0 0 4px;
    line-height:1.15;
  }
  .place-row{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .place-row::before{ content:"-= "; }
  .place-row::after{ content:" =-"; }

  /* --- NOW (center, dominant) --- */
  .slot.now .card{
    background:linear-gradient(180deg, rgba(60,180,80,0.08), rgba(0,0,0,0));
    border:2.5px solid rgba(60,180,80,0.75);
    border-radius:2px;
    padding:16px 20px 14px;
    position:relative;
    text-align:center;
  }
  .slot.now .card::before,
  .slot.now .card::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border:2.5px solid var(--accent);
  }
  .slot.now .card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .slot.now .card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .slot.now .eyebrow{ color:#E53935; justify-content:center; font-size:15.75px; }
  .slot.now .eyebrow .pip{ background:#E53935; }
  .slot.now .date-row{ font-size:22px; }
  .slot.now .title-row{
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    border-bottom:2px solid var(--accent);
    display:inline-block;
    padding-bottom:2px;
  }
  .slot.now .badge{
    display:inline-block;
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#000;
    background:var(--accent);
    padding:3px 9px;
    box-shadow:0 0 10px rgba(60,180,80,0.6);
  }

  /* --- FUTURE (above now) --- */
  .slot.future .card{
    text-align:center;
  }
  .slot.future .date-row{ font-size:22px; }
  .slot.future .title-row{ font-size:32px; font-weight:700; color:var(--ink); }
  .slot.future .eyebrow{ justify-content:center; color:var(--accent); }
  .slot.future .eyebrow .pip{ background:var(--accent); }

  /* --- PAST (below now, with photo link) --- */
  .slot.past .card{
    text-align:center;
  }
  .slot.past .date-row{ font-size:22px; }
  .slot.past .title-row{ font-size:32px; font-weight:700; color:var(--ink); }
  .slot.past .eyebrow{ justify-content:center; color:var(--accent); }
  .slot.past .eyebrow .pip{ background:var(--accent); }

  .photo-link{
    margin-top:9px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--link);
    background:var(--past-soft);
    border:1px solid rgba(60,180,80,0.3);
    padding:6px 12px;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .photo-link:active{ transform:scale(0.97); background:#071A0A; box-shadow:0 0 10px rgba(60,180,80,0.4); }
  .photo-link svg{ width:13px; height:13px; flex-shrink:0; }

  .ev-modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .ev-modal{
    background:#0F1117;
    border:1px solid rgba(60,180,80,0.4);
    border-radius:12px;
    width:100%; max-width:400px;
    max-height:80vh;
    overflow-y:auto;
    padding:24px 22px 20px;
    position:relative;
    animation: popIn .25s cubic-bezier(0.34,1.56,0.64,1);
    text-align:center;
  }
  .ev-modal-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; color:var(--muted);
    font-size:22px; cursor:pointer; line-height:1;
    padding:2px 6px;
  }
  .ev-modal-close:hover{ color:var(--ink); }
  .ev-modal-label{
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:3px; margin-top:14px;
    font-family:'JetBrains Mono',monospace;
  }
  .ev-modal-label:first-child{ margin-top:0; }
  .ev-modal-value{
    font-family:'JetBrains Mono',monospace;
    font-size:14px; color:var(--ink); line-height:1.5;
    word-break:break-word;
  }
  .ev-modal-title{
    font-family:'JetBrains Mono',monospace;
    font-size:20px; font-weight:700; color:var(--ink);
    margin-bottom:16px; line-height:1.3; padding-right:0;
  }
  .ev-modal-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--link); font-size:13px;
    font-family:'JetBrains Mono',monospace;
    text-decoration:none;
    border:1px solid rgba(60,180,80,0.3);
    padding:5px 12px; border-radius:100px; margin-top:4px;
  }
  .album-tile{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; box-sizing:border-box;
    background:linear-gradient(135deg, rgba(60,180,80,0.14), rgba(60,180,80,0.05));
    border:1px solid rgba(60,180,80,0.35);
    border-radius:12px; padding:14px 16px; margin-top:4px;
    color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .album-tile-icon{
    flex-shrink:0; width:38px; height:38px; border-radius:10px;
    background:rgba(60,180,80,0.18);
    display:flex; align-items:center; justify-content:center;
  }
  .album-tile-icon svg{ width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:2; }
  .album-tile-text{ text-align:center; }
  .album-tile-title{
    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--ink);
  }
  .album-tile-sub{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-top:2px;
  }
  .album-tile-arrow{ flex-shrink:0; color:var(--accent); font-size:18px; }
  .title-clickable{
    cursor:pointer; border-bottom:1px dashed rgba(60,180,80,0.4);
    transition:border-color .15s;
    -webkit-tap-highlight-color: rgba(60,180,80,0.2);
    touch-action: manipulation;
  }
  .title-clickable:hover{ border-color:var(--accent); }

  /* --- ALBUMS OVERLAY --- */
  .albums-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    pointer-events:none;
  }
  .albums-overlay.open{
    transform:translateX(0);
    pointer-events:auto;
  }
  .albums-topbar{
    padding:56px 20px 14px;
    background:var(--bg);
    border-bottom:1px solid rgba(60,180,80,0.15);
    text-align:center;
    flex-shrink:0;
  }
  .albums-topbar .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .albums-list{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
  }
  .albums-page{
    height:100vh;
    overflow-y:auto;
    background:var(--bg);
    -webkit-overflow-scrolling:touch;
    padding-bottom:120px;
    box-sizing:border-box;
  }
  .albums-header{
    padding:60px 20px 14px;
    background:var(--bg);
    text-align:center;
  }
  .albums-header .label{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--accent);
    text-transform:uppercase;
    text-align:center;
    display:block;
  }
  .album-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid rgba(60,180,80,0.1);
    cursor:pointer;
    transition:background .15s;
  }
  .album-item:active{ background:rgba(60,180,80,0.06); }
  .album-dot{
    width:10px; height:10px; border-radius:50%;
    flex-shrink:0;
    background:var(--accent);
  }
  .album-info{ flex:1; min-width:0; }
  .album-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--muted);
    margin-bottom:3px;
    letter-spacing:0.03em;
  }
  .album-title{
    font-family:'JetBrains Mono',monospace;
    font-size:15px; font-weight:700;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .album-arrow{
    color:var(--accent); font-size:18px; flex-shrink:0;
  }
  .albums-empty{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:13px; color:var(--muted);
    margin-top:40px;
  }
  .back-btn{
    position:fixed;
    bottom:110px; left:18px;
    z-index:20;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(11,11,11,0.7);
    border:1px solid rgba(60,180,80,0.45);
    display:none;
    align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
    color:var(--accent);
    font-size:20px;
    line-height:1;
  }

  @keyframes slideDown{
    from{ transform:translateY(-20px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  @keyframes tipShow{
    0%{ opacity:0; }
    10%{ opacity:1; }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }
  @keyframes popIn{
    from{ transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    to{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .hint .arrow{ animation:none; }
  }
</style>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    window.addEventListener('load', function(){
      if(typeof emailjs !== 'undefined'){
        emailjs.init({publicKey: 'eHE-eJaOEEtMKimis'});
        window._ejReady = true;
      }
    });
  </script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="app" id="app">
</div>



<!-- Fixed UI outside h-wrap so transform doesn't affect them -->
<button class="search-btn" id="albumsBtn" aria-label="Alba fotek" style="right:auto;left:64px;z-index:25;" onclick="showAlbums()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L3 19"/></svg>
</button>

<button class="search-btn" id="homeBtn" aria-label="Přejít na aktuální událost" style="right:auto;left:18px;" onclick="

function fmtDate(d){
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFull(d){
  return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(d, end){
  const t = (x)=> x.getHours().toString().padStart(2,'0')+":"+x.getMinutes().toString().padStart(2,'0');
  return end ? `${t(d)} – ${t(end)}` : t(d);
}

function isMultiDay(ev){
  const startDay = new Date(ev.start.getFullYear(), ev.start.getMonth(), ev.start.getDate());
  const endDay   = new Date(ev.end.getFullYear(),   ev.end.getMonth(),   ev.end.getDate());
  return endDay - startDay >= 86400000;
}

function fmtDateRange(ev){
  if(!isMultiDay(ev)) return fmtDate(ev.start);
  const endDisplay = new Date(ev.end.getTime() - 1);
  if(ev.start.getMonth() === endDisplay.getMonth() && ev.start.getFullYear() === endDisplay.getFullYear())
    return `${ev.start.getDate()}. – ${endDisplay.getDate()}. ${MONTHS[endDisplay.getMonth()]} ${endDisplay.getFullYear()}`;
  return `${fmtDate(ev.start)} – ${fmtDate(endDisplay)}`;
}

function fmtTimeRow(ev){
  if(isMultiDay(ev)){
    const endDisplay = new Date(ev.end.getTime() - 1);
    return `${fmtFull(ev.start)} – ${fmtFull(endDisplay)}`;
  }
  return fmtTime(ev.start, ev.end);
}

function getDaysText(ev){
  const today = new Date(); today.setHours(0,0,0,0);
  const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
  const diff = Math.round((evDay - today) / 86400000);
  if(diff === 0) return 'dnes';
  if(diff === 1) return 'zítra';
  if(diff === -1) return 'včera';
  if(diff > 0) return `za ${diff} dní`;
  return `před ${Math.abs(diff)} dny`;
}

function getPlaceCoords(place){
  if(!place) return null;
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `${decMatch[1]},${decMatch[2]}`;
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return SEARCH_KNOWN_PLACES[clean];
  }
  return null;
}

async function shareEvent(ev){
  const r = ev.raw || {};
  const isPast = ev.end < now;
  const NL = '\r\n'; // CRLF — Gmail appka na iOS občas slučuje samotné \n, s \r\n je zalomení spolehlivější
  const intro = `KoKrŠNeci tě zvou na…`;
  const introFull = `KoKrŠNeci tě zvou na ${ev.title}`;
  const dateWithDay = isMultiDay(ev) ? fmtDateRange(ev) : `${fmtFull(ev.start)} od ${fmtTime(ev.start)}`;

  let wxLine = '';
  if(ev.place){
    const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const wx = await fetchWeatherAtTime(ev.place, ev.start, getPlaceCoords(ev.place), isAllDay);
    if(wx) wxLine = wx;
  }

  let textBase, shareUrl;

  if(isPast){
    // Minulé události — popis + mapa místa + případné fotky/soubory
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    if(ev.photoAlbum) extras.push(`📸 Album fotek: ${ev.photoAlbum}`);
    if(ev.driveFiles && ev.driveFiles.length) ev.driveFiles.forEach(f => extras.push(`📄 ${f.title}: ${f.url}`));
    textBase = `${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = undefined;
  } else {
    // Budoucí události — přidej odkaz na Google Calendar a mapu místa
    const link = r.htmlLink || '';
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    textBase = `${intro}${NL}${NL}${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = link || undefined;
  }

  if(navigator.share){
    try{
      await navigator.share({ title: introFull, text: textBase, url: shareUrl });
      return;
    }catch(e){}
  }
  await navigator.clipboard.writeText(textBase + (shareUrl && !textBase.includes(shareUrl) ? NL+NL+shareUrl : ''));
  const btn = document.getElementById('shareEvBtn');
  if(btn){ btn.textContent = '✓ Zkopírováno'; setTimeout(()=>{ btn.textContent = 'Sdílet'; },2000); }
}

function exportICS(ev){
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    `DTSTART:${fmt(ev.start)}`,
    `DTEND:${fmt(ev.end)}`,
    `SUMMARY:${ev.title}`,
    ev.place ? `LOCATION:${ev.place}` : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click();
}

async function fetchWeather(place, dateStr, coords){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    // Zjisti jestli jde o minulé nebo budoucí datum
    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.daily) return null;
    const code = wxData.daily.weathercode[0];
    const max = Math.round(wxData.daily.temperature_2m_max[0]);
    const min = Math.round(wxData.daily.temperature_2m_min[0]);
    const rain = wxData.daily.precipitation_sum[0];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

async function fetchWeatherRange(place, dateStr, coords, hourStart, hourEnd){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time) return null;

    // Vyber jen hodiny v zadaném rozmezí (výchozí 9:00–22:00)
    const temps = [], rains = [], codes = [];
    wxData.hourly.time.forEach((t, i) => {
      const h = parseInt(t.slice(11,13));
      if(h >= hourStart && h <= hourEnd){
        temps.push(wxData.hourly.temperature_2m[i]);
        rains.push(wxData.hourly.precipitation[i]);
        codes.push(wxData.hourly.weathercode[i]);
      }
    });
    if(!temps.length) return null;

    const min = Math.round(Math.min(...temps));
    const max = Math.round(Math.max(...temps));
    const rain = rains.reduce((a,b) => a+b, 0);
    const code = Math.max(...codes); // nejhorší kód počasí v rámci okna = nejvýstižnější ikona
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain.toFixed(1)+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

async function fetchWeatherAtTime(place, dateObj, coords, isAllDay){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const dateStr = dateObj.toISOString().split('T')[0];
    const hour = isAllDay ? 9 : dateObj.getHours();

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time) return null;

    const targetTime = `${dateStr}T${hour.toString().padStart(2,'0')}:00`;
    let idx = wxData.hourly.time.indexOf(targetTime);
    if(idx === -1) idx = 0;

    const temp = Math.round(wxData.hourly.temperature_2m[idx]);
    const rain = wxData.hourly.precipitation[idx];
    const code = wxData.hourly.weathercode[idx];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    const timeLabel = `${hour.toString().padStart(2,'0')}:00`;
    return `${icon} ${temp}°C v ${timeLabel}${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

const now = new Date();

function at(daysOffset, h, m, durMin){
  const d = new Date(now);
  d.setDate(d.getDate()+daysOffset);
  d.setHours(h, m, 0, 0);
  const end = new Date(d.getTime() + durMin*60000);
  return {start:d, end};
}

function getNameday(d){
  const key = `${d.getDate()}.${d.getMonth()+1}`;
  return NAMEDAYS[key] || "";
}

function fmtRelativeFuture(d){
  const diffDays = Math.round((d - new Date(now.getFullYear(),now.getMonth(),now.getDate())) / 86400000);
  if (diffDays === 1) return "Zítra";
  if (diffDays <= 7) return `Za ${diffDays} dní`;
  return "Nadcházející";
}

function stripHtml(str){ return (str||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').trim(); }

function showEventDetail(idx){
  const ev = rawEvents[idx];
  if(!ev) return;
  const r = ev.raw || {};

  // Sestaví řádky detailu
  const rows = [];

  // Datum a čas
  const dateVal = isMultiDay(ev)
    ? fmtDateRange(ev)
    : `${fmtDateRange(ev)}  ·  ${fmtTime(ev.start, ev.end)}`;
  rows.push({label:'Datum a čas', value: dateVal});

  if(ev.place){
    // Zjisti jestli místo obsahuje URL na mapy
    const KNOWN_PLACES = {
      'bouda':     '49.432694,16.622583',
      'hastrman':  '49.463861,16.496667',
      'funibrouk': '49.446694,16.665611',
      'sjíždění':  '49.482333,16.608556',
      'sjizdeni':  '49.482333,16.608556',
    };
    const urlMatch = ev.place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
    const mapUrl = urlMatch ? urlMatch[0] : null;
    let gpsCoords = null;
    const decMatch = ev.place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
    if(decMatch) gpsCoords = `${decMatch[1]},${decMatch[2]}`;
    if(!gpsCoords){
      const dmsMatch = ev.place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
      if(dmsMatch){
        let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
        let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
        if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
        if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
        gpsCoords = `${lat.toFixed(6)},${lng.toFixed(6)}`;
      }
    }
    if(!gpsCoords && !mapUrl){
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      for(const word of words){
        const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
        if(KNOWN_PLACES[clean]){ gpsCoords = KNOWN_PLACES[clean]; break; }
      }
    }
    const placeLabel = ev.place
      .replace(urlMatch ? urlMatch[0] : '', '')
      .replace(/\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[NSns][,\s]+\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[EWew]/, '')
      .replace(decMatch ? decMatch[0] : '', '')
      .trim() || 'Zobrazit místo';
    rows.push({label:'Místo', value: placeLabel, mapUrl, gpsCoords, isPlace: true});
  }

  // Popis
  const desc = stripHtml(r.description).replace(/https?:\/\/photos(?:\.app)?\.goo\.gl\/\S+/g,'').replace(/https?:\/\/photos\.google\.com\/\S+/g,'').trim();
  if(desc) rows.push({label:'Popis', value: desc});

  // Organizátor (zobrazí se na konci, pod komentáři)
  let organizerValue = null;
  let isDefaultOrganizer = false;
  if(r.organizer && r.organizer.displayName && r.organizer.displayName !== r.organizer.email){
    organizerValue = r.organizer.displayName;
  } else if(r.organizer){
    organizerValue = 'KoKrŠNeK v.t.s.';
    isDefaultOrganizer = true;
  }

  // Účastníci
  if(r.attendees && r.attendees.length){
    const names = r.attendees.map(a => a.displayName || a.email).join(', ');
    rows.push({label:'Účastníci', value: names});
  }

  // Status
  if(r.status && r.status !== 'confirmed') rows.push({label:'Stav', value: r.status});

  // Konferenční odkaz
  const confLink = r.hangoutLink || (r.conferenceData && r.conferenceData.entryPoints && r.conferenceData.entryPoints[0] && r.conferenceData.entryPoints[0].uri);
  
  const color = getEventColor(ev);
  const isFuture = ev.start > now;
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };

  backdrop.innerHTML = `
    <div class="ev-modal" id="evModal_${idx}">
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block;"></span>
        <div class="ev-modal-title" style="margin-bottom:0;">${ev.title}</div>
      </div>
      ${rows.map(r=> r.isPlace ? `
        <div class="ev-modal-label">${r.label}</div>
        <div class="ev-modal-value" style="margin-bottom:10px;">${r.value}</div>
        <a href="${r.mapUrl || (r.gpsCoords ? `https://www.google.com/maps/search/?api=1&query=${r.gpsCoords}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.value)}`)}" target="_blank" rel="noopener" style="display:block;border-radius:8px;overflow:hidden;margin-bottom:6px;border:1px solid rgba(77,191,106,0.3);">
          ${!r.mapUrl ? `<img
            src="https://maps.googleapis.com/maps/api/staticmap?center=${r.gpsCoords || encodeURIComponent(r.value)}&zoom=15&size=600x240&scale=2&markers=color:red%7C${r.gpsCoords || encodeURIComponent(r.value)}&key=${GOOGLE_MAPS_KEY}"
            style="width:100%;display:block;"
            loading="lazy"
            onerror="this.parentElement.style.display='none';"
          >` : `<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;"><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z'/><circle cx='12' cy='10' r='3'/></svg>Otevřít v Mapách</div>`}
        </a>
      ` : `
        <div class="ev-modal-label">${r.label}</div>
        <div class="ev-modal-value">${r.value}</div>
      `).join('')}
      ${ev.place ? `<div id="wx_${idx}" style="display:none;"><div class="ev-modal-label">Počasí</div><div class="ev-modal-value" id="wxVal_${idx}"></div></div>` : ''}
      ${ev.photoAlbum ? `
        <a class="album-tile" href="#" onclick="event.preventDefault();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">
          <div class="album-tile-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L3 19"/></svg>
          </div>
          <div class="album-tile-text">
            <div class="album-tile-title">Otevřít album</div>
            <div class="album-tile-sub">Fotky z této akce</div>
          </div>
          <div class="album-tile-arrow">→</div>
        </a>
      ` : ''}
      ${confLink ? `
        <div class="ev-modal-label">Online meeting</div>
        <a class="ev-modal-link" href="${confLink}" target="_blank" rel="noopener">Připojit se</a>
      ` : ''}
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button id="likeBtn_${idx}" onclick="toggleLike(${idx})" style="
          flex:1;background:var(--accent-soft);border:1px solid rgba(60,180,80,0.3);
          color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;
          padding:8px;border-radius:6px;cursor:pointer;">🤍 0</button>
        ${!isFuture ? `<button onclick="showPayment(window._payTitle_${idx})" style="
          flex:1;background:var(--accent-soft);border:1px solid rgba(60,180,80,0.3);
          color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
          padding:8px;border-radius:6px;cursor:pointer;">💸 Příspěvek</button>` : ''}
        <button id="shareEvBtn" onclick="shareEvent(rawEvents[${idx}])" style="
          flex:1;background:var(--accent-soft);border:1px solid rgba(77,191,106,0.3);
          color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
          padding:8px;border-radius:6px;cursor:pointer;">Sdílet</button>
        ${isFuture ? `<button onclick="exportICS(rawEvents[${idx}])" style="
          flex:1;background:var(--accent-soft);border:1px solid rgba(77,191,106,0.3);
          color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
          padding:8px;border-radius:6px;cursor:pointer;">Do kalendáře</button>` : ''}
      </div>
      <div style="margin-top:14px;">
        <div class="ev-modal-label" style="font-size:20px;">Komentáře</div>
        <div id="commentList_${idx}" style="max-height:180px;overflow-y:auto;margin:8px 0;font-family:'JetBrains Mono',monospace;">
          <div style="color:var(--muted);font-size:11px;text-align:center;padding:8px;">Načítám…</div>
        </div>
        <button onclick="openCommentEditor(${idx}, window['evKey_'+${idx}])" style="
          display:block;width:100%;
          background:var(--accent-soft);border:1px solid rgba(77,191,106,0.3);
          color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;
          padding:10px;border-radius:6px;cursor:pointer;text-align:left;">
          Napiš komentář…
        </button>
      </div>
      ${ev.driveFiles && ev.driveFiles.length ? `
        <div style="margin-top:14px;">
          ${ev.driveFiles.map(f => {
            const isPdf = f.mime === 'application/pdf' || f.title.toLowerCase().endsWith('.pdf');
            const icon = isPdf
              ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`
              : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
            return `<a class="ev-modal-link" href="#" onclick="event.preventDefault();checkAlbumAccess('${f.url.replace(/'/g,"\\'")}');" style="margin-bottom:6px;">${icon} ${f.title}</a>`;
          }).join('')}
        </div>
      ` : ''}
      ${organizerValue ? `
        <div style="margin-top:14px;">
          <div id="orgQuiz_${idx}" class="ev-modal-value" style="cursor:pointer;padding:10px 8px;margin:0 -8px;border-radius:8px;">${organizerValue}</div>
        </div>
      ` : ''}
    </div>
  `;
  document.body.appendChild(backdrop);
  window['evKey_'+idx] = getEventKey(ev);

  // Kvíz — klik na 'KoKrŠNeK v.t.s.'
  const orgEl = document.getElementById('orgQuiz_'+idx);
  if(orgEl){
    orgEl.addEventListener('click', () => {
      try{ startQuiz(); }
      catch(err){ console.error('Chyba při spouštění kvízu:', err); }
    });
  }

  // Načti počasí pro všechny události s místem
  if(ev.place){
    const dateStr = ev.start.toISOString().split('T')[0];
    const placeRow = rows.find(r => r.isPlace);
    const coords = placeRow?.gpsCoords || null;
    const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const startHour = isAllDay ? 9 : ev.start.getHours();
    fetchWeatherRange(ev.place, dateStr, coords, startHour, 22).then(wx => {
      const container = document.getElementById(`wx_${idx}`);
      const el = document.getElementById(`wxVal_${idx}`);
      if(wx && container && el){
        el.textContent = wx;
        container.style.display = 'block';
      }
    });
  }

  window['_payTitle_'+idx] = ev.title;

  // Načti lajky a komentáře z Firebase
  const fbKey = getEventKey(ev);

function renderTimeline(){
  app.innerHTML = "";

  if (rawEvents.length === 0){
    app.innerHTML = `<div class="slot"><div class="card" style="text-align:center;"><div class="title-row">Žádné události</div></div></div>`;
    return;
  }

  centerIndex = 0;
  for (let i=0;i<rawEvents.length;i++){
    if (rawEvents[i].end >= now){ centerIndex = i; break; }
    centerIndex = i;
  }

  const orderedIndices = [];
  for (let i = rawEvents.length - 1; i > centerIndex; i--) orderedIndices.push(i); // future, furthest first (top)
  orderedIndices.push(centerIndex); // now (center)
  for (let i = centerIndex - 1; i >= 0; i--) orderedIndices.push(i); // past, nearest-past first (just below now)

  // Roky zastoupené v událostech — globálně pro onclick
  window._yearsInTimeline = [...new Set(orderedIndices.map(i => rawEvents[i].start.getFullYear()))];
  let lastYear = null;

  orderedIndices.forEach((i) => {
    const ev = rawEvents[i];
    const isNow = i === centerIndex;
    const isPast = i < centerIndex;
    const kind = isNow ? "now" : (isPast ? "past" : "future");
    const evYear = ev.start.getFullYear();

    // Oddělovač roku
    if(evYear !== lastYear){
      const yd = document.createElement('div');
      yd.id = `yr_${evYear}`;
      yd.style.cssText = 'text-align:center;font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.15em;color:var(--muted);padding:10px 0 4px;cursor:pointer;user-select:none;';
      yd.textContent = `— ${evYear} —`;
      yd.onclick = () => openYearPicker(window._yearsInTimeline, evYear);
      app.appendChild(yd);
      lastYear = evYear;
    }

    const slot = document.createElement('div');
    slot.className = `slot ${kind}`;

    const color = getEventColor(ev);

    // Zjisti jestli událost probíhá právě teď nebo dnes
    const evStart = new Date(ev.start); evStart.setHours(0,0,0,0);
    const today = new Date(now); today.setHours(0,0,0,0);
    const isToday = evStart.getTime() === today.getTime() || (ev.start <= now && ev.end >= now);
    const isHappeningNow = ev.start <= now && ev.end >= now;

    let eyebrowText;
    if(isNow && isToday) eyebrowText = "Žhavíme";
    else if(isNow && !isToday) eyebrowText = "Nadcházející";
    else if(isPast) eyebrowText = "Skončilo";
    else eyebrowText = fmtRelativeFuture(ev.start);

    const countdownStyle = isNow
      ? `font-size:15.75px;color:#E53935;margin-left:6px;letter-spacing:0.04em;`
      : `font-size:10px;background:${color}22;color:${color};border-radius:100px;padding:2px 8px;margin-left:6px;letter-spacing:0.04em;`;
    // Pokud je Žhavíme (dnes), nezobrazujeme countdown
    const countdown = (!isPast && !(isNow && isToday)) ? `<span style="${countdownStyle}">${getDaysText(ev)}</span>` : '';

    slot.innerHTML = `
      <div class="card">
        ${isNow ? `<div onclick="openYearPicker(window._yearsInTimeline,${evYear})" style="font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.15em;color:var(--muted);text-align:center;margin-bottom:10px;cursor:pointer;user-select:none;">— ${evYear} —</div>` : ''}
        <div class="eyebrow">${isNow ? '' : `<span class="pip" style="background:${color};"></span>`}${eyebrowText}${countdown}</div>
        <div class="date-row">${fmtDateRange(ev)}</div>
        <div class="time-row">${fmtTimeRow(ev)}</div>
        <div class="title-row title-clickable" onclick="showEventDetail(${i})">${ev.title}</div>
        ${ev.place ? `<div class="place-row">${ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place}</div>` : ``}
        ${isNow && !isPast && ev.place ? `<div id="slotWx_${i}" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px;"></div>` : ''}
        ${isNow && isHappeningNow ? `<span class="badge">probíhá teď</span>` : ``}
        ${isPast && ev.photoAlbum ? `<a class="photo-link" href="#" onclick="event.preventDefault();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">${photoSVG()}Album fotek</a>` : ``}
      </div>
    `;
    slot.dataset.idx = i;
    app.appendChild(slot);

    // Počasí pro now slot
    if(isNow && !isPast && ev.place){
      const wxDateStr = ev.start.toISOString().split('T')[0];
      const wxCoords = (() => {
        const KNOWN_PLACES = {'bouda':'49.432694,16.622583','hastrman':'49.463861,16.496667','funibrouk':'49.446694,16.665611','sjíždění':'49.482333,16.608556','sjizdeni':'49.482333,16.608556'};
        const words = ev.place.trim().toLowerCase().split(/\s+/);
        for(const w of words){ const c=w.replace(/[^a-záčďéěíňóřšťůúýž]/g,''); if(KNOWN_PLACES[c]) return KNOWN_PLACES[c]; }
        return null;
      })();
      const isAllDayNow = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
      const startHourNow = isAllDayNow ? 9 : ev.start.getHours();
      fetchWeatherRange(ev.place, wxDateStr, wxCoords, startHourNow, 22).then(wx => {
        const el = document.getElementById('slotWx_'+i);
        if(el && wx) el.textContent = wx;
      });
    }
  });

  const nowSlot = document.querySelector('.slot.now');
  if (nowSlot) nowSlot.scrollIntoView({block:"center"});
}

const SEARCH_KNOWN_PLACES = {
  'bouda':     '49.432694,16.622583',
  'hastrman':  '49.463861,16.496667',
  'funibrouk': '49.446694,16.665611',
  'sjíždění':  '49.482333,16.608556',
  'sjizdeni':  '49.482333,16.608556',
};
function mapUrl(place){
  if(!place) return `https://www.google.com/maps/search/?api=1&query=`;
  // 1) přímý odkaz na Google Maps v textu místa
  const urlMatch = place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
  if(urlMatch) return urlMatch[0];
  // 2) desetinné GPS souřadnice v textu (např. "49.432694,16.622583")
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `https://www.google.com/maps/search/?api=1&query=${decMatch[1]},${decMatch[2]}`;
  // 3) souřadnice ve formátu stupně/minuty/vteřiny
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  // 4) známá pojmenovaná místa (bouda, hastrman, ...)
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return `https://www.google.com/maps/search/?api=1&query=${SEARCH_KNOWN_PLACES[clean]}`;
  }
  // 5) fallback — hledat podle textu místa
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
}
function calDayUrl(d){
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `https://calendar.google.com/calendar/u/0/r/day/${y}/${m}/${day}`;
}
function pinSVG(){
  return `<svg viewBox="0 0 24 24"><path d="M12 21s-7-7.2-7-12.2A7 7 0 0 1 19 8.8C19 13.8 12 21 12 21z"/><circle cx="12" cy="8.8" r="2.4"/></svg>`;
}

let _searchRenderToken = 0;

function renderResults(query){
  const myToken = ++_searchRenderToken;
  const q = query.trim().toLowerCase();
  searchResults.innerHTML = "";
  if (!q){ return; }
  const matches = rawEvents
    .map((ev, i) => ({ev, i}))
    .filter(({ev}) => ev.title.toLowerCase().includes(q) || (ev.place && ev.place.toLowerCase().includes(q)));

  if (matches.length === 0){
    searchResults.innerHTML = `<div class="no-results">Žádná událost neodpovídá hledání</div>`;
    return;
  }

  // Řazení jako hlavní timeline: chronologicky vzestupně, najdi "aktuální" (nejbližší k teď),
  // pak posklládej DOM tak, aby scrollem nahoru šly budoucí (nejvzdálenější nahoře) a scrollem
  // dolů minulé (nejstarší dole) — aktuální položka je po vykreslení zarovnaná nahoru výsledků.
  const curNow = new Date();
  const chrono = [...matches].sort((a,b) => a.ev.start - b.ev.start);
  let centerIndex = chrono.findIndex(({ev}) => ev.end >= curNow);
  if (centerIndex === -1) centerIndex = chrono.length - 1; // všechny nalezené jsou minulé → nejnovější z nich bude "aktuální"

  const ordered = [];
  for (let idx = chrono.length - 1; idx > centerIndex; idx--) ordered.push(chrono[idx]); // budoucí, nejvzdálenější první
  ordered.push(chrono[centerIndex]); // aktuální / nejbližší
  for (let idx = centerIndex - 1; idx >= 0; idx--) ordered.push(chrono[idx]); // minulé, nejnovější první

  let currentRow = null;
  ordered.forEach(({ev, i}, pos) => {
    const row = document.createElement('div');
    row.className = 'result-item';
    const isCurrent = pos === (chrono.length - 1 - centerIndex);
    if (isCurrent) row.style.cssText = 'border-color:rgba(77,191,106,0.7);background:rgba(77,191,106,0.08);';
    row.innerHTML = `
      <div class="result-main">
        ${isCurrent ? `<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;">aktuální</div>` : ``}
        <div class="result-title">${ev.title}</div>
        <div class="result-meta">${fmtDate(ev.start)} · ${fmtTime(ev.start, ev.end)}${ev.place ? ' · '+ev.place : ''}</div>
      </div>
      ${ev.place ? `<a class="map-pin" href="${mapUrl(ev.place)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${pinSVG()}</a>` : ``}
    `;
    row.addEventListener('click', () => {
      closeSearch();
      setTimeout(() => {
        const app = document.getElementById('app');
        const target = document.querySelector(`.slot[data-idx="${i}"]`);
        if(target && app){
          app.style.scrollSnapType = 'none';
          const offset = target.offsetTop - (app.clientHeight/2) + (target.offsetHeight/2);
          app.scrollTo({top: Math.max(0, offset), behavior:'smooth'});
          setTimeout(() => app.style.scrollSnapType = '', 800);
        }
      }, 50);
    });
    searchResults.appendChild(row);
    if (isCurrent) currentRow = row;
  });

  if (currentRow){
    requestAnimationFrame(() => {
      if (myToken !== _searchRenderToken) return; // mezitím proběhlo novější hledání, tohle je zastaralé
      currentRow.scrollIntoView({block: 'start', behavior: 'auto'});
    });
  }
}

// --- Notifikace 5 dní před událostí ---
// --- Upozornění na blížící se události (in-app banner) ---
function checkUpcomingNotifications(){
  const today = new Date();
  today.setHours(0,0,0,0);

  const upcoming = rawEvents.filter(ev => {
    const evDay = new Date(ev.start);
    evDay.setHours(0,0,0,0);
    const diffDays = Math.round((evDay - today) / 86400000);
    return diffDays > 0 && diffDays <= 5;
  });

  if (!upcoming.length) return;

  const todayStr = today.toISOString().slice(0,10);
  const lastShown = localStorage.getItem('notifShownDate');
  if (lastShown === todayStr) return;
  localStorage.setItem('notifShownDate', todayStr);

  upcoming.forEach((ev, idx) => {
    const evDay = new Date(ev.start);
    evDay.setHours(0,0,0,0);
    const diffDays = Math.round((evDay - today) / 86400000);
    const daysText = diffDays === 1 ? 'zítra' : `za ${diffDays} dní`;

    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop kokr-banner';
    backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };

    const evIdx = rawEvents.indexOf(ev);

    backdrop.innerHTML = `
      <div class="ev-modal">
        <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
        <div class="ev-modal-label" style="font-size:clamp(16px,5.5vw,26px);letter-spacing:0.06em;color:var(--accent);text-align:center;padding:4px 0;">Už se těšíš?</div>
        <div class="ev-modal-title">${ev.title}</div>
        <div class="ev-modal-label">Kdy</div>
        <div class="ev-modal-value">${fmtDateRange(ev)} · ${daysText}</div>
        ${ev.place ? `<div class="ev-modal-label">Místo</div><div class="ev-modal-value">${ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place}</div>` : ''}
        ${ev.place ? `<div id="notifWx_${evIdx}" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin-top:4px;"></div>` : ''}
        <div class="ev-modal-value" style="margin-top:16px;font-size:clamp(11px,3.5vw,18px);color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Kokršneci na tebe ano.</div>
        <button onclick="this.closest('.ev-modal-backdrop').remove()" style="
          display:block; width:100%; margin-top:16px;
          background:var(--accent); border:none;
          color:#000; font-family:'JetBrains Mono',monospace; font-size:13px;
          padding:10px; border-radius:6px; cursor:pointer; letter-spacing:0.05em; font-weight:700;
        ">OK</button>
      </div>
    `;
    document.body.appendChild(backdrop);
    setTimeout(() => { if(backdrop.parentElement) backdrop.remove(); }, 15000);

    // Načti počasí pro notifikaci
    if(ev.place){
      const wxDateStr = ev.start.toISOString().split('T')[0];
      const KNOWN_PLACES = {'bouda':'49.432694,16.622583','hastrman':'49.463861,16.496667','funibrouk':'49.446694,16.665611','sjíždění':'49.482333,16.608556','sjizdeni':'49.482333,16.608556'};
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      let wxCoords = null;
      for(const w of words){ const c=w.replace(/[^a-záčďéěíňóřšťůúýž]/g,''); if(KNOWN_PLACES[c]){ wxCoords=KNOWN_PLACES[c]; break; } }
      const isAllDayNotif = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
      const startHourNotif = isAllDayNotif ? 9 : ev.start.getHours();
      fetchWeatherRange(ev.place, wxDateStr, wxCoords, startHourNotif, 22).then(wx => {
        const el = document.getElementById('notifWx_'+evIdx);
        if(el && wx) el.textContent = wx;
      });
    }
  });

  // Pokus se také o systémovou notifikaci pokud je povolena
  if ('Notification' in window && Notification.permission === 'granted'){
    upcoming.forEach(ev => {
      const evDay = new Date(ev.start);
      evDay.setHours(0,0,0,0);
      const diffDays = Math.round((evDay - today) / 86400000);
      const daysText = diffDays === 1 ? 'zítra' : `za ${diffDays} dní`;
      new Notification(`Už se těšíš?`, {
        body: `${ev.title} — ${daysText} (${fmtDate(ev.start)})\n\nKokršneci na tebe ano.`,
        icon: 'icon-192v2.png',
      });
    });
  }
}







function showYearPicker(allYears, currentYear){
  const years = allYears.split(',');
  const existing = document.getElementById('yearPickerPopup');
  if(existing) existing.remove();

  const popup = document.createElement('div');
  popup.id = 'yearPickerPopup';
  popup.style.cssText = `
    position:fixed; z-index:200;
    left:50%; transform:translateX(-50%);
    top:50%;
    background:var(--card);
    border:1px solid rgba(60,180,80,0.4);
    border-radius:10px;
    padding:16px 20px;
    min-width:160px;
    transform:translate(-50%,-50%);
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  `;

  const title = document.createElement('div');
  title.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:0.1em;color:var(--muted);text-align:center;margin-bottom:12px;text-transform:uppercase;';
  title.textContent = 'Přejít na rok';
  popup.appendChild(title);

  years.forEach(year => {
    const btn = document.createElement('button');
    btn.textContent = year;
    btn.style.cssText = `
      display:block; width:100%; text-align:center;
      background:${year==currentYear?'rgba(60,180,80,0.15)':'transparent'};
      border:none; border-radius:6px;
      color:${year==currentYear?'var(--accent)':'var(--ink)'};
      font-family:'JetBrains Mono',monospace;
      font-size:18px; font-weight:700;
      padding:8px; cursor:pointer; margin-bottom:4px;
      letter-spacing:0.05em;
    `;
    btn.onclick = () => {
      popup.remove();
      const target = document.getElementById('albumYear_'+year);
      if(target){
        const modal = target.closest('.ev-modal');
        if(modal) modal.scrollTo({top: target.offsetTop - 10, behavior:'smooth'});
      }
    };
    popup.appendChild(btn);
  });

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '×';
  closeBtn.style.cssText = 'position:absolute;top:8px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;';
  closeBtn.onclick = () => popup.remove();
  popup.appendChild(closeBtn);

  document.body.appendChild(popup);

  // Zavřít kliknutím mimo
  setTimeout(() => {
    document.addEventListener('click', function close(e){
      if(!popup.contains(e.target)){ popup.remove(); document.removeEventListener('click',close); }
    });
  }, 100);
}

function showAlbums(){
  if(!calendarLoaded){
    // Kalendář ještě načítá — počkej a zkus znovu
    const loading = document.createElement('div');
    loading.style.cssText = 'position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);';
    loading.innerHTML = '<div style="font-family:JetBrains Mono,monospace;color:var(--accent);font-size:13px;">Načítám data…</div>';
    document.body.appendChild(loading);
    const wait = setInterval(() => {
      if(calendarLoaded){ clearInterval(wait); loading.remove(); _showAlbumsModal(); }
    }, 200);
    setTimeout(() => { clearInterval(wait); loading.remove(); _showAlbumsModal(); }, 8000);
    return;
  }
  _showAlbumsModal();
}

function _showAlbumsModal(){
  const curNow = new Date();
  const withAlbums = rawEvents
    .filter(ev => ev.photoAlbum && ev.end < curNow)
    .sort((a,b) => a.start - b.start); // nejstarší první celkově

  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };

  // Seskup podle roku, nejnovější rok nahoře, uvnitř roku chronologicky
  const byYear = {};
  withAlbums.forEach(ev => {
    const y = ev.start.getFullYear();
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(ev);
  });
  const years = Object.keys(byYear).map(Number).sort((a,b) => b-a);

  const allYears = years.join(',');

  let rows = '';
  if(withAlbums.length){
    years.forEach((year, yi) => {
      rows += `<div id="albumYear_${year}" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.15em;color:var(--accent);padding:14px 0 6px;${yi>0?'border-top:1px solid rgba(60,180,80,0.15);':''}cursor:pointer;user-select:none;" onclick="showYearPicker('${allYears}','${year}')">${year} ▾</div>`;
      byYear[year].forEach(ev => {
        rows += `
          <div class="album-item" onclick="this.closest('.ev-modal-backdrop').remove();checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">
            <div class="album-dot" style="background:${getEventColor(ev)};"></div>
            <div class="album-info">
              <div class="album-date">${fmtDate(ev.start)}</div>
              <div class="album-title">${ev.title}</div>
            </div>
            <div class="album-arrow">›</div>
          </div>`;
      });
    });
  } else {
    rows = `<div class="albums-empty">Zatím žádná fotoalba<br><small style="color:var(--muted);font-size:11px;">(${rawEvents.filter(e=>e.end<curNow).length} minulých událostí)</small></div>`;
  }

  backdrop.innerHTML = `
    <div class="ev-modal">
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;">Fotoalba z akcí</div>
      ${rows}
    </div>`;
  document.body.appendChild(backdrop);
}

function getUserName(){
  let name = localStorage.getItem('kokrsnekUser');
  if(!name){
    name = prompt('Jak se jmenuješ? (přezdívka v komentářích a lajkách)');
    if(!name || !name.trim()) return null;
    name = name.trim();
    localStorage.setItem('kokrsnekUser', name);
  }
  return name;
}

function getEventKey(ev){
  return (ev.raw && ev.raw.id) ? ev.raw.id : ev.title.replace(/[^a-zA-Z0-9]/g,'_') + '_' + ev.start.toISOString().slice(0,10);
}

async function czechIBAN(account, bank){
  const bban = bank.padStart(4,'0') + '000000' + account.padStart(10,'0');
  const numStr = bban + '1235' + '00';
  let rem = 0;
  for(const d of numStr) rem = (rem * 10 + parseInt(d)) % 97;
  return 'CZ' + String(98 - rem).padStart(2,'0') + bban;
}

async function showLikers(evIdx, key){
  const snap = await db.collection('events').doc(key).collection('likes').get();
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  const rows = snap.empty
    ? '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Zatím nikdo nelajkoval</div>'
    : [...snap.docs].sort((a,b) => {
        const ta = a.data().at; const tb = b.data().at;
        const da = ta ? (ta.toDate ? ta.toDate() : new Date(ta)) : new Date(0);
        const db2 = tb ? (tb.toDate ? tb.toDate() : new Date(tb)) : new Date(0);
        return db2 - da;
      }).map(d => {
        const data = d.data();
        const time = data.at
          ? (data.at.toDate ? data.at.toDate() : new Date(data.at)).toLocaleString('cs',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
          : '';
        return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(60,180,80,0.1);font-family:'JetBrains Mono',monospace;">
          <span style="font-size:13px;color:var(--accent);font-weight:700;">❤️ ${d.id}</span>
          <span style="font-size:11px;color:var(--muted);">${time}</span>
        </div>`;
      }).join('');
  backdrop.innerHTML = `
    <div class="ev-modal">
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:12px;">Kdo lajkoval</div>
      ${rows}
    </div>`;
  document.body.appendChild(backdrop);
}

async function toggleLike(evIdx){
  try{
    const ev = rawEvents[evIdx];
    const key = getEventKey(ev);
    const user = getUserName();
    if(!user) return;
    const ref = db.collection('events').doc(key).collection('likes').doc(user);
    const snap = await ref.get();
    if(snap.exists){ await ref.delete(); } else {
      await ref.set({user, at: new Date()});
      try{ sendNotification('like', user, rawEvents[evIdx]?.title || ''); }catch(emailErr){}
    }
    refreshLikes(evIdx, key);
  }catch(e){ console.error('like error',e); }
}

async function refreshLikes(evIdx, key){
  try{
    const snap = await db.collection('events').doc(key).collection('likes').get();
    const user = localStorage.getItem('kokrsnekUser');
    const liked = snap.docs.some(d => d.id === user);
    const btn = document.getElementById('likeBtn_'+evIdx);
    if(btn){ btn.textContent = (liked?'❤️':'🤍')+' '+snap.size; btn.style.color = liked?'#E53935':'var(--accent)'; }
  }catch(e){ console.error('likes error',e); }
}

      editor.remove();
      await refreshComments(evIdx, key);
      setTimeout(() => {
        const list = document.getElementById('commentList_'+evIdx);
        if(list) list.scrollTop = list.scrollHeight;
      }, 200);
    }catch(e){
      sendBtn.textContent = 'Odeslat';
      sendBtn.disabled = false;
      alert('Chyba: '+e.message);
    }
  });
}

async function postComment(evIdx, parentId){
  try{
    const ev = rawEvents[evIdx];
    const key = getEventKey(ev);
    const inputId = parentId ? 'replyInput_'+parentId : 'commentInput_'+evIdx;
    const input = document.getElementById(inputId);
    const text = (input&&input.value||'').trim();
    if(!text) return;
    const user = getUserName();
    if(!user) return;
    await db.collection('events').doc(key).collection('comments').add({
      user, text, at: new Date().toISOString(), parentId: parentId||null
    });
    input.value = '';
    const replyBox = document.getElementById('replyBox_'+parentId);
    if(replyBox) replyBox.style.display = 'none';
    refreshComments(evIdx, key);
  }catch(e){ console.error('comment error',e); alert('Chyba: '+e.message); }
}

async function deleteComment(evIdx, key, docId){
  const pwd = prompt('Zadej heslo pro smazání:');
  if(pwd !== '8006293768'){ alert('Špatné heslo'); return; }
  await db.collection('events').doc(key).collection('comments').doc(docId).delete();
  refreshComments(evIdx, key);
}

function toggleReply(parentId){
  const box = document.getElementById('replyBox_'+parentId);
  if(!box) return;
  box.style.display = box.style.display === 'none' ? 'flex' : 'none';
  if(box.style.display === 'flex') document.getElementById('replyInput_'+parentId)?.focus();
}

async function refreshComments(evIdx, key){
  const list = document.getElementById('commentList_'+evIdx);
  if(!list) return;
  try{
    const snap = await db.collection('events').doc(key).collection('comments').get();
    const docs = snap.docs.sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
    const renderComment = (d, depth) => {
      const data = d.data();
      const time = data.at ? new Date(data.at).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'}) : '';
      const indent = Math.min(depth, 4) * 12;
      const childReplies = docs.filter(r => r.data().parentId === d.id)
        .sort((a,b) => (a.data().at||'') < (b.data().at||'') ? -1 : 1);
      return `<div style="padding:6px 0 2px;${depth > 0 ? `margin-left:${indent}px;border-left:2px solid rgba(60,180,80,0.3);padding-left:8px;` : 'border-bottom:1px solid rgba(60,180,80,0.1);'}">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-size:11px;font-weight:700;color:var(--accent);">${data.user}</span>
          <span style="font-size:11px;color:var(--muted);">${time}</span>
          <button onclick="openCommentEditor(${evIdx},window['evKey_'+${evIdx}],'${d.id}')" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;font-family:'JetBrains Mono',monospace;">↩ odpovědět</button>
          <button onclick="deleteComment(${evIdx},'${key}','${d.id}')" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;margin-left:auto;">🗑</button>
        </div>
        <div style="font-size:13px;color:var(--ink);margin-top:2px;">${data.text}</div>
        ${childReplies.map(r => renderComment(r, depth + 1)).join('')}
      </div>`;
    };

    const roots = docs.filter(d => !d.data().parentId);

    list.innerHTML = roots.length === 0
      ? '<div style="color:var(--muted);font-size:11px;text-align:center;padding:8px;">Zatím žádné komentáře</div>'
      : roots.map(d => renderComment(d, 0)).join('');
  }catch(e){
    const list2 = document.getElementById('commentList_'+evIdx);
    if(list2) list2.innerHTML = '<div style="color:#E53935;font-size:11px;text-align:center;padding:8px;">'+e.message+'</div>';
  }
}

function pickQuizQuestion(){
  const qs = window.QUIZ_QUESTIONS;
  const st = window.quizState;
  if(st.usedIndices.length >= qs.length) st.usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random()*qs.length); } while(st.usedIndices.includes(idx));
  st.usedIndices.push(idx);
  return qs[idx];
}

function nextQuizQuestion(){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  st.token = (st.token || 0) + 1;
  const myToken = st.token;
  const question = pickQuizQuestion();
  st.timeLeft = 10;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const order = [0,1,2].sort(() => Math.random()-0.5);
  content.innerHTML = `
    <div style="font-size:11px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">Série: ${st.streak}</div>
    <div id="quizTimer" style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--accent);margin-bottom:10px;">10</div>
    <div class="ev-modal-title" style="margin-bottom:16px;">${question.q}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${order.map(i => `<button onclick="answerQuiz(${i === question.correct})" style="
        background:var(--accent-soft);border:1px solid rgba(60,180,80,0.3);
        color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;
        padding:12px;border-radius:8px;cursor:pointer;">${question.a[i]}</button>`).join('')}
    </div>
  `;
  const timerEl = document.getElementById('quizTimer');
  let myIntervalId;
  myIntervalId = setInterval(() => {
    if(window.quizState !== st || st.token !== myToken){ clearInterval(myIntervalId); return; } // osiřelý/zastaralý časovač — ignoruj a nezasahuj do aktuální hry
    st.timeLeft--;
    if(timerEl) timerEl.textContent = st.timeLeft;
    if(st.timeLeft <= 3 && timerEl) timerEl.style.color = '#E53935';
    if(st.timeLeft <= 0){
      clearInterval(myIntervalId);
      answerQuiz(false, 'vypršel čas');
    }
  }, 1000);
  st.timerInterval = myIntervalId;
}

function answerQuiz(isCorrect, reason){
  const st = window.quizState;
  clearInterval(st.timerInterval);
  if(isCorrect){
    st.streak++;
    nextQuizQuestion();
  } else {
    endQuiz(reason || 'špatná odpověď (klik)');
  }
}

function endQuiz(reason){
  const st = window.quizState;
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  const savedName = localStorage.getItem('kokrsnekUser') || '';
  const streakWord = st.streak===1 ? 'otázku' : (st.streak>=2 && st.streak<=4 ? 'otázky' : 'otázek');
  content.innerHTML = `
    <div class="ev-modal-title" style="margin-bottom:6px;">Konec!</div>
    <div class="ev-modal-label" style="margin-bottom:16px;font-size:14px;text-transform:none;letter-spacing:0;">Uhodl jsi <span style="color:var(--accent);font-weight:700;">${st.streak}</span> ${streakWord} v řadě</div>
    <input id="quizNameInput" type="text" placeholder="Tvoje jméno…" value="${savedName}" style="
      width:100%; box-sizing:border-box;
      background:#0B0B0B; border:1px solid rgba(60,180,80,0.4);
      color:var(--ink); font-family:'JetBrains Mono',monospace;
      font-size:16px; padding:10px 12px; border-radius:4px; outline:none; margin-bottom:12px;
    ">
    <button onclick="submitQuizScore()" style="
      display:block;width:100%;
      background:var(--accent);border:none;color:#000;
      font-family:'JetBrains Mono',monospace;font-size:13px;
      padding:10px;border-radius:6px;cursor:pointer;font-weight:700;
    ">Uložit a zobrazit žebříček</button>
  `;
  setTimeout(() => document.getElementById('quizNameInput')?.focus(), 100);
}

async function submitQuizScore(){
  const st = window.quizState;
  const input = document.getElementById('quizNameInput');
  const name = (input?.value || '').trim();
  if(!name){ input?.focus(); return; }
  localStorage.setItem('kokrsnekUser', name);
  try{
    const ref = db.collection('quizScores').doc(name);
    const snap = await ref.get();
    const prevBest = snap.exists ? (snap.data().score || 0) : -1;
    if(st.streak > prevBest){
      await ref.set({ name, score: st.streak, at: new Date().toISOString() });
    }
  }catch(e){}
  showQuizLeaderboard();
}

async function showQuizLeaderboard(){
  const content = document.getElementById('quizModalContent');
  if(!content) return;
  content.innerHTML = `<div class="ev-modal-title" style="margin-bottom:12px;">🏆 Žebříček</div><div style="color:var(--muted);font-size:12px;">Načítám…</div>`;
  try{
    const snap = await db.collection('quizScores').get();
    const rows = snap.docs.map(d => d.data()).sort((a,b) => (b.score||0) - (a.score||0));
    content.innerHTML = `
      <div class="ev-modal-title" style="margin-bottom:12px;">🏆 Žebříček</div>
      <div style="text-align:left;max-height:300px;overflow-y:auto;">
        ${rows.length === 0 ? `<div style="color:var(--muted);font-size:12px;text-align:center;">Zatím nikdo nehrál</div>` : rows.map((r,i) => `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(60,180,80,0.15);">
            <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);width:24px;">${i+1}.</span>
            <span style="flex:1;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);">${r.name}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);">${r.score}</span>
          </div>
        `).join('')}
      </div>
      <button onclick="document.getElementById('quizBackdrop')?.remove()" style="
        display:block;width:100%;margin-top:16px;
        background:var(--accent-soft);border:1px solid rgba(60,180,80,0.3);color:var(--ink);
        font-family:'JetBrains Mono',monospace;font-size:13px;
        padding:10px;border-radius:6px;cursor:pointer;">Zavřít</button>
    `;
  }catch(e){
    content.innerHTML = `<div style="color:#E53935;font-size:12px;text-align:center;">${e.message}</div>`;
  }
}
