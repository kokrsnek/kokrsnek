<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KoKrŠNeK">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192v2.png">
<title>KoKrŠNeK</title>
<script>
  if(localStorage.getItem('kokrsnekTheme') === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#1C1B20;
    --bg2:#232128;
    --card:#26242C;
    --line:var(--surface);
    --ink:#F3F0EC;
    --muted:#9E97AC;
    --accent:#3E8F68;
    --accent-soft:rgba(62,143,104,0.16);
    --amber:#E8A23D;
    --amber-soft:rgba(232,162,61,0.16);
    --coral:#E2664F;
    --coral-soft:rgba(226,102,79,0.14);
    --past:#8A8496;
    --past-soft:#211F26;
    --past-blue-soft:rgba(90,140,220,0.30);
    --coral-tint:rgba(226,102,79,0.30);
    --link:#5BC28C;
    --shadow-sm:0 2px 10px rgba(0,0,0,0.25);
    --shadow-md:0 10px 30px rgba(0,0,0,0.35);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --surface:rgba(255,255,255,0.06);
    --surface-strong:rgba(255,255,255,0.14);
    --nav-bg:rgba(60,57,68,0.88);
    --nav-border:rgba(255,255,255,0.14);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#F6F4EF;
    --bg2:#FFFFFF;
    --card:#FFFFFF;
    --line:rgba(20,18,14,0.09);
    --ink:#242229;
    --muted:#837E8A;
    --accent:#2F7A56;
    --accent-soft:rgba(47,122,86,0.12);
    --amber:#C7852A;
    --amber-soft:rgba(199,133,42,0.14);
    --coral:#C24B34;
    --coral-soft:rgba(194,75,52,0.12);
    --past:#6B6675;
    --past-soft:#EDEBE6;
    --past-blue-soft:rgba(62,111,196,0.20);
    --coral-tint:rgba(194,75,52,0.18);
    --link:#227A50;
    --shadow-sm:0 2px 10px rgba(20,18,14,0.07);
    --shadow-md:0 10px 30px rgba(20,18,14,0.12);
    --surface:rgba(20,18,14,0.045);
    --surface-strong:rgba(20,18,14,0.09);
    --nav-bg:rgba(255,255,255,0.92);
    --nav-border:rgba(20,18,14,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background-color:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overscroll-behavior-y: none;
  }
  .app{
    height:100vh;
    width:100%;
    overflow-y:auto;
    position:relative;
    padding-bottom:135px;
    scroll-padding-bottom:135px;
    box-sizing:border-box;
    -webkit-overflow-scrolling:touch;
  }
  .search-btn{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:18px;
    top:auto;
    z-index:20;
    width:46px; height:46px;
    border-radius:15px;
    background:none;
    border:none;
    isolation:isolate;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    pointer-events:auto;
    transition:transform .15s ease;
  }
  /* POZOR: žádné backdrop-filter na tomhle prvku! Na iPhone Air (a možná dalších
     nových zařízeních) v PWA/standalone režimu (appka přidaná na plochu) Safari
     backdrop-filter renderuje chybně a rozmazává i ikonu uvnitř tlačítka —
     v běžném Safari prohlížeči na stejném zařízení je to v pořádku, takže jde
     jednoznačně o chybu ve standalone renderovací cestě. Jediné spolehlivé
     řešení je použít místo živého rozostření jen barevné poloprůhledné pozadí. */
  .search-btn::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:var(--nav-bg);
    border:1px solid var(--nav-border);
    box-shadow:var(--shadow-sm);
    z-index:0;
  }
  .search-btn:active{ transform:scale(0.92); }
  #gearBtn{
    right:64px;
  }
  #gearBtn.connected::before{
    border-color:rgba(62,143,104,0.9);
    background:rgba(62,143,104,0.2);
  }
  #notifBtn.connected::before{
    border-color:rgba(62,143,104,0.9);
    background:rgba(62,143,104,0.2);
  }
  #feedbackBtn::before{
    border-color:var(--coral);
    background:var(--coral-soft);
  }
  .search-btn svg{
    position:relative;
    z-index:1;
    width:19px; height:19px;
    fill:var(--ink);
  }
  #feedbackBtn svg{
    fill:var(--coral);
  }
  #feedbackBtn, #feedbackBtn svg{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  .search-overlay{
    position:fixed;
    top:0; left:0; right:0;
    height:50dvh; min-height:220px;
    z-index:40;
    background:var(--bg2);
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,12px) 16px 12px;
    box-sizing:border-box;
    box-shadow:var(--shadow-md);
    transform:translateY(-100%);
    transition:transform .25s ease;
    border-radius:0 0 24px 24px;
  }
  .search-overlay.open{ transform:translateY(0); }

  .config-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(20,19,24,0.97);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    transform:translateY(-100%);
    transition:transform .15s ease;
  }
  .config-overlay.open{ transform:translateY(0); }
  .config-title{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:18px;
  }
  .config-label{
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
  }
  .config-input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    outline:none;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .config-input:focus{ border-color:var(--accent); }
  .config-status{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--muted);
    margin:8px 0 14px;
    min-height:18px;
  }
  .config-status.ok{ color:var(--accent); }
  .config-status.err{ color:var(--coral); }
  .config-btns{
    display:flex; gap:10px; margin-top:4px;
  }

  .search-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .search-row input[type="text"]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    padding:12px 16px;
    border-radius:100px;
    outline:none;
  }
  .search-row input[type="text"]:focus{ border-color:var(--accent); }
  .search-row input[type="text"]::placeholder{ color:var(--muted); }
  .search-close{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--surface);
    border:none;
    color:var(--ink);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }

  .date-row-search{
    display:flex; align-items:center; gap:10px;
    margin-bottom:18px;
  }
  .date-row-search input[type="date"]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    outline:none;
    color-scheme:dark;
  }
  .cal-btn{
    flex-shrink:0;
    background:var(--accent);
    color:#12261C;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:10px 14px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
  }

  .search-results{
    flex:1;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-bottom:24px;
  }
  .result-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    cursor:pointer;
  }
  .result-item:active{ background:var(--surface); }
  .result-main{ flex:1; min-width:0; }
  .result-title{
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-meta{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .map-pin{
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--accent-soft);
    border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .map-pin svg{ width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2; }
  .no-results{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
    margin-top:24px;
  }

  .bottomPanelBg{
    position:fixed;
    left:0; right:0; bottom:0;
    height:calc(env(safe-area-inset-bottom, 0px) + 132px);
    background:linear-gradient(to bottom, transparent, var(--bg) 28px, var(--bg) 100%);
    z-index:4;
    pointer-events:none;
  }
  .topbar{
    position:fixed;
    top:auto !important;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 62px); left:0; right:0;
    padding:8px 16px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:5;
    pointer-events:none;
  }
  .topbar .label{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:clamp(17px, 5.8vw, 30px);
    letter-spacing:-0.01em;
    color:var(--ink);
    width:100%;
    max-width:100%;
    text-align:center;
    white-space:nowrap;
  }
  .miniInfoBlock{
    position:fixed;
    left:128px; right:128px;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
    height:46px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0px;
    z-index:5;
    pointer-events:none;
    overflow:hidden;
  }
  .miniInfoBlock span{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    line-height:1.35;
    color:var(--muted);
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .slot{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:0 26px;
    margin-bottom:26px;
    box-sizing:border-box;
    scroll-margin-bottom:260px;
    scroll-margin-top:60px;
  }

  .dot{
    position:absolute;
    left:50%; top:50%;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    transform:translate(-50%,-50%);
    z-index:1;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:380px;
    transition:opacity .25s ease, transform .25s ease;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 22px 20px;
    box-shadow:var(--shadow-sm);
    text-align:center;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .month-sticky{
    position:sticky;
    top:0;
    z-index:5;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    padding:8px 0;
    background:var(--bg);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .eyebrow .pip{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--muted);
    display:inline-block;
  }

  .date-row{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    line-height:1.15;
    margin:0 0 2px;
  }
  .time-row{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
    letter-spacing:0.02em;
  }
  .title-row{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.015em;
    margin:0 0 6px;
    line-height:1.2;
    color:var(--ink);
  }
  .place-row{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .place-row::before, .place-row::after{ content:none; }

  /* --- NOW (center, dominant) --- */
  .slot.now .card{
    background:linear-gradient(165deg, var(--accent-soft), var(--card) 55%);
    border:1px solid rgba(62,143,104,0.4);
    border-radius:var(--radius-lg);
    padding:24px 22px 20px;
    position:relative;
    box-shadow:0 0 0 1px rgba(62,143,104,0.15), 0 16px 40px rgba(0,0,0,0.4);
  }
  .slot.now .eyebrow{ color:var(--coral); font-size:13px; font-weight:700; }
  .slot.now .eyebrow .pip{ background:var(--coral); box-shadow:0 0 0 4px var(--coral-soft); }
  .slot.now .date-row{ font-size:23px; }
  .slot.now .title-row{
    font-size:29px;
    font-weight:800;
    color:var(--ink);
  }
  .slot.now .badge{
    display:inline-block;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.01em;
    color:#12261C;
    background:var(--accent);
    padding:5px 14px;
    border-radius:100px;
    box-shadow:0 4px 14px rgba(62,143,104,0.4);
  }

  /* --- FUTURE (above now) --- */
  .slot.future .card{
    background:linear-gradient(165deg, var(--coral-tint), var(--card) 70%);
    opacity:0.92;
  }
  .slot.future .date-row{ font-size:19px; }
  .slot.future .title-row{ font-size:24px; font-weight:750; color:var(--ink); }
  .slot.future .eyebrow{ color:var(--accent); }
  .slot.future .eyebrow .pip{ background:var(--accent); }

  /* --- PAST (below now, with photo link) --- */
  .slot.past .card{
    background:linear-gradient(165deg, var(--past-blue-soft), var(--card) 70%);
    opacity:0.85;
  }
  .slot.past .date-row{ font-size:19px; }
  .slot.past .title-row{ font-size:24px; font-weight:750; color:var(--ink); }
  .slot.past .eyebrow{ color:var(--past); }
  .slot.past .eyebrow .pip{ background:var(--past); }

  .photo-link{
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--ink);
    background:var(--accent-soft);
    border:1px solid rgba(62,143,104,0.3);
    padding:8px 16px;
    border-radius:100px;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
  }
  .photo-link:active{ transform:scale(0.96); background:rgba(62,143,104,0.28); }
  .photo-link svg{ width:14px; height:14px; flex-shrink:0; }

  .sheet-grabber-down, .sheet-grabber-up{
    touch-action:none;
  }
  .ev-modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.62);
    display:flex; align-items:flex-end; justify-content:center;
    padding:0;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes recPulse{ 0%,100%{opacity:1} 50%{opacity:0.25} }
  @keyframes sheetUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .ev-modal{
    background:var(--bg2);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:28px 28px 0 0;
    width:100%; max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    padding:14px 22px calc(24px + env(safe-area-inset-bottom, 0px));
    position:relative;
    animation: sheetUp .3s cubic-bezier(0.32,0.72,0,1);
    text-align:center;
    box-shadow:0 -12px 40px rgba(0,0,0,0.4);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .ev-modal input, .ev-modal textarea{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  .ev-modal-close{
    display:none;
  }
  .ev-modal-label{
    font-family:'Inter', sans-serif;
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin-bottom:4px; margin-top:16px;
  }
  .ev-modal-label:first-child{ margin-top:0; }
  .ev-modal-value{
    font-family:'Inter', sans-serif;
    font-size:15px; font-weight:500; color:var(--ink); line-height:1.5;
    word-break:break-word;
  }
  .ev-modal-title{
    font-family:'Inter', sans-serif;
    font-size:22px; font-weight:800; color:var(--ink);
    letter-spacing:-0.01em;
    margin-bottom:16px; line-height:1.25; padding-right:0;
  }
  .ev-modal-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink); font-size:13px; font-weight:600;
    font-family:'Inter', sans-serif;
    text-decoration:none;
    background:var(--accent-soft);
    border:1px solid rgba(62,143,104,0.3);
    padding:6px 14px; border-radius:100px; margin-top:4px;
  }
  .album-tile{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; box-sizing:border-box;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md); padding:14px 16px; margin-top:4px;
    color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .album-tile-icon{
    flex-shrink:0; width:40px; height:40px; border-radius:var(--radius-sm);
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .album-tile-icon svg{ width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:2; }
  .album-tile-text{ text-align:center; }
  .album-tile-title{
    font-family:'Inter', sans-serif; font-size:14.5px; font-weight:700; color:var(--ink);
  }
  .album-tile-sub{
    font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); margin-top:2px;
  }
  .album-tile-arrow{ flex-shrink:0; color:var(--muted); font-size:18px; }
  .title-clickable{
    cursor:pointer; border-bottom:1px dashed rgba(62,143,104,0.4);
    transition:border-color .15s;
    -webkit-tap-highlight-color: rgba(62,143,104,0.2);
    touch-action: manipulation;
  }
  .title-clickable:hover{ border-color:var(--accent); }

  /* --- ALBUMS OVERLAY --- */
  .albums-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    pointer-events:none;
  }
  .albums-overlay.open{
    transform:translateX(0);
    pointer-events:auto;
  }
  .albums-topbar{

// BRÁNA S HESLEM PARTY — appka se nedá vůbec používat bez správného hesla.
// Anonymně se přihlásí do Firebase Auth a teprve po ověření hesla (přes Cloud
// Function verifyPartyPassword) dostane identita "razítko" (custom claim
// partyMember), které vyžadují i pravidla Firestore databáze — takže i kdyby
// někdo znal celou appku a její kód, bez hesla se ke komentářům, lajkům,

(function partyGate(){
  const gate = document.createElement('div');
  gate.id = 'partyGate';
  gate.style.cssText = 'position:fixed;inset:0;z-index:100000;background:var(--bg,#F6F4EF);display:flex;align-items:center;justify-content:center;padding:24px;';
  gate.innerHTML = `
    <div style="width:100%;max-width:340px;text-align:center;">
      <div style="font-family:'Inter', sans-serif;font-weight:800;font-size:20px;color:var(--ink,#242229);margin-bottom:8px;">🔒 KoKrŠNeK</div>
      <div id="partyGateMsg" style="font-family:'Inter', sans-serif;font-size:13.5px;color:var(--muted,#837E8A);margin-bottom:16px;">Ověřuji přístup…</div>
      <div id="partyGateForm" style="display:none;">
        <input id="partyGatePwd" type="password" placeholder="Heslo party" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line,#ddd);background:var(--surface,#fff);color:var(--ink,#242229);font-family:'Inter', sans-serif;font-size:16px;outline:none;margin-bottom:10px;">
        <button id="partyGateBtn" style="display:block;width:100%;background:var(--accent,#2F7A56);border:none;color:#fff;font-family:'Inter', sans-serif;font-size:14px;padding:12px;border-radius:12px;cursor:pointer;font-weight:700;">Vstoupit</button>
        <div id="partyGateError" style="color:#C24B34;font-family:'Inter', sans-serif;font-size:12.5px;margin-top:10px;min-height:16px;"></div>
      </div>
    </div>`;
  document.body.appendChild(gate);

  const msgEl = () => document.getElementById('partyGateMsg');
  const formEl = () => document.getElementById('partyGateForm');
  const errEl = () => document.getElementById('partyGateError');

  function showForm(error){
    msgEl().style.display = 'none';
    formEl().style.display = 'block';
    if(error) errEl().textContent = error;
    const input = document.getElementById('partyGatePwd');
    const btn = document.getElementById('partyGateBtn');
    const submit = async () => {
      const pwd = input.value.trim();
      if(!pwd) return;
      btn.disabled = true; btn.textContent = 'Ověřuji…';
      try{
        const verify = partyFunctions.httpsCallable('verifyPartyPassword');
        await verify({ password: pwd });
        await auth.currentUser.getIdToken(true); // vynutí nové razítko do tokenu
        location.reload();
      }catch(e){
        console.error('Chyba při ověřování hesla:', e);
        errEl().textContent = 'Špatné heslo, zkus to znovu.';
        btn.disabled = false; btn.textContent = 'Vstoupit';
      }
    };
    btn.onclick = submit;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    setTimeout(() => input.focus(), 150);
  }

  auth.onAuthStateChanged(async (user) => {
    try{
      if(!user){
        await auth.signInAnonymously();
        return; // onAuthStateChanged se zavolá znovu, jakmile bude user k dispozici
      }
      const result = await user.getIdTokenResult();
      if(result.claims && result.claims.partyMember){
        gate.remove();
      } else {
        showForm();
      }
    }catch(e){
      console.error('Chyba brány party:', e);
      showForm('Něco se pokazilo, zkus to prosím znovu.');
    }
  });
})();

const MONTHS = ["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
const MONTHS_NOM = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
const DAYS = ["ne","po","út","st","čt","pá","so"];

function fmtDate(d){
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFull(d){
  return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(d, end){
  const t = (x)=> x.getHours().toString().padStart(2,'0')+":"+x.getMinutes().toString().padStart(2,'0');
  return end ? `${t(d)} – ${t(end)}` : t(d);
}

function isMultiDay(ev){
  const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
  const startDay = new Date(ev.start.getFullYear(), ev.start.getMonth(), ev.start.getDate());
  const endDay   = new Date(ev.end.getFullYear(),   ev.end.getMonth(),   ev.end.getDate());
  const diff = endDay - startDay;
  // Celodenní akce má od Googlu konec (end.date) posunutý o den dopředu
  // (exkluzivní konec) — i jednodenní celodenní akce tak "trvá" technicky
  // 1 den navíc. Bez týhle korekce by appka takovou akci mylně vyhodnotila
  // jako vícedenní (datum "5. – 5. pro" místo jen "5. pro").
  if(isAllDay) return diff >= 2 * 86400000;
  return diff >= 86400000;
}

function fmtDateRange(ev){
  if(!isMultiDay(ev)) return fmtDate(ev.start);
  const endDisplay = new Date(ev.end.getTime() - 1);
  if(ev.start.getMonth() === endDisplay.getMonth() && ev.start.getFullYear() === endDisplay.getFullYear())
    return `${ev.start.getDate()}. – ${endDisplay.getDate()}. ${MONTHS[endDisplay.getMonth()]} ${endDisplay.getFullYear()}`;
  return `${fmtDate(ev.start)} – ${fmtDate(endDisplay)}`;
}

// Datum pro kartu v timeline: u jednodenní akce (celodenní i časové) se
// před datum přidá zkratka dne v týdnu, ať je hned na první pohled vidět,
// jestli akce vychází na všední den nebo víkend. Vícedenní akce zůstávají
// beze dne v týdnu, jako doteď.
function fmtDateRangeCard(ev){
  if(!isMultiDay(ev)) return `${DAYS[ev.start.getDay()]} ${fmtDate(ev.start)}`;
  return fmtDateRange(ev);
}

function fmtTimeRow(ev){
  // Celodenní akce (bez konkrétního času) nemá smysl zdvojovat datem ve
  // spodním řádku — nahoře (date-row/fmtDateRange) už je vidět. Tenhle
  // řádek má smysl jen u akcí se skutečným časem (nebo vícedenních
  // s časem), kde ukazuje buď hodiny, nebo rozsah dnů se dny v týdnu.
  const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
  if(isAllDay) return '';
  if(isMultiDay(ev)){
    const endDisplay = new Date(ev.end.getTime() - 1);
    return `${fmtFull(ev.start)} – ${fmtFull(endDisplay)}`;
  }
  return fmtTime(ev.start, ev.end);
}

function getDaysText(ev){
  const today = new Date(); today.setHours(0,0,0,0);
  const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
  const diff = Math.round((evDay - today) / 86400000);
  if(diff === 0) return 'dnes';
  if(diff === 1) return 'zítra';
  if(diff === -1) return 'včera';
  if(diff > 0) return `za ${diff} dní`;
  return `před ${Math.abs(diff)} dny`;
}

function getPlaceCoords(place){
  if(!place) return null;
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `${decMatch[1]},${decMatch[2]}`;
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return SEARCH_KNOWN_PLACES[clean];
  }
  return null;
}

  const isPast = ev.end < now;
  const NL = '\r\n'; // CRLF — Gmail appka na iOS občas slučuje samotné \n, s \r\n je zalomení spolehlivější
  const intro = `KoKrŠNeci tě zvou na…`;
  const introFull = `KoKrŠNeci tě zvou na ${ev.title}`;
  const dateWithDay = isMultiDay(ev) ? fmtDateRange(ev) : `${fmtFull(ev.start)} od ${fmtTime(ev.start)}`;

  let wxLine = '';
  if(ev.place){
    const isAllDay = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const wx = await fetchWeatherAtTime(ev.place, ev.start, getPlaceCoords(ev.place), isAllDay);
    if(wx) wxLine = wx;
  }

  let textBase, shareUrl;

  if(isPast){
    // Minulé události — popis + mapa místa + případné fotky/soubory
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    if(ev.photoAlbum) extras.push(`📸 Album fotek: ${ev.photoAlbum}`);
    if(ev.driveFiles && ev.driveFiles.length) ev.driveFiles.forEach(f => extras.push(`📄 ${f.title}: ${f.url}`));
    textBase = `${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = undefined;
  } else {
    // Budoucí události — přidej odkaz na Google Calendar a mapu místa
    const link = r.htmlLink || '';
    const extras = [];
    if(ev.place) extras.push(`📍 Mapa: ${mapUrl(ev.place)}`);
    textBase = `${intro}${NL}${NL}${ev.title}${NL}${NL}${dateWithDay}${wxLine ? NL+NL+wxLine : ''}${ev.place ? NL+NL+ev.place : ''}${extras.length ? NL+NL+extras.join(NL+NL) : ''}`;
    shareUrl = link || undefined;
  }

  const notifyShare = () => { try{ sendNotification('share', localStorage.getItem('kokrsnekUser'), ev.title); }catch(emailErr){} };

  if(navigator.share){
    try{
      await navigator.share({ title: introFull, text: textBase, url: shareUrl });
      notifyShare();
      return;
    }catch(e){}
  }
  await navigator.clipboard.writeText(textBase + (shareUrl && !textBase.includes(shareUrl) ? NL+NL+shareUrl : ''));
  notifyShare();
  const btn = document.getElementById('shareEvBtn');
  if(btn){
    const original = btn.innerHTML;
    btn.textContent = '✓ Zkopírováno';
    setTimeout(()=>{ btn.innerHTML = original; },2000);
  }
}

// EXPORT DO KALENDÁŘE (.ics)
// =====================================================
function exportICS(ev){
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    `DTSTART:${fmt(ev.start)}`,
    `DTEND:${fmt(ev.end)}`,
    `SUMMARY:${ev.title}`,
    ev.place ? `LOCATION:${ev.place}` : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click();
  try{ sendNotification('calendar', localStorage.getItem('kokrsnekUser'), ev.title); }catch(emailErr){}
}

function checkAnniversaries(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  if(localStorage.getItem('annivShownDate') === todayStr) return;

  const thisYear = today.getFullYear();
  const annivs = rawEvents.filter(ev => {
    const evDay = new Date(ev.start); evDay.setHours(0,0,0,0);
    const years = thisYear - evDay.getFullYear();
    return years > 0 &&
      evDay.getMonth() === today.getMonth() &&
      evDay.getDate() === today.getDate();
  });
  if(!annivs.length) return;

  localStorage.setItem('annivShownDate', todayStr);

  annivs.forEach(ev => {
    const years = thisYear - new Date(ev.start).getFullYear();
    const backdrop = document.createElement('div');
    backdrop.className = 'ev-modal-backdrop';

        <div class="ev-modal-value" style="color:var(--muted);">${fmtDate(ev.start)}</div>

// =====================================================
function checkWeatherEffect(){
  if(!navigator.geolocation) return;
  const perm = localStorage.getItem('kokrsnekLocationWeatherPermission');
  if(perm === 'denied') return;

  const runWithCoords = (lat, lon) => {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
      .then(r => r.json())
      .then(data => {
        const code = data.current_weather && data.current_weather.weathercode;
        if(code === undefined || code === null) return;

        // WMO kódy počasí — rozlišení síly srážek
        const RAIN_LIGHT = [51, 56, 61, 66, 80];
        const RAIN_MODERATE = [53, 63, 81];
        const RAIN_HEAVY = [55, 57, 65, 67, 82];
        const SNOW_LIGHT = [71, 77, 85];
        const SNOW_MODERATE = [73];
        const SNOW_HEAVY = [75, 86];

        if(RAIN_LIGHT.includes(code)) startWeatherEffect('rain', 'light');
        else if(RAIN_MODERATE.includes(code)) startWeatherEffect('rain', 'moderate');
        else if(RAIN_HEAVY.includes(code)) startWeatherEffect('rain', 'heavy');
        else if(SNOW_LIGHT.includes(code)) startWeatherEffect('snow', 'light');
        else if(SNOW_MODERATE.includes(code)) startWeatherEffect('snow', 'moderate');
        else if(SNOW_HEAVY.includes(code)) startWeatherEffect('snow', 'heavy');
      })
      .catch(e => console.error('Chyba při zjišťování počasí pro efekt:', e));
  };

  if(perm === 'granted'){
    navigator.geolocation.getCurrentPosition(
      pos => runWithCoords(pos.coords.latitude, pos.coords.longitude),
      err => console.warn('Poloha nedostupná:', err),
      { maximumAge: 30 * 60 * 1000 }
    );
    return;
  }

  // Poprvé — appka se zeptá; výsledek (povoleno/zamítnuto) si zapamatuje a příště se už neptá
  navigator.geolocation.getCurrentPosition(
    pos => {
      localStorage.setItem('kokrsnekLocationWeatherPermission', 'granted');
      runWithCoords(pos.coords.latitude, pos.coords.longitude);
    },
    err => {
      localStorage.setItem('kokrsnekLocationWeatherPermission', 'denied');
    }
  );
}

      const left = Math.random() * 100;

        position:absolute; top:-20px; left:${left}%;

      `;
      piece.innerHTML = `<div style="width:100%;height:100%;transform:rotate(${windDir * windAngleDeg}deg);background:linear-gradient(to bottom, transparent, rgba(80,150,255,0.95));"></div>`;

// =====================================================
// POČASÍ (Open-Meteo, bez API klíče)
// =====================================================
async function fetchWeather(place, dateStr, coords){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    // Zjisti jestli jde o minulé nebo budoucí datum
    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.daily) return null;
    const code = wxData.daily.weathercode[0];
    const max = Math.round(wxData.daily.temperature_2m_max[0]);
    const min = Math.round(wxData.daily.temperature_2m_min[0]);
    const rain = wxData.daily.precipitation_sum[0];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

// Nominatim (geokódování místa na souřadnice) dovoluje max. 1 dotaz za sekundu.
// Když appka najednou vykresluje víc karet bez známých souřadnic, dotazy
// seřadí do fronty místo aby je poslala najednou a riskovala zablokování.
let _geocodeQueue = Promise.resolve();
function queuedGeocode(place){
  const run = _geocodeQueue.then(async () => {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
      {headers:{'User-Agent':'KoKrSNeK-PWA'}});
    await new Promise(r => setTimeout(r, 1100));
    if(!res.ok){ console.error('Počasí: geokódování selhalo, status', res.status); return []; }
    return res.json();
  });
  _geocodeQueue = run.catch(() => []);
  return run;
}

async function fetchWeatherRange(place, dateStr, coords, hourStart, hourEnd){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geoData = await queuedGeocode(place);
      if(!geoData.length){ console.error('Počasí: geokódování nenašlo místo:', place); return null; }
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    if(!wx.ok){ console.error('Počasí: API selhalo, status', wx.status, apiBase); return null; }
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time){ console.error('Počasí: API nevrátilo hodinová data pro', dateStr, wxData); return null; }

    // Vyber jen hodiny v zadaném rozmezí (výchozí 9:00–22:00)
    const temps = [], rains = [], codes = [];
    wxData.hourly.time.forEach((t, i) => {
      const h = parseInt(t.slice(11,13));
      if(h >= hourStart && h <= hourEnd){
        temps.push(wxData.hourly.temperature_2m[i]);
        rains.push(wxData.hourly.precipitation[i]);
        codes.push(wxData.hourly.weathercode[i]);
      }
    });
    if(!temps.length) return null;

    const min = Math.round(Math.min(...temps));
    const max = Math.round(Math.max(...temps));
    const rain = rains.reduce((a,b) => a+b, 0);
    const code = Math.max(...codes); // nejhorší kód počasí v rámci okna = nejvýstižnější ikona
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    return `${icon} ${min}–${max}°C${rain>0?' · '+rain.toFixed(1)+'mm':''}${suffix}`;
  }catch(e){ console.error('Počasí: neočekávaná chyba', e); return null; }
}

async function fetchWeatherAtTime(place, dateObj, coords, isAllDay){
  try{
    let lat, lon;
    if(coords){
      [lat, lon] = coords.split(',');
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`,
        {headers:{'User-Agent':'KoKrSNeK-PWA'}});
      const geoData = await geo.json();
      if(!geoData.length) return null;
      lat = geoData[0].lat; lon = geoData[0].lon;
    }

    const dateStr = dateObj.toISOString().split('T')[0];
    const hour = isAllDay ? 9 : dateObj.getHours();

    const today = new Date(); today.setHours(0,0,0,0);
    const evDate = new Date(dateStr + 'T00:00:00');
    const isPastDate = evDate < today;

    const apiBase = isPastDate
      ? `https://archive-api.open-meteo.com/v1/archive`
      : `https://api.open-meteo.com/v1/forecast`;

    const wx = await fetch(`${apiBase}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
    const wxData = await wx.json();
    if(!wxData.hourly || !wxData.hourly.time) return null;

    const targetTime = `${dateStr}T${hour.toString().padStart(2,'0')}:00`;
    let idx = wxData.hourly.time.indexOf(targetTime);
    if(idx === -1) idx = 0;

    const temp = Math.round(wxData.hourly.temperature_2m[idx]);
    const rain = wxData.hourly.precipitation[idx];
    const code = wxData.hourly.weathercode[idx];
    const icon = code<=1?'☀️':code<=3?'⛅':code<=48?'🌫':code<=67?'🌧':code<=77?'❄️':code<=82?'🌦':'⛈';
    const suffix = isPastDate ? ' (bylo)' : '';
    const timeLabel = `${hour.toString().padStart(2,'0')}:00`;
    return `${icon} ${temp}°C v ${timeLabel}${rain>0?' · '+rain+'mm':''}${suffix}`;
  }catch(e){ return null; }
}

function showEventDetail(idx){
  const ev = rawEvents[idx];
  if(!ev) return;
  const r = ev.raw || {};

  // Označ, že si uživatel právě prohlédl tuto událost (pro odznak nových komentářů/lajků na kartě)
  localStorage.setItem('kokrsnekSeen_' + getEventKey(ev), new Date().toISOString());

  const rows = [];

  // Datum a čas
  // Jednodenní celodenní akce (bez konkrétního času od Googlu) nemá smysl
  // zobrazovat s "00:00 – 00:00" — u těch ukážeme jen datum, stejně jako
  // to řeší fmtTimeRow jinde v appce. U jednodenních akcí (celodenních i
  // časových) navíc před datum přidáme den v týdnu — stejně jako na kartě
  // v timeline (fmtDateRangeCard).
  const isAllDayDetail = !!(r.start && r.start.date && !r.start.dateTime);
  const dateVal = (isMultiDay(ev) || isAllDayDetail)
    ? fmtDateRangeCard(ev)
    : `${fmtDateRangeCard(ev)}  ·  ${fmtTime(ev.start, ev.end)}`;
  rows.push({label:'Datum a čas', value: dateVal});

  if(ev.place){
    // Zjisti jestli místo obsahuje URL na mapy
    const KNOWN_PLACES = {
      'bouda':     '49.432694,16.622583',
      'hastrman':  '49.463861,16.496667',
      'funibrouk': '49.446694,16.665611',
      'sjíždění':  '49.482333,16.608556',
      'sjizdeni':  '49.482333,16.608556',
    };
    const urlMatch = ev.place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
    const mapUrl = urlMatch ? urlMatch[0] : null;
    let gpsCoords = null;
    const decMatch = ev.place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
    if(decMatch) gpsCoords = `${decMatch[1]},${decMatch[2]}`;
    if(!gpsCoords){
      const dmsMatch = ev.place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
      if(dmsMatch){
        let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
        let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
        if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
        if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
        gpsCoords = `${lat.toFixed(6)},${lng.toFixed(6)}`;
      }
    }
    if(!gpsCoords && !mapUrl){
      const words = ev.place.trim().toLowerCase().split(/\s+/);
      for(const word of words){
        const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
        if(KNOWN_PLACES[clean]){ gpsCoords = KNOWN_PLACES[clean]; break; }
      }
    }
    let placeLabel = ev.place
      .replace(urlMatch ? urlMatch[0] : '', '')
      .replace(/\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[NSns][,\s]+\d+[°\s]+\d+['\s]+\d+\.?\d*["″\s]*[EWew]/, '')
      .replace(decMatch ? decMatch[0] : '', '')

function compressImageToBase64(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Pojistka nad compressImageToBase64 pro fotky, co jdou jako base64 přímo do
// Firestore dokumentu zprávy (1000px/55% je jen jeden pokus, bez záruky —
// hodně detailní/členité fotky z něj občas vylezou větší). Firestore má
// tvrdý strop 1 MB na CELÝ dokument, ne jen na obrázek, takže si necháváme
// rezervu na ostatní pole (from/text/at/reactions…) i na to, že base64 zápis
// je o cca třetinu větší než skutečná binární velikost dat, která zabírá.
// Když ani nejmenší pokus nestačí, pošle se aspoň ten — furt lepší než nic.
async function compressImageSafely(file, maxChars){
  maxChars = maxChars || 700 * 1024;
  const attempts = [[1000, 0.55], [800, 0.45], [640, 0.35], [480, 0.3], [360, 0.25]];
  let result = null;
  for(const [dim, quality] of attempts){
    result = await compressImageToBase64(file, dim, quality);
    if(result.length <= maxChars) return result;
  }
  return result;
}

      return;
    }catch(e){
      // uživatel sdílení zrušil nebo selhalo — spadneme na mailto níž
      if(e && e.name === 'AbortError') return;
    }
  }

  // Fallback: prostý mailto text bez přílohy (mailto přílohy nepodporuje)
  const subject = encodeURIComponent('KoKrŠNeK – zpráva od uživatele');
  const body = encodeURIComponent(msg + (file ? '\n\n(Screenshot se bohužel nepodařilo přiložit — zkus ho poslat ručně jako přílohu k tomuto emailu.)' : ''));
  window.location.href = 'mailto:kokrsnek@gmail.com?subject=' + subject + '&body=' + body;
  btn.closest('.ev-modal-backdrop').remove();
}

function openYearPicker(years, currentYear){
  document.getElementById('yearPickerPopup')?.remove();
  const popup = document.createElement('div');
  popup.id = 'yearPickerPopup';
  popup.style.cssText = `position:fixed;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 20px;min-width:150px;max-height:70vh;overflow-y:auto;
    box-shadow:var(--shadow-md);`;

  const title = document.createElement('div');
  title.style.cssText = 'font-family:Inter,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.02em;color:var(--muted);text-align:center;margin-bottom:10px;';
  title.textContent = 'Přejít na rok';
  popup.appendChild(title);

  const allYears = [];
  for(let y=2036; y>=2010; y--) allYears.push(y);
  const yearsSet = new Set(years);

  allYears.forEach(y => {
    const hasEvents = yearsSet.has(y);
    const btn = document.createElement('button');
    btn.textContent = y;
    btn.id = `ypBtn_${y}`;
    btn.style.cssText = `display:block;width:100%;text-align:center;
      background:${y===currentYear?'var(--accent-soft)':'transparent'};
      border:none;border-radius:var(--radius-sm);
      color:${y===currentYear?'var(--accent)':hasEvents?'var(--ink)':'var(--muted)'};
      font-family:Inter,sans-serif;
      font-size:${hasEvents?'17px':'13px'};
      font-weight:${hasEvents?'700':'500'};
      opacity:${hasEvents?'1':'0.4'};
      padding:${hasEvents?'8px':'4px'};
      cursor:${hasEvents?'pointer':'default'};
      margin-bottom:2px;`;
    if(hasEvents) btn.onclick = () => {
      popup.remove();
      const appEl = document.getElementById('app');
      // Najdi všechny sloty daného roku a vyber chronologicky nejstarší (January)
      const allSlots = Array.from(appEl.querySelectorAll('.slot[data-idx]'));
      const yearSlots = allSlots.filter(s => {
        const idx = parseInt(s.dataset.idx);
        return !isNaN(idx) && rawEvents[idx]?.start.getFullYear() === y;
      });
      if(!yearSlots.length) return;
      // Seřaď chronologicky a vyber první (nejstarší v roce)
      yearSlots.sort((a,b) => {
        const ia = parseInt(a.dataset.idx), ib = parseInt(b.dataset.idx);
        return rawEvents[ia].start - rawEvents[ib].start;
      });
      const target = yearSlots[0];
      target.scrollIntoView({block:'start'});
    };
    popup.appendChild(btn);
  });

  // Vycentruj aktuální rok v pickeru
  setTimeout(() => {
    const activeBtn = document.getElementById(`ypBtn_${currentYear}`);
    if(activeBtn) activeBtn.scrollIntoView({block:'center', behavior:'instant'});
  }, 0);

  const x = document.createElement('button');
  x.textContent='×';
  x.style.cssText='position:absolute;top:8px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;';
  x.onclick=()=>popup.remove();
  popup.appendChild(x);
  document.body.appendChild(popup);

  setTimeout(()=>{
    document.addEventListener('click', function c(e){ if(!popup.contains(e.target)){popup.remove();document.removeEventListener('click',c);} });
  },100);
}

async function fetchCardStats(ev, uid, row, evIdx){
  if(!row) row = document.getElementById('statsRow_'+uid);
  if(!row) return;
  if(evIdx === undefined) evIdx = uid;
  try{
    const key = getEventKey(ev);
    const [commentsSnap, likesSnap, attendSnap, declineSnap] = await Promise.all([
      db.collection('events').doc(key).collection('comments').get(),
      db.collection('events').doc(key).collection('likes').get(),
      db.collection('events').doc(key).collection('attendees').get(),
      db.collection('events').doc(key).collection('declines').get()
    ]);
    const lastSeenRaw = localStorage.getItem('kokrsnekSeen_' + key);
    const lastSeen = lastSeenRaw ? new Date(lastSeenRaw) : null;

    const commentCount = commentsSnap.size;
    const likeCount = likesSnap.size;
    const attendCount = attendSnap.size;
    const declineCount = declineSnap.size;

    const newestOf = (snap) => snap.docs.reduce((max, d) => {
      const at = d.data().at;
      const t = at ? new Date(at) : null;
      return (t && (!max || t > max)) ? t : max;
    }, null);

    const newestComment = newestOf(commentsSnap);
    const newestLike = newestOf(likesSnap);
    const newestAttend = newestOf(attendSnap);
    const newestDecline = newestOf(declineSnap);

    const commentsNew = commentCount > 0 && (!lastSeen || (newestComment && newestComment > lastSeen));
    const likesNew = likeCount > 0 && (!lastSeen || (newestLike && newestLike > lastSeen));
    const attendNew = attendCount > 0 && (!lastSeen || (newestAttend && newestAttend > lastSeen));
    const declineNew = declineCount > 0 && (!lastSeen || (newestDecline && newestDecline > lastSeen));

    const mutedColor = 'var(--muted)';
    const commentColor = commentsNew ? 'var(--accent)' : mutedColor;
    const likeColor = likesNew ? '#E2664F' : mutedColor;
    const attendColor = attendNew ? 'var(--accent)' : mutedColor;
    const declineColor = declineNew ? '#E2664F' : mutedColor;

    // Malé avatary prvních pár lidí, co mají Jdu — ať je hned na kartě vidět,
    // kdo se chystá, bez rozklikávání detailu. Emoji avatar (viz getAvatarCached)
    // se cachuje, ať appka nedělá zbytečné dotazy na Firestore pro každou kartu.
    const avatarNames = attendSnap.docs.map(d => d.id).slice(0, 5);
    const avatarEmojis = avatarNames.length ? await Promise.all(avatarNames.map(n => getAvatarCached(n))) : [];
    const avatarsHtml = avatarNames.length ? `
      <span onclick="event.stopPropagation();openQuickAttend(${evIdx})" style="display:flex;align-items:center;cursor:pointer;">
        ${avatarEmojis.map((a,i) => `<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1.5px solid var(--card);font-size:11px;margin-left:${i===0?'0':'-6px'};">${a || '👤'}</span>`).join('')}
      </span>` : '';

    row.innerHTML = `
      <span onclick="event.stopPropagation();openQuickComments(${evIdx})" style="display:flex;align-items:center;gap:4px;color:${commentColor};font-family:'Inter', sans-serif;font-size:11px;cursor:pointer;">${commentIconSVG()}${commentCount}</span>
      <span onclick="event.stopPropagation();openQuickLikes(${evIdx})" style="display:flex;align-items:center;gap:4px;color:${likeColor};font-family:'Inter', sans-serif;font-size:11px;cursor:pointer;">${heartIconSVGSmall()}${likeCount}</span>
      ${avatarsHtml}
      <span onclick="event.stopPropagation();openQuickAttend(${evIdx})" style="display:flex;align-items:center;gap:4px;color:${attendColor};font-family:'Inter', sans-serif;font-size:11px;cursor:pointer;">👍${attendCount}</span>
      <span onclick="event.stopPropagation();openQuickAttend(${evIdx})" style="display:flex;align-items:center;gap:4px;color:${declineColor};font-family:'Inter', sans-serif;font-size:11px;cursor:pointer;">👎${declineCount}</span>
    `;
  }catch(e){
    console.error('Chyba při načítání statistik karty:', e);
  }
}

function personRow(d, icon){
  const data = d.data();
  const time = data.at
    ? (data.at.toDate ? data.at.toDate() : new Date(data.at)).toLocaleString('cs',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    : '';
  return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;">
    <span ${personLink(d.id)} style="font-size:14px;color:var(--ink);font-weight:600;${PERSON_LINK_STYLE}">${icon} ${d.id}</span>
    <span style="font-size:11.5px;color:var(--muted);">${time}</span>
  </div>`;
}
function sortByTimeDesc(docs){
  return [...docs].sort((a,b) => {
    const ta = a.data().at; const tb = b.data().at;
    const da = ta ? (ta.toDate ? ta.toDate() : new Date(ta)) : new Date(0);
    const db2 = tb ? (tb.toDate ? tb.toDate() : new Date(tb)) : new Date(0);
    return db2 - da;
  });
}

// Zabrání systémovému výběru textu / nabídce "Zkopírovat" při podržení prstu na tlačítku
// (iOS na emoji ignoruje CSS user-select:none), a přitom zachová normální krátký tap.
function blockCalloutTap(el, handler){
  if(!el) return;
  let moved = false, sx = 0, sy = 0;
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    moved = false;
    const t = e.touches && e.touches[0];
    sx = t ? t.clientX : 0; sy = t ? t.clientY : 0;
  }, {passive:false});
  el.addEventListener('touchmove', e => {
    const t = e.touches && e.touches[0];
    if(!t) return;
    if(Math.hypot(t.clientX - sx, t.clientY - sy) > 10) moved = true;
  }, {passive:true});
  el.addEventListener('touchend', e => {
    e.preventDefault();
    if(!moved) handler(e);
  });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function buildTimelineSlot(ev, i, isNow, isPast, uidSuffix){
  const uid = uidSuffix !== undefined ? uidSuffix : i;
  const kind = isNow ? "now" : (isPast ? "past" : "future");
  const evYear = ev.start.getFullYear();
  const color = getEventColor(ev);

  const evStart = new Date(ev.start); evStart.setHours(0,0,0,0);
  const today = new Date(now); today.setHours(0,0,0,0);
  const isToday = evStart.getTime() === today.getTime() || (ev.start <= now && ev.end >= now);
  const isHappeningNow = ev.start <= now && ev.end >= now;

  let eyebrowText;
  if(isNow && isToday) eyebrowText = "Žhavíme";
  else if(isNow && !isToday) eyebrowText = "Nadcházející";
  else if(isPast) eyebrowText = "Skončilo";
  else eyebrowText = fmtRelativeFuture(ev.start);

  const countdownStyle = isNow
    ? `font-size:15.75px;color:#E2664F;margin-left:6px;letter-spacing:0.04em;`
    : `font-size:10px;background:${color}22;color:${color};border-radius:100px;padding:2px 8px;margin-left:6px;letter-spacing:0.04em;`;
  const countdown = (!isPast && !(isNow && isToday)) ? `<span style="${countdownStyle}">${getDaysText(ev)}</span>` : '';

  const slot = document.createElement('div');
  slot.className = `slot ${kind}`;
  slot.innerHTML = `
    <div class="card" onclick="showEventDetail(${i})" style="cursor:pointer;">
      ${isNow ? `<div onclick="event.stopPropagation();openYearPicker(window._yearsInTimeline,${evYear})" style="font-family:'Inter', sans-serif;font-weight:700;font-size:15px;letter-spacing:0.03em;color:var(--muted);text-align:center;margin-bottom:10px;cursor:pointer;user-select:none;">— ${evYear} —</div>` : ''}
      <div class="eyebrow">${isNow ? '' : `<span class="pip" style="background:${color};"></span>`}${eyebrowText}${countdown}</div>
      <div class="date-row">${fmtDateRangeCard(ev)}</div>

      ${ev.place ? `<div class="place-row">${shortenPlace(ev.place.replace(/https?:\/\/[^\s]*/g,'').trim() || ev.place)}</div>` : ``}
      ${ev.place ? `<div id="slotWx_${uid}" style="font-family:'Inter', sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px;"></div>` : ''}
      ${isNow && isHappeningNow ? `<span class="badge">probíhá teď</span>` : ``}

      <div id="statsRow_${uid}" style="display:flex;justify-content:center;gap:16px;margin-top:8px;min-height:20px;"></div>
    </div>
  `;
  slot.dataset.idx = i;
  fetchCardStats(ev, uid, slot.querySelector('#statsRow_'+uid), i);

  if(ev.place){
    const wxDateStr = ev.start.toISOString().split('T')[0];
    const wxCoords = getPlaceCoords(ev.place);
    const isAllDayNow = !!(ev.raw && ev.raw.start && ev.raw.start.date && !ev.raw.start.dateTime);
    const startHourNow = isAllDayNow ? 9 : ev.start.getHours();
    // Malé rozprostření dotazů v čase, ať appka při prvním vykreslení timeline
    // nepošle na Open-Meteo/Nominatim desítky dotazů naráz (viz i seřazená fronta
    // pro geokódování v samotné fetchWeatherRange).
    setTimeout(() => {
      fetchWeatherRange(ev.place, wxDateStr, wxCoords, startHourNow, 22).then(wx => {
        const el = document.getElementById('slotWx_'+uid);
        if(el && wx) el.textContent = wx;
      });
    }, i * 180);
  }

  // Dlouhé podržení kdekoliv na kartě -> filtrovaná mini-timeline stejných opakujících se akcí
  setTimeout(() => {
    const cardEl = slot.querySelector('.card');
    if(!cardEl) return;
    let pressTimer, longPressed = false;
    let titleStartX = 0, titleStartY = 0;
    cardEl.style.webkitTouchCallout = 'none';
    cardEl.addEventListener('touchstart', (e) => {
      longPressed = false;
      const t = e.touches && e.touches[0];
      titleStartX = t ? t.clientX : 0;
      titleStartY = t ? t.clientY : 0;
      pressTimer = setTimeout(() => {
        longPressed = true;
        try{ openEventGroupTimeline(ev.title); }
        catch(err){ console.error('Chyba při otevírání filtrované timeline:', err); }
      }, 500);
    }, {passive:true});
    cardEl.addEventListener('touchend', e => {
      clearTimeout(pressTimer);
      if(longPressed) e.preventDefault();
    });
    cardEl.addEventListener('touchmove', (e) => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      const dx = t.clientX - titleStartX, dy = t.clientY - titleStartY;
      if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
    }, {passive:true});
    cardEl.addEventListener('contextmenu', e => e.preventDefault());
  }, 0);

  return slot;
}

function renderTimeline(instantScroll = true){
  app.innerHTML = "";

  if (rawEvents.length === 0){
    app.innerHTML = `<div class="slot"><div class="card" style="text-align:center;"><div class="title-row">Žádné události</div></div></div>`;
    return;
  }

  centerIndex = 0;
  const nowMs = now.getTime();
  for (let i=0;i<rawEvents.length;i++){
    if (rawEvents[i].end.getTime() >= nowMs){ centerIndex = i; break; }
    centerIndex = i;
  }
  if(rawEvents[centerIndex]){
    const daysOff = Math.round((rawEvents[centerIndex].start.getTime() - nowMs) / 86400000);
    if(daysOff > 60 || daysOff < -1){
      console.warn('[KoKrŠNeK] Podezřele vzdálená "aktuální" událost:', rawEvents[centerIndex].title, 'za', daysOff, 'dní od', now);
    }
  }

  const orderedIndices = [];
  for (let i = rawEvents.length - 1; i > centerIndex; i--) orderedIndices.push(i); // future, furthest first (top)
  orderedIndices.push(centerIndex); // now (center)
  for (let i = centerIndex - 1; i >= 0; i--) orderedIndices.push(i); // past, nearest-past first (just below now)

  // Roky zastoupené v událostech — globálně pro onclick
  window._yearsInTimeline = [...new Set(orderedIndices.map(i => rawEvents[i].start.getFullYear()))];
  let lastYear = null;
  let lastMonthKey = null;

  orderedIndices.forEach((i) => {
    const ev = rawEvents[i];
    const isNow = i === centerIndex;
    const isPast = i < centerIndex;
    const kind = isNow ? "now" : (isPast ? "past" : "future");
    const evYear = ev.start.getFullYear();

    // Oddělovač roku
    if(evYear !== lastYear){
      const yd = document.createElement('div');
      yd.id = `yr_${evYear}`;
      yd.style.cssText = 'text-align:center;font-family:\'JetBrains Mono\',monospace;color:var(--muted);padding:14px 0 8px;cursor:pointer;user-select:none;';
      if(lastYear !== null){
        yd.innerHTML = `
          <div style="font-size:18px;letter-spacing:0.15em;">${lastYear}</div>
          <div style="width:56px;height:1px;background:rgba(120,150,130,0.4);margin:6px auto;"></div>
          <div style="font-size:18px;letter-spacing:0.15em;">${evYear}</div>
        `;
      } else {
        yd.innerHTML = `<div style="font-size:18px;letter-spacing:0.15em;">— ${evYear} —</div>`;
      }
      yd.onclick = () => openYearPicker(window._yearsInTimeline, evYear);
      app.appendChild(yd);
      lastYear = evYear;
    }

    // Sticky nadpis měsíce — přilepí se nahoru, dokud ho nevystrčí další měsíc.
    // Pod ročním oddělovačem se taky ukáže, ať je hned na první pohled jasné,
    // v jakém měsíci daná skupina karet je.
    const evMonthKey = `${evYear}-${ev.start.getMonth()}`;
    if(evMonthKey !== lastMonthKey){
      const md = document.createElement('div');
      md.className = 'month-sticky';
      md.textContent = `${MONTHS_NOM[ev.start.getMonth()]} ${evYear}`;
      app.appendChild(md);
      lastMonthKey = evMonthKey;
    }

    const slot = buildTimelineSlot(ev, i, isNow, isPast);
    app.appendChild(slot);
  });

  const nowSlot = document.querySelector('.slot.now');
  if (nowSlot && instantScroll) nowSlot.scrollIntoView({block:"center"});
}

async function fetchGoogleCalendarEvents(instantScroll = true){
  // status removed
  try{
    let allItems = [];
    let pageToken = null;
    const timeMin = '2000-01-01T00:00:00Z'; // všechny události od roku 2000
    const timeMax = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(); // max. rok dopředu
    do {
      let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events`
        + `?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&maxResults=2500`
        + `&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`;
      if(pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(!res.ok){
        return;
      }
      const items = (data.items||[]).filter(it => it.start&&(it.start.dateTime||it.start.date));
      allItems = allItems.concat(items);
      pageToken = data.nextPageToken || null;
    } while(pageToken);

    if(!allItems.length){ return; }

    rawEvents = allItems.map(it => {
      const start = new Date(it.start.dateTime || it.start.date+'T00:00:00');
      let end = new Date((it.end&&(it.end.dateTime||it.end.date)) ? (it.end.dateTime||it.end.date+'T00:00:00') : start);
      // Pojistka: pokud se datum konce z nějakého důvodu nepodařilo rozparsovat (Invalid Date),
      // porovnání `end >= now` by pak bylo VŽDY false a appka by si spletla "aktuální" událost
      // s tou úplně poslední v celém kalendáři. Radši spadneme zpět na datum začátku.
      if(isNaN(end.getTime())) end = new Date(start);
      let photoAlbum = null;
      let driveFiles = [];
      if(it.attachments){
        const p = it.attachments.find(a => /photos\.google\.com|photos\.app\.goo\.gl/.test(a.fileUrl||''));
        if(p) photoAlbum = p.fileUrl;
        // Všechny přílohy z Google Drive
        driveFiles = it.attachments
          .filter(a => a.fileUrl && !(/photos\.google\.com|photos\.app\.goo\.gl/.test(a.fileUrl)))
          .map(a => ({
            url: a.fileUrl,
            title: a.title || 'Soubor',
            mime: a.mimeType || '',
            icon: a.iconLink || ''
          }));
      }
      if(!photoAlbum && it.description){
        const clean = it.description.replace(/<[^>]+>/g, ' ');
        const m = clean.match(/https?:\/\/photos(?:\.app)?\.goo\.gl\/[^\s"'<>]+|https?:\/\/photos\.google\.com\/[^\s"'<>]+/);
        if(m) photoAlbum = m[0].replace(/&amp;/g,'&');
      }
      const title = (it.summary||'(bez názvu)').trim();
      if(!photoAlbum){
        const key = Object.keys(PHOTO_ALBUMS).find(k => k.trim().toLowerCase() === title.toLowerCase());
        if(key) photoAlbum = PHOTO_ALBUMS[key];
      }
      const updated = it.updated ? new Date(it.updated) : null;
      return { start, end, title, place: it.location||'', photoAlbum, driveFiles, updated, raw: it };
    }).filter(ev => !isNaN(ev.start.getTime())).sort((a,b)=>a.start-b.start);

  }

function normalizeCz(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Sleduje čtyři věci a při první detekci zapíše doprovodný dokument do Firestore —
// Cloud Function na jeho vytvoření/změnu pošle odpovídající push notifikaci.
// Zápis je vždy idempotentní (.set() přepíše týž dokument), takže notifikace
// odejde jen jednou, i když to appka detekuje na víc zařízeních zároveň:
//   1) album fotek / příloha "seznam nákladů" — jen u NEDÁVNO upravených událostí
//   2) úplně nová událost v kalendáři — jen u NEDÁVNO vytvořených budoucích událostí
//   3) snapshot data/místa u KAŽDÉ budoucí události — slouží k detekci pozdější
//      změny (Cloud Function onEventSnapshotUpdated) a k připomenutí u akcí bez odezvy
async function syncEventNotifications(events){
  const RECENT_MS = 7 * 24 * 60 * 60 * 1000; // poslední týden
  const nowTs = Date.now();
  const nowDate = new Date();
  for(const ev of (events || [])){
    const key = getEventKey(ev);
    const eventStart = ev.start ? ev.start.toISOString() : '';

    if(ev.updated && (nowTs - ev.updated.getTime()) <= RECENT_MS){
      if(ev.photoAlbum){
        try{
          await db.collection('photoAlbums').doc(key).set({
            eventTitle: ev.title || '', eventStart, photoAlbum: ev.photoAlbum
          });
        }catch(e){ console.error('Chyba při zápisu photoAlbums:', e); }
      }

      const expenseFile = (ev.driveFiles || []).find(f => normalizeCz(f.title).includes('naklad'));
      if(expenseFile){
        try{
          await db.collection('expenseLists').doc(key).set({
            eventTitle: ev.title || '', eventStart, fileUrl: expenseFile.url, fileTitle: expenseFile.title || ''
          });
        }catch(e){ console.error('Chyba při zápisu expenseLists:', e); }
      }
    }

    if(ev.start > nowDate){
      const createdAt = ev.raw && ev.raw.created ? new Date(ev.raw.created) : null;
      if(createdAt && !isNaN(createdAt.getTime()) && (nowTs - createdAt.getTime()) <= RECENT_MS){
        try{
          await db.collection('newEventAlerts').doc(key).set({
            eventTitle: ev.title || '', eventStart, eventPlace: ev.place || ''
          });
        }catch(e){ console.error('Chyba při zápisu newEventAlerts:', e); }
      }

      try{
        await db.collection('eventSnapshots').doc(key).set({
          eventTitle: ev.title || '', eventStart, eventPlace: ev.place || ''
        });
      }catch(e){ console.error('Chyba při zápisu eventSnapshots:', e); }
    }
  }
}

const SEARCH_KNOWN_PLACES = {
  'bouda':     '49.432694,16.622583',
  'hastrman':  '49.463861,16.496667',
  'funibrouk': '49.446694,16.665611',
  'sjíždění':  '49.482333,16.608556',

function mapUrl(place){
  if(!place) return `https://www.google.com/maps/search/?api=1&query=`;
  // 1) přímý odkaz na Google Maps v textu místa
  const urlMatch = place.match(/https?:\/\/(?:maps\.app\.goo\.gl|maps\.google\.com|goo\.gl|www\.google\.com\/maps)[^\s]*/);
  if(urlMatch) return urlMatch[0];
  // 2) desetinné GPS souřadnice v textu (např. "49.432694,16.622583")
  const decMatch = place.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
  if(decMatch) return `https://www.google.com/maps/search/?api=1&query=${decMatch[1]},${decMatch[2]}`;
  // 3) souřadnice ve formátu stupně/minuty/vteřiny
  const dmsMatch = place.match(/(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)['\s]+(\d+\.?\d*)["″\s]*([EW])/i);
  if(dmsMatch){
    let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
    let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
    if(dmsMatch[4].toUpperCase()==='S') lat = -lat;
    if(dmsMatch[8].toUpperCase()==='W') lng = -lng;
    return `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(6)},${lng.toFixed(6)}`;
  }
  // 4) známá pojmenovaná místa (bouda, hastrman, ...)
  const words = place.trim().toLowerCase().split(/\s+/);
  for(const word of words){
    const clean = word.replace(/[^a-záčďéěíňóřšťůúýž]/g, '');
    if(SEARCH_KNOWN_PLACES[clean]) return `https://www.google.com/maps/search/?api=1&query=${SEARCH_KNOWN_PLACES[clean]}`;
  }
  // 5) fallback — hledat podle textu místa
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
}

    return;
  }

  // Řazení jako hlavní timeline: chronologicky vzestupně, najdi "aktuální" (nejbližší k teď),
  // pak posklládej DOM tak, aby scrollem nahoru šly budoucí (nejvzdálenější nahoře) a scrollem
  // dolů minulé (nejstarší dole) — aktuální položka je po vykreslení zarovnaná nahoru výsledků.
  const curNow = new Date();
  const chrono = [...matches].sort((a,b) => a.ev.start - b.ev.start);
  let centerIndex = chrono.findIndex(({ev}) => ev.end >= curNow);
  if (centerIndex === -1) centerIndex = chrono.length - 1; // všechny nalezené jsou minulé → nejnovější z nich bude "aktuální"

  const ordered = [];
  for (let idx = chrono.length - 1; idx > centerIndex; idx--) ordered.push(chrono[idx]); // budoucí, nejvzdálenější první
  ordered.push(chrono[centerIndex]); // aktuální / nejbližší
  for (let idx = centerIndex - 1; idx >= 0; idx--) ordered.push(chrono[idx]); // minulé, nejnovější první

  let currentRow = null;
  ordered.forEach(({ev, i}, pos) => {
    const row = document.createElement('div');
    row.className = 'result-item';
    const isCurrent = pos === (chrono.length - 1 - centerIndex);
    if (isCurrent) row.style.cssText = 'border-color:rgba(62,143,104,0.7);background:rgba(62,143,104,0.08);';
    row.innerHTML = `
      <div class="result-main">
        ${isCurrent ? `<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;">aktuální</div>` : ``}
        <div class="result-title">${ev.title}${ev.photoAlbum ? ` <span title="Má fotoalbum" style="display:inline-flex;vertical-align:middle;margin-left:4px;">${albumIconSVG()}</span>` : ``}</div>
        <div class="result-meta">${fmtDate(ev.start)} · ${fmtTime(ev.start, ev.end)}${ev.place ? ' · '+ev.place : ''}</div>
      </div>
      ${ev.place ? `<a class="map-pin" href="${mapUrl(ev.place)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${pinSVG()}</a>` : ``}
    `;
    row.addEventListener('click', () => {
      closeSearch();
      setTimeout(() => {
        const app = document.getElementById('app');
        const target = document.querySelector(`.slot[data-idx="${i}"]`);
        if(target && app){
          const offset = target.offsetTop - (app.clientHeight/2) + (target.offsetHeight/2);
          app.scrollTo({top: Math.max(0, offset)});
        }
      }, 50);
    });
    searchResults.appendChild(row);
    if (isCurrent) currentRow = row;
  });

  if (currentRow){
    requestAnimationFrame(() => {
      if (myToken !== _searchRenderToken) return; // mezitím proběhlo novější hledání, tohle je zastaralé
      currentRow.scrollIntoView({block: 'start', behavior: 'auto'});
    });
  }
}

async function toggleNotifications(){
  const user = getUserName();
  if(!user) return;
  const enabled = localStorage.getItem('pushEnabled') === '1';

  if(enabled){
    const token = localStorage.getItem('pushToken');
    if(token){
      try{ await db.collection('pushTokens').doc(token).delete(); }
      catch(e){ console.error('Chyba při rušení tokenu:', e); }
    }
    localStorage.removeItem('pushEnabled');
    localStorage.removeItem('pushToken');
    updateNotifBtnUI(false);
    return;
  }

  try{
    if(!messaging || !('Notification' in window)){
      alert('Tento prohlížeč nepodporuje push notifikace.');
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ updateNotifBtnUI(false); return; }
    if(!swRegistration) swRegistration = await navigator.serviceWorker.register('sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swRegistration });
    if(!token){ alert('Nepodařilo se získat token pro notifikace.'); return; }
    // Nejdřív ukliď staré tokeny stejného jména (typicky ze starších instalací appky),
    // ať se notifikace neposílají na zařízení, co už appku ani nemá — a nezdvojovaly se.
    try{
      const oldTokens = await db.collection('pushTokens').where('user', '==', user).get();
      const batch = db.batch();
      oldTokens.forEach(doc => { if(doc.id !== token) batch.delete(doc.ref); });
      await batch.commit();
    }catch(cleanupErr){ console.error('Chyba při úklidu starých tokenů:', cleanupErr); }
    await db.collection('pushTokens').doc(token).set({ user, token, at: new Date().toISOString() });
    localStorage.setItem('pushEnabled', '1');
    localStorage.setItem('pushToken', token);
    updateNotifBtnUI(true);
  }catch(e){
    console.error('Chyba při zapínání notifikací:', e);
    alert('Nepodařilo se zapnout notifikace. Zkus to prosím znovu.');
  }
}

// Jednou zapnutý FCM token se dosud nikdy sám neobnovoval. Chrome na Androidu
// ho ale v pozadí občas (po týdnech provozu, aktualizaci prohlížeče, vyčištění
// úložiště appky apod.) potichu zneplatní a vygeneruje nový, aniž by o tom
// appka věděla — uložený token ve Firestore pak zůstal starý a mrtvý, takže na
// tom konkrétním zařízení notifikace přestaly chodit, dokud si toho někdo
// nevšiml a ručně nevypnul/nezapnul zvoneček. Tohle to při každém otevření
// appky potichu samo ověří a v případě potřeby opraví, bez zásahu uživatele.
async function refreshPushTokenIfNeeded(){
  if(localStorage.getItem('pushEnabled') !== '1') return;
  const user = getUserName();
  if(!user || !messaging) return;
  try{
    if(Notification.permission !== 'granted') return;
    if(!swRegistration) swRegistration = await navigator.serviceWorker.register('sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swRegistration });
    if(!token) return;
    const storedToken = localStorage.getItem('pushToken');
    if(token === storedToken){
      // Beze změny tokenu se aspoň "osvěží" časové razítko záznamu, ať jde
      // v případě potřeby poznat, kdy appka naposledy potvrdila platnost.
      await db.collection('pushTokens').doc(token).set({ user, token, at: new Date().toISOString() }, { merge: true }).catch(()=>{});
      return;
    }
    // Token se mezitím změnil — smaž starý (mrtvý) záznam a ulož nový.
    if(storedToken){
      try{ await db.collection('pushTokens').doc(storedToken).delete(); }catch(e){}
    }
    await db.collection('pushTokens').doc(token).set({ user, token, at: new Date().toISOString() });
    localStorage.setItem('pushToken', token);
  }catch(e){ console.error('Chyba při obnově push tokenu:', e); }
}

// Spočítá nepřečtené zprávy napříč všemi vlákny, kde figuruje moje jméno
// (ID vlákna je "jméno1__jméno2" — viz chatThreadId()). "Přečteno" se řídí
// per-vláknovým timestampem v localStorage, nastaveným při zavření vlákna
// (viz openChatThread -> closeThread()).
async function updateChatBadge(){
  const badge = document.getElementById('chatBadge');
  if(!badge) return;
  const me = localStorage.getItem('kokrsnekUser');
  if(!me){ badge.style.display = 'none'; return; }
  try{
    const snap = await db.collectionGroup('messages').get();
    let count = 0;
    snap.forEach(d => {
      const threadId = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      if(!threadId) return;
      const participants = threadId.split('__');
      // Skupinové vlákno "Celá parta" nemá dvě jména oddělená "__" jako 1:1
      // vlákna, takže patří všem — u něj se kontrola účastníků přeskakuje.
      if(threadId !== PARTY_THREAD_ID && !participants.includes(me)) return;
      const data = d.data();
      if(data.from === me) return;
      const seenRaw = localStorage.getItem('kokrsnekChatSeen_' + threadId);
      const seen = seenRaw ? new Date(seenRaw) : new Date(0);
      const at = data.at ? new Date(data.at) : new Date(0);
      if(at > seen) count++;
    });
    if(count > 0){
      badge.textContent = count > 9 ? '9+' : String(count);
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  }catch(e){ console.error('Chyba při počítání nepřečtených zpráv:', e); }
}

function shortenPlace(place){
  if(!place) return place;
  const cutMatch = place.match(/\s\d|\bOkres\b|,/);
  if(cutMatch) return place.slice(0, cutMatch.index).trim() || place;
  return place;
}

function stripOrdinalPrefix(title){
  return title.replace(/^\d+\.\s*/, '').trim();
}

function normalizeGroupTitle(title){
  const stripped = stripOrdinalPrefix(title);
  return stripped.charAt(0).toUpperCase() + stripped.slice(1);
}

function openEventGroupTimeline(rawTitle){
  const key = normalizeGroupTitle(rawTitle);
  const matchIndices = [];
  rawEvents.forEach((ev, idx) => { if(normalizeGroupTitle(ev.title) === key) matchIndices.push(idx); });
  if(matchIndices.length === 0) return;

  // Najdi "teď" v rámci téhle podmnožiny (stejná logika jako hlavní timeline)
  let subCenter = matchIndices[0];
  for(const idx of matchIndices){
    if(rawEvents[idx].end >= now){ subCenter = idx; break; }
    subCenter = idx;
  }
  const centerPos = matchIndices.indexOf(subCenter);

  const ordered = [];
  for(let p = matchIndices.length - 1; p > centerPos; p--) ordered.push({idx: matchIndices[p], kind:'future'});
  ordered.push({idx: subCenter, kind:'now'});
  for(let p = centerPos - 1; p >= 0; p--) ordered.push({idx: matchIndices[p], kind:'past'});

  const overlay = document.createElement('div');
  overlay.id = 'eventGroupOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div class="app" id="eventGroupApp" style="flex:1;"></div>

      <div onclick="closeEventGroupTimeline()" style="width:44px;height:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>

    </div>
  `;
  document.body.appendChild(overlay);

  const groupApp = document.getElementById('eventGroupApp');
  const spacerTop = document.createElement('div');
  spacerTop.style.cssText = 'height:50vh;';
  groupApp.appendChild(spacerTop);
  ordered.forEach(({idx, kind}) => {

function renderAlbumsContent(mode){
  const content = document.getElementById('albumsContent');
  const modeBtn = document.getElementById('albumsModeBtn');
  if(!content) return;
  const withAlbums = window._albumsWithAlbums || [];
  const curNow = new Date();

      byYear[y].push(ev);
    });
    const years = Object.keys(byYear).map(Number).sort((a,b) => b-a);

    const byTitle = {};
    withAlbums.forEach(ev => {
      let key = normalizeGroupTitle(ev.title);
      if(!byTitle[key]) byTitle[key] = [];
      byTitle[key].push(ev);
    });

    const PRIORITY_ORDER = ["Rolf","Velkopáteční pochod","Pálení čarodějnic","Výroční oheň","Zakončení léta","Mikuláš u Hastrmana","Vánoční pochod","Silvestrovský výšlap"];

      if(ia !== -1) return -1;
      if(ib !== -1) return 1;
      // ostatní akce — chronologicky od nejnovější (dle posledního výskytu)
      const lastA = Math.max(...byTitle[a].map(ev => ev.start.getTime()));
      const lastB = Math.max(...byTitle[b].map(ev => ev.start.getTime()));
      return lastB - lastA;
    });

    let rows = '';
    if(titles.length){
