          ? `checkAlbumAccess('${list[0].photoAlbum.replace(/'/g,"\\'")}')`
          : `showAlbumInstances('${title.replace(/'/g,"\\'")}')`;
        const hasNew = window._newAlbumKeys && list.some(ev => window._newAlbumKeys.has(getEventKey(ev)));
        rows += `
          <div class="album-item" onclick="${clickAction}">
            <div class="album-info">
              <div class="album-title">${title}</div>
              ${list.length>1 ? `<div class="album-date">${list.length}× v historii</div>` : `<div class="album-date">${fmtDate(list[0].start)}</div>`}
            </div>
            <div class="album-badge-slot">${hasNew ? '<span class="album-new-tag">NOVÉ</span>' : ''}</div>
            <div class="album-arrow">›</div>
          </div>`;
      });
    } else {
      rows = `<div class="albums-empty">Zatím žádná fotoalba</div>`;
    }
    content.innerHTML = rows;
  }
}

function toggleAlbumsMode(){
  const modeBtn = document.getElementById('albumsModeBtn');
  const newMode = modeBtn.textContent.trim() === 'Dle akce' ? 'name' : 'date';
  renderAlbumsContent(newMode);
}

function showAlbumInstances(title){
  const withAlbums = window._albumsWithAlbums || [];
  const matches = withAlbums.filter(ev => normalizeGroupTitle(ev.title) === title).sort((a,b) => b.start - a.start); // nejnovější první

  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };

  const rows = matches.map(ev => {
    const isNew = window._newAlbumKeys && window._newAlbumKeys.has(getEventKey(ev));
    return `
    <div class="album-item" onclick="checkAlbumAccess('${ev.photoAlbum.replace(/'/g,"\\'")}')">
      <div class="album-info">
        <div class="album-date">${fmtDate(ev.start)}</div>
        <div class="album-title">${ev.title}</div>
      </div>
      <div class="album-badge-slot">${isNew ? '<span class="album-new-tag">NOVÉ</span>' : ''}</div>
      <div class="album-arrow">›</div>
    </div>`;
  }).join('');

  backdrop.innerHTML = `
    <div class="ev-modal" style="padding-left:0;padding-right:0;padding-bottom:max(20px, calc(env(safe-area-inset-bottom) + 8px));text-align:center;"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <div class="ev-modal-title" style="margin:0 20px 12px;">${title}</div>
      <div style="padding:0 20px;">
        ${rows}
      </div>
    </div>`;
  document.body.appendChild(backdrop);
}

    } else {
      // Nikdo nic nevybral — appka teď nedoplňuje žádnou výchozí ikonku,
      // takže se ani neukládá nic (ani do localStorage, ani do Firestore).
      localStorage.removeItem('kokrsnekAvatar');
    }
    finish();
  };
  backdrop.querySelector('#nameSubmitBtn').onclick = submit;
  backdrop.querySelector('#nameSkipBtn').onclick = finish;
  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
  setTimeout(() => input.focus(), 250);
}

// Vrátí uloženou emoji ikonku dané osoby (viz AVATAR_OPTIONS ve showNamePromptIfNeeded),
// nebo výchozí 👤, pokud si appku dosud nespustila po zavedení avatarů.
async function getAvatar(name){
  try{
    const doc = await db.collection('userProfiles').doc(name).get();
    return (doc.exists && doc.data().avatar) ? doc.data().avatar : '';
  }catch(e){ return ''; }
}

// Avatar konkrétního člověka se v appce skoro nemění, tak si ho po prvním
// načtení schováme do paměti — jinak by každá karta v timeline dělala
// vlastní Firestore dotaz na avatara každého, kdo má u akce Jdu.
window._avatarCache = window._avatarCache || {};
async function getAvatarCached(name){
  if(window._avatarCache[name] !== undefined) return window._avatarCache[name];
  const a = await getAvatar(name);
  window._avatarCache[name] = a;
  return a;
}

// České znaky s háčky/čárkami (Š, Ř, ...) lze v textu uložit dvěma různými
// způsoby zápisu Unicode, které vypadají na obrazovce identicky, ale pro
// přesné porovnání textů (typicky "user" == "Šuraj" ve Firestore) jsou to dva
// různé řetězce. Sjednocením přes normalize('NFC') se appka spolehne, že
// stejná přezdívka bude vždycky reprezentovaná stejně, ať se napíše kdekoliv.
function normName(s){
  return (s || '').normalize('NFC').trim();
}

// --- Online stav ("je zrovna v appce") ---
// Firestore sám o sobě neumí poznat, že někomu spadlo spojení (na rozdíl od
// Realtime Database s jejím onDisconnect), takže se to řeší "tepem":
// dokud má appku otevřenou a viditelnou na obrazovce, zapisuje si každých
// pár vteřin aktuální čas do presence/{jméno}. Kdokoliv jiný pak jen
// porovná, jak dávno tenhle čas byl — "online" je, kdo ťukl v posledním
// necelém intervalu (dost rezervy i pro krátký výpadek sítě).
const PRESENCE_HEARTBEAT_MS = 25000;
const PRESENCE_ONLINE_THRESHOLD_MS = 60000;
let presenceHeartbeatInterval = null;

function isPresenceOnline(lastActiveIso){
  if(!lastActiveIso) return false;
  return (Date.now() - new Date(lastActiveIso).getTime()) < PRESENCE_ONLINE_THRESHOLD_MS;
}

function startPresenceHeartbeat(){
  const me = localStorage.getItem('kokrsnekUser');
  if(!me || presenceHeartbeatInterval) return;
  const beat = () => {
    if(document.hidden) return;
    db.collection('presence').doc(me).set({ lastActive: new Date().toISOString() }, { merge: true }).catch(()=>{});
  };
  beat();
  presenceHeartbeatInterval = setInterval(beat, PRESENCE_HEARTBEAT_MS);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) beat(); });
}

// Malá zelená tečka k jménu/avataru — společný kus HTML pro seznam zpráv
// i hlavičku otevřeného vlákna, ať vypadá všude stejně.
function onlineDotHTML(){
  return `<span title="Online" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#34C759;box-shadow:0 0 0 2px var(--bg2);flex:0 0 auto;"></span>`;
}

// Seznam VŠECH, koho appka o partě ví — sjednocení userProfiles (kdo si
// vybral avatara) a pushTokens (kdo jen zapnul notifikace). Někdo jako Dejv
// nemá avatara, takže by ho čistě userProfiles seznam vynechal, i když je
// to plnohodnotný člen party — appka ho tímhle dostane do všech výběrů jmen
// (Přinesli, editace docházky), ne jen do seznamu zpráv.
async function getAllKnownPartyNames(){
  const names = new Set();
  try{
    const [profilesSnap, tokensSnap] = await Promise.all([
      db.collection('userProfiles').get(),
      db.collection('pushTokens').get(),
    ]);
    profilesSnap.forEach(d => names.add(d.id));
    tokensSnap.forEach(d => { if(d.data().user) names.add(normName(d.data().user)); });
  }catch(e){ console.error('Chyba při načítání seznamu party:', e); }
  return [...names].sort((a,b) => a.localeCompare(b, 'cs'));
}

function getUserName(){
  let name = localStorage.getItem('kokrsnekUser');
  if(!name){
    name = prompt('Jak se jmenuješ? (přezdívka v komentářích a lajkách)');
    if(!name || !name.trim()) return null;
    name = normName(name);
    localStorage.setItem('kokrsnekUser', name);
  }
  return normName(name);
}

function getEventKey(ev){
  return (ev.raw && ev.raw.id) ? ev.raw.id : ev.title.replace(/[^a-zA-Z0-9]/g,'_') + '_' + ev.start.toISOString().slice(0,10);
}

function eventKeyMap(){
  const m = {};
  (rawEvents||[]).forEach(ev => { try{ m[getEventKey(ev)] = ev; }catch(e){} });
  return m;
}

// Najde konkrétní kartu podle jejího klíče (viz getEventKey) a otevře její detail —
// používá se pro deep-link z push notifikace (klik na notifikaci -> ?event=KEY).
function openEventByKey(key){
  if(!key) return;
  const idx = (rawEvents||[]).findIndex(ev => { try{ return getEventKey(ev) === key; }catch(e){ return false; } });
  if(idx === -1) return;
  const slot = document.querySelector(`.slot[data-idx="${idx}"]`);
  if(slot) slot.scrollIntoView({block:'center'});
  showEventDetail(idx);
}

// Otevře rovnou "Kdo co přinese" pro danou akci (prokliknutí z notifikace
// broadcastBringList() → Cloud Function → sw.js, viz "?bring=" v URL
// a "open-bring" v postMessage níže).
function openBringListByKey(key){
  if(!key) return;
  const ev = (rawEvents||[]).find(e => { try{ return getEventKey(e) === key; }catch(err){ return false; } });
  if(!ev) return;
  openBringList(key, ev);
}

// Otevře náhled nákladů (showExpenseReceipt) rovnou podle klíče akce —
// prokliknutí z notifikace broadcastExpenseToAttendees() (viz "?expense="
// v URL a "open-expense" v postMessage níže).
async function showExpenseReceiptByKey(key){
  if(!key) return;
  const ev = (rawEvents||[]).find(e => { try{ return getEventKey(e) === key; }catch(err){ return false; } });
  if(!ev) return;
  try{
    const snap = await db.collection('expensePdfs').doc(key).get();
    if(!snap.exists) return;
    showExpenseReceipt(key, ev, snap.data().items || [], snap.data().contributions || []);
  }catch(e){ console.error('Chyba při načítání nákladů:', e); }
}

// Zprávu z service workeru (klik na notifikaci u už běžící appky) obsluhujeme stejnou cestou.
if(navigator.serviceWorker){
  navigator.serviceWorker.addEventListener('message', (event) => {
    if(event.data && event.data.type === 'open-event' && event.data.eventId){
      openEventByKey(event.data.eventId);
    } else if(event.data && event.data.type === 'open-chat' && event.data.chatWith){
      const me = localStorage.getItem('kokrsnekUser');
      if(me) openChatThread(me, event.data.chatWith);
    } else if(event.data && event.data.type === 'open-poll' && event.data.pollId){
      openPollDetail(event.data.pollId);
    } else if(event.data && event.data.type === 'open-bring' && event.data.bringKey){
      openBringListByKey(event.data.bringKey);
    } else if(event.data && event.data.type === 'open-expense' && event.data.expenseKey){
      showExpenseReceiptByKey(event.data.expenseKey);
    }
  });
}

// Chronologický přehled veškeré aktivity (lajky, Dojdu, komentáře) jednoho člověka napříč všemi akcemi
async function showPersonActivity(name){
  const viewer = localStorage.getItem('kokrsnekUser');
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:16px;">
        <span id="personActivityAvatar">👤</span> <span>${name}</span>
        ${name !== viewer ? `<button id="pokeNudgeBtn" title="Hipnout" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px;line-height:1;">👊</button>` : ''}
      </div>
      <div id="personActivityList" style="text-align:left;max-height:55vh;overflow-y:auto;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
    </div>`;
  document.body.appendChild(backdrop);

  const nudgeBtn = document.getElementById('pokeNudgeBtn');
  if(nudgeBtn) nudgeBtn.onclick = () => sendPoke(name, nudgeBtn);
  getAvatar(name).then(a => { const el = document.getElementById('personActivityAvatar'); if(el) el.textContent = a; });

  const list = document.getElementById('personActivityList');
  try{
    const keyMap = eventKeyMap();
    const toDate = (at) => at ? (at.toDate ? at.toDate() : new Date(at)) : null;
    const evLabel = (key) => {
      const ev = keyMap[key];
      if(!ev) return 'Neznámá / smazaná akce';
      const d = ev.start;
      return `${ev.title} · ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
    };

    const [likesSnap, attendSnap, declineSnap, commentsSnap] = await Promise.all([
      db.collectionGroup('likes').get(),
      db.collectionGroup('attendees').get(),
      db.collectionGroup('declines').get(),
      db.collectionGroup('comments').get()
    ]);

    const items = [];
    likesSnap.docs.forEach(d => {
      if(d.id !== name) return;
      const key = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      items.push({type:'like', at: toDate(d.data().at), key});
    });
    attendSnap.docs.forEach(d => {
      if(d.id !== name) return;
      const key = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      items.push({type:'attend', at: toDate(d.data().at), key});
    });
    declineSnap.docs.forEach(d => {
      if(d.id !== name) return;
      const key = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      items.push({type:'decline', at: toDate(d.data().at), key});
    });
    commentsSnap.docs.forEach(d => {
      const data = d.data();
      if(data.user !== name) return;
      const key = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      items.push({type:'comment', at: toDate(data.at), key, text: data.text || ''});
    });

    items.sort((a,b) => (b.at||0) - (a.at||0));

    if(items.length === 0){
      list.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Zatím žádná aktivita</div>';
      return;
    }

    const ICONS = {like:'❤️', attend:'👍', decline:'👎', comment:'💬'};
    list.innerHTML = items.map(it => {
      const time = it.at ? it.at.toLocaleString('cs',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const label = evLabel(it.key);
      const snippet = it.type === 'comment' && it.text
        ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px;">„${it.text.length > 80 ? it.text.slice(0,80)+'…' : it.text}“</div>`
        : '';
      return `<div style="padding:9px 0;border-bottom:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <span style="font-size:13.5px;color:var(--ink);font-weight:600;">${ICONS[it.type]} ${label}</span>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;">${time}</span>
        </div>
        ${snippet}
      </div>`;
    }).join('');
  }catch(e){
    console.error('Chyba při načítání aktivity uživatele:', e);
    list.innerHTML = `<div style="color:var(--coral);font-size:12px;text-align:center;padding:12px;">${e.message}</div>`;
  }
}

// Šťouchnutí / krátká zpráva — nic se nikde nezobrazuje, jen pošle push notifikaci
// dané osobě (Cloud Function onPokeCreated). Žádná historie, žádné vlákno.
async function sendPoke(name, btn){
  const user = getUserName();
  if(!user) return;
  try{
    await db.collection('pokes').add({ from: user, to: normName(name), type: 'poke', at: new Date().toISOString() });
    if(btn){ const orig = btn.textContent; btn.textContent = '✓'; setTimeout(() => { btn.textContent = orig; }, 1500); }
  }catch(e){ console.error('Chyba při odesílání šťouchnutí:', e); }
}

// =====================================================
// MINICHAT — jeden adresát = jedno vlákno, zprávy do 160 znaků.
// ID vlákna je oba nicky seřazené abecedně a spojené "__", takže je stejné
// bez ohledu na to, kdo psal první (Cloud Function ho stejným způsobem
// rozparsuje zpátky na dvojici a pozná, komu poslat notifikaci).
// =====================================================
// Vlákno "Celá parta" — skupinový chat, na rozdíl od 1:1 vláken má pevné,
// nejména neproměnné ID (ne dvě spojená jména), aby ho poznaly i Cloud
// Functions (viz functions/index.js -> onChatMessageCreated) a poslaly
// puush notifikaci úplně všem kromě odesílatele, ne jen jednomu "druhému".
const PARTY_THREAD_ID = 'parta-vsichni';

function chatThreadId(a, b){
  return [normName(a), normName(b)].sort().join('__');
}

async function openChatList(){
  const me = getUserName();
  if(!me) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:12px;">💬 Zprávy</div>
      <div id="chatUserList" style="text-align:left;max-height:55vh;overflow-y:auto;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
    </div>`;
  document.body.appendChild(backdrop);

  const list = document.getElementById('chatUserList');
  try{
    const [tokensSnap, profilesSnap, messagesSnap, partyMsgsSnap, presenceSnap] = await Promise.all([
      db.collection('pushTokens').get(),
      db.collection('userProfiles').get(),
      db.collectionGroup('messages').get(),
      db.collection('chats').doc(PARTY_THREAD_ID).collection('messages').get(),
      db.collection('presence').get()
    ]);
    const avatarMap = {};
    profilesSnap.forEach(d => { if(d.data().avatar) avatarMap[d.id] = d.data().avatar; });
    const presenceMap = {};
    presenceSnap.forEach(d => { presenceMap[d.id] = d.data().lastActive; });

    // Nepřečtené ve skupinovém vlákně "Celá parta" — spočítané zvlášť, protože
    // nemá dva účastníky jako 1:1 vlákna.
    let partyUnread = 0;
    const partySeenRaw = localStorage.getItem('kokrsnekChatSeen_' + PARTY_THREAD_ID);
    const partySeen = partySeenRaw ? new Date(partySeenRaw) : new Date(0);
    partyMsgsSnap.forEach(d => {
      const data = d.data();
      if(data.from === me) return;
      const at = data.at ? new Date(data.at) : new Date(0);
      if(at > partySeen) partyUnread++;
    });

    // Nepřečtené na osobu + čas poslední zprávy (na řazení seznamu podle
    // toho, s kým si appka nejčerstvěji píše) + zajištění, že v seznamu
    // bude i ten, kdo mi psal, i kdyby zrovna neměl (už) zapnuté notifikace.
    // statsMap navíc počítá počet zpráv (poslal/přišlo), fotek a odkazů na
    // osobu — zobrazí se jako malý řádek pod jménem v seznamu.
    const unreadMap = {};
    const lastMsgMap = {};
    const statsMap = {};
    const partnerSet = new Set();
    const urlTestRegex = /https?:\/\//;
    messagesSnap.forEach(d => {
      const threadId = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      if(!threadId || threadId === PARTY_THREAD_ID) return;
      const participants = threadId.split('__');
      if(!participants.includes(me)) return;
      const other = participants.find(p => p !== me);
      if(!other) return;
      partnerSet.add(other);
      const data = d.data();
      const at = data.at ? new Date(data.at) : new Date(0);
      if(!lastMsgMap[other] || at > lastMsgMap[other]) lastMsgMap[other] = at;
      const stat = statsMap[other] || (statsMap[other] = { total: 0, sent: 0, received: 0, photos: 0, links: 0 });
      stat.total++;
      if(data.from === me) stat.sent++; else stat.received++;
      if(data.image) stat.photos++;
      if(data.text && urlTestRegex.test(data.text)) stat.links++;
      if(data.from === me) return;
      const seenRaw = localStorage.getItem('kokrsnekChatSeen_' + threadId);
      const seen = seenRaw ? new Date(seenRaw) : new Date(0);
      if(at > seen) unreadMap[other] = (unreadMap[other] || 0) + 1;
    });
    tokensSnap.docs.forEach(d => { if(d.data().user) partnerSet.add(d.data().user); });
    partnerSet.delete(me);

    // Nejčerstvěji popsané vlákno nahoře; s kým appka ještě nikdy nepsala
    // (jen má zapnuté notifikace), jde na konec, seřazené abecedně.
    const names = [...partnerSet].sort((a,b) => {
      const ta = lastMsgMap[a] ? lastMsgMap[a].getTime() : 0;
      const tb = lastMsgMap[b] ? lastMsgMap[b].getTime() : 0;
      if(ta !== tb) return tb - ta;
      return a.localeCompare(b, 'cs');
    });
    const partyRow = `
      <button class="chat-user-row" data-party="1" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:11px 4px;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;font-size:14.5px;color:var(--ink);font-weight:700;cursor:pointer;text-align:left;">
        <span>👥 Celá parta</span>
        <span style="display:flex;align-items:center;gap:8px;">
          ${partyUnread > 0 ? `<span style="background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap;">nové ${partyUnread > 9 ? '9+' : partyUnread}</span>` : ''}
          <span style="color:var(--muted);font-size:16px;">›</span>
        </span>
      </button>`;
    const pollRow = `
      <button class="chat-user-row" data-polls="1" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:11px 4px;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;font-size:14.5px;color:var(--ink);font-weight:700;cursor:pointer;text-align:left;">
        <span>📊 Ankety</span>
        <span style="color:var(--muted);font-size:16px;">›</span>
      </button>`;
    if(!names.length){
      list.innerHTML = partyRow + pollRow + '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Zatím nikdo jiný nemá zapnuté notifikace</div>';
    } else {
      list.innerHTML = partyRow + pollRow + names.map(n => {
        const unread = unreadMap[n] || 0;
        const online = isPresenceOnline(presenceMap[n]);
        const stat = statsMap[n];
        const statLine = stat ? `<span style="font-family:'Inter', sans-serif;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;">${stat.total} (<span style="color:var(--accent);">${stat.sent}</span>/<span style="color:var(--coral);">${stat.received}</span>)${stat.photos ? ` · 📷${stat.photos}` : ''}${stat.links ? ` · 🔗${stat.links}` : ''}</span>` : '';
        return `
        <button class="chat-user-row" data-name="${n}" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:11px 4px;border-bottom:1px solid var(--line);font-family:'Inter', sans-serif;font-size:14.5px;color:var(--ink);font-weight:600;cursor:pointer;text-align:left;">
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0;">
            <span style="display:flex;align-items:center;gap:6px;">${avatarMap[n] || ''} ${n}${online ? onlineDotHTML() : ''}</span>
            ${statLine}
          </span>
          <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
            ${unread > 0 ? `<span style="background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap;">nové ${unread > 9 ? '9+' : unread}</span>` : ''}
            <span style="color:var(--muted);font-size:16px;">›</span>
          </span>
        </button>`;
      }).join('');
    }
    list.querySelector('[data-party]').onclick = () => { backdrop.remove(); openChatThread(me, PARTY_THREAD_ID); };
    list.querySelector('[data-polls]').onclick = () => { backdrop.remove(); openPollList(); };
    list.querySelectorAll('[data-name]').forEach(btn => {
      btn.onclick = () => { backdrop.remove(); openChatThread(me, btn.dataset.name); };
    });
  }catch(e){
    console.error('Chyba při načítání seznamu:', e);
    list.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:12px;">Nepodařilo se načíst</div>';
  }
}

// =====================================================
// ANKETY — hlasovací kolekce "polls", nezávislá na konkrétní akci (na rozdíl
// od Dojdu/Nedojdu). Jeden aktivní hlas na osobu na anketu (jde přehlasovat),
// uložený jako votes: { normalizovanéJméno: indexMožnosti }. Otevírá se
// z "💬 Zprávy" (viz openChatList výš), stejné místo jako "Celá parta".
// =====================================================

function pollIconSVG(){
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-6"/></svg>`;
}

async function openPollList(){
  const me = getUserName();
  if(!me) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:12px;">📊 Ankety</div>
      <button id="newPollBtn" style="display:block;width:100%;margin-bottom:12px;padding:11px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-family:'Inter', sans-serif;font-weight:700;font-size:14px;cursor:pointer;">+ Nová anketa</button>
      <div id="pollList" style="text-align:left;max-height:50vh;overflow-y:auto;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('newPollBtn').onclick = () => { backdrop.remove(); openPollEditor(); };

  const listEl = document.getElementById('pollList');
  try{
    const snap = await db.collection('polls').orderBy('createdAt', 'desc').get();
    if(snap.empty){
      listEl.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Zatím žádná anketa — založ první!</div>';
      return;
    }
    listEl.innerHTML = snap.docs.map(d => {
      const data = d.data();
      const votes = data.votes || {};
      const voteCount = Object.keys(votes).length;
      const myVoteIdx = votes[me];
      const options = data.options || [];
      let leaderLine = '';
      if(data.closed && options.length){
        const counts = options.map((_, i) => Object.values(votes).filter(v => v === i).length);
        const maxCount = Math.max(...counts, 0);
        const winners = options.filter((_, i) => counts[i] === maxCount && maxCount > 0);
        leaderLine = winners.length ? `Vyhrálo: ${winners.join(', ')}` : 'Nikdo nehlasoval';
      }
      return `
        <button data-poll-id="${d.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-family:'Inter', sans-serif;opacity:${data.closed ? '0.55' : '1'};">
          <div style="font-size:14px;font-weight:700;color:var(--ink);">${data.closed ? '🔒 ' : ''}${data.question}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${data.closed ? leaderLine : `${voteCount} hlas(ů)`}${myVoteIdx !== undefined ? ' · hlasoval(a) jsi' : ''}</div>
        </button>`;
    }).join('');
    listEl.querySelectorAll('[data-poll-id]').forEach(btn => {
      btn.onclick = () => { backdrop.remove(); openPollDetail(btn.dataset.pollId); };
    });
  }catch(e){
    console.error('Chyba při načítání anket:', e);
    listEl.innerHTML = '<div style="color:var(--coral);font-size:12px;text-align:center;padding:12px;">Nepodařilo se načíst ankety</div>';
  }
}

function openPollEditor(){
  const me = getUserName();
  if(!me) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="ev-modal"><div class="sheet-grabber-down" onclick="this.closest('.ev-modal-backdrop').remove()" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" onclick="this.closest('.ev-modal-backdrop').remove()">×</button>
      <div class="ev-modal-title" style="text-align:center;margin-bottom:14px;">📊 Nová anketa</div>
      <input id="pollQuestion" placeholder="Otázka (např. Kam příště?)" style="width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter', sans-serif;font-size:16px;padding:10px 12px;border-radius:var(--radius-sm);outline:none;margin-bottom:10px;">
      <div id="pollOptionsList" style="margin-bottom:8px;"></div>
      <button id="addOptionBtn" style="display:block;width:100%;padding:9px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter', sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:14px;">+ Přidat možnost</button>
      <button id="createPollBtn" style="display:block;width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-family:'Inter', sans-serif;font-weight:700;font-size:14px;cursor:pointer;">Vytvořit</button>
    </div>`;
  document.body.appendChild(backdrop);

  const optionsList = document.getElementById('pollOptionsList');
  const addOptionRow = (placeholder) => {
    const row = document.createElement('input');
    row.className = 'poll-option-input';
    row.placeholder = placeholder;
    row.style.cssText = 'width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:\'Inter\', sans-serif;font-size:16px;padding:9px 12px;border-radius:var(--radius-sm);outline:none;margin-bottom:8px;';
    optionsList.appendChild(row);
  };
  addOptionRow('Možnost 1');
  addOptionRow('Možnost 2');
  document.getElementById('addOptionBtn').onclick = () => addOptionRow(`Možnost ${optionsList.children.length + 1}`);

  document.getElementById('createPollBtn').onclick = async () => {
    const question = document.getElementById('pollQuestion').value.trim();
    const options = [...optionsList.querySelectorAll('.poll-option-input')]
      .map(inp => inp.value.trim())
      .filter(v => v);
    if(!question){ alert('Napiš otázku.'); return; }
    if(options.length < 2){ alert('Zadej aspoň dvě možnosti.'); return; }
    const createBtn = document.getElementById('createPollBtn');
    createBtn.disabled = true;
    createBtn.textContent = 'Vytvářím…';
    try{
      const ref = await db.collection('polls').add({
        question,
        options,
        votes: {},
        createdBy: me,
        createdAt: new Date().toISOString(),
        closed: false,
      });
      backdrop.remove();
      openPollDetail(ref.id);
    }catch(e){
      console.error('Chyba při vytváření ankety:', e);
      alert('Nepodařilo se vytvořit anketu.');
      createBtn.disabled = false;
      createBtn.textContent = 'Vytvořit';
    }
  };
}

let activePollUnsub = null;

async function openPollDetail(pollId){
  const me = getUserName();
  if(!me) return;
  if(activePollUnsub){ activePollUnsub(); activePollUnsub = null; }
  const backdrop = document.createElement('div');
  const close = () => { if(activePollUnsub){ activePollUnsub(); activePollUnsub = null; } backdrop.remove(); };
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) close(); };
  backdrop.innerHTML = `
    <div class="ev-modal"><div class="sheet-grabber-down" style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" id="pollDetailClose">×</button>
      <div id="pollDetailBody" style="text-align:left;"><div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Načítám…</div></div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('pollDetailClose').onclick = close;
  backdrop.querySelector('.sheet-grabber-down').onclick = close;

  const bodyEl = document.getElementById('pollDetailBody');
  activePollUnsub = db.collection('polls').doc(pollId).onSnapshot(snap => {
    if(!snap.exists){ bodyEl.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">Anketa už neexistuje.</div>'; return; }
    const data = snap.data();
    const votes = data.votes || {};
    const options = data.options || [];
    const total = Object.keys(votes).length;
    const myVoteIdx = votes[me];
    const isCreator = normName(data.createdBy) === normName(me);

    const optionsHtml = options.map((opt, i) => {
      const voters = Object.keys(votes).filter(u => votes[u] === i);
      const pct = total ? Math.round(voters.length / total * 100) : 0;
      const mine = myVoteIdx === i;
      return `
        <button onclick="${data.closed ? '' : `voteInPoll('${pollId}', ${i})`}" style="
          display:block; width:100%; text-align:left; position:relative; overflow:hidden;
          background:var(--surface); border:1px solid ${mine ? 'var(--accent)' : 'var(--line)'};
          border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px;
          cursor:${data.closed ? 'default' : 'pointer'}; font-family:'Inter', sans-serif;
        ">
          <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:var(--accent-soft);z-index:0;"></div>
          <div style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13.5px;color:var(--ink);font-weight:${mine?'700':'500'};">${mine ? '✓ ' : ''}${opt}</span>
            <span style="font-size:12px;color:var(--muted);white-space:nowrap;margin-left:8px;">${voters.length} · ${pct}%</span>
          </div>
          ${voters.length ? `<div style="position:relative;z-index:1;font-size:10.5px;color:var(--muted);margin-top:3px;">${voters.join(', ')}</div>` : ''}
        </button>`;
    }).join('');

    bodyEl.innerHTML = `
      <div class="ev-modal-title" style="margin-bottom:2px;">📊 ${data.question}</div>
      <div style="font-family:'Inter', sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:14px;text-align:center;">
        založil(a) ${data.createdBy}${data.closed ? ' · uzavřeno' : ''}
      </div>
      ${optionsHtml}
      ${isCreator && !data.closed ? `<button id="closePollBtn" style="display:block;width:100%;margin-top:10px;padding:10px;border-radius:var(--radius-sm);background:none;border:1px solid var(--line);color:var(--muted);font-family:'Inter', sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;">Uzavřít anketu</button>` : ''}
    `;
    const closeBtn = document.getElementById('closePollBtn');
    if(closeBtn) closeBtn.onclick = () => closePoll(pollId);
  }, err => { console.error('Chyba při načítání ankety:', err); });
}

async function voteInPoll(pollId, optionIndex){
  const me = getUserName();
  if(!me) return;
  try{
    await db.collection('polls').doc(pollId).update({ ['votes.' + me]: optionIndex });
  }catch(e){
    // update() selže, pokud dokument neexistuje (nemělo by nastat) — pro
    // jistotu záložní zápis přes set/merge.
    try{ await db.collection('polls').doc(pollId).set({ votes: { [me]: optionIndex } }, { merge: true }); }
    catch(e2){ console.error('Chyba při hlasování:', e2); }
  }
}

async function closePoll(pollId){
  if(!confirm('Uzavřít anketu? Po uzavření už nepůjde hlasovat.')) return;
  try{
    await db.collection('polls').doc(pollId).update({ closed: true });
  }catch(e){ console.error('Chyba při uzavírání ankety:', e); }
}

let activeChatUnsub = null;
let activeChatSeenUnsub = null;
let activeChatTypingInterval = null;
let activeChatPresenceUnsub = null;
function openChatThread(me, other){
  if(activeChatUnsub){ activeChatUnsub(); activeChatUnsub = null; }
  if(activeChatSeenUnsub){ activeChatSeenUnsub(); activeChatSeenUnsub = null; }
  if(activeChatTypingInterval){ clearInterval(activeChatTypingInterval); activeChatTypingInterval = null; }
  if(activeChatPresenceUnsub){ activeChatPresenceUnsub(); activeChatPresenceUnsub = null; }
  const isGroup = other === PARTY_THREAD_ID;
  const threadId = isGroup ? PARTY_THREAD_ID : chatThreadId(me, other);
  const backdrop = document.createElement('div');
  // Na iOS Safari (a v tomhle případě i na Androidu v appce přidané na
  // plochu) fixed-pozicované prvky s vyjetou klávesnicí "nezmenší" svou
  // vlastní výšku samy — .ev-modal má statický strop max-height:88vh počítaný
  // z CELÉ (klávesnicí nezúžené) obrazovky, takže s otevřenou klávesnicí by
  // byl sheet pořád stejně "vysoký", jenže zespoda přišpendlený už jen k
  // prostoru NAD klávesnicí (viz align-items:flex-end v .ev-modal-backdrop)
  // — horní část i s hlavičkou by tak vyjela úplně mimo viditelnou obrazovku
  // nahoře. VisualViewport API řekne, kolik místa NAD klávesnicí je opravdu
  // vidět, a podle toho se dá jak sheet, tak backdrop správně zmenšit.
  let chatModalBaselineHeight = null;
  const fitChatModalToViewport = () => {
    const vv = window.visualViewport;
    if(!vv) return;
    // Zapamatuje se výška hned při otevření chatu (kdy klávesnice ještě
    // určitě není vysunutá) — porovnáním s ní jde spolehlivě poznat, že se
    // klávesnice vysunula, aniž by se to muselo odhadovat z window.innerHeight
    // (ten se na Androidu chová jinak než na iOS a dřívější odhad kvůli tomu
    // klávesnici nepoznal na žádné z platforem).
    if(chatModalBaselineHeight === null) chatModalBaselineHeight = vv.height;
    backdrop.style.height = vv.height + 'px';
    backdrop.style.top = vv.offsetTop + 'px';
    backdrop.style.bottom = 'auto';
    const modalEl = backdrop.querySelector('.ev-modal');
    if(modalEl){
      modalEl.style.maxHeight = Math.round(vv.height * 0.88) + 'px';
      // Spodní padding sheetu (viz .ev-modal v CSS) počítá navíc s
      // env(safe-area-inset-bottom) — rezerva pro spodní "domečkovou" lištu
      // bez klávesnice. S vyjetou klávesnicí je zbytečná (o tu oblast se
      // stará klávesnice sama) a jen dělá díru mezi "Odeslat" a klávesnicí.
      const keyboardOpen = (chatModalBaselineHeight - vv.height) > 80;
      modalEl.style.paddingBottom = keyboardOpen ? '14px' : '';
    }
    // Kdykoliv se takhle sheet přepočítá (typicky těsně po odeslání zprávy,
    // když se textové pole zase zmenší na jeden řádek), seznam zpráv dole
    // zůstane scrollnutý na starou pozici i přes to, že se mu mezitím
    // zmenšil/zvětšil dostupný prostor — poslední zpráva pak zůstávala
    // částečně schovaná. Dotáhne se proto vždycky znovu úplně dolů i tady,
    // ne jen při příchodu nové zprávy.
    const msgsEl2 = document.getElementById('chatMessages');
    if(msgsEl2) msgsEl2.scrollTop = msgsEl2.scrollHeight;
  };
  const closeThread = () => {
    localStorage.setItem('kokrsnekChatSeen_' + threadId, new Date().toISOString());
    if(activeChatUnsub){ activeChatUnsub(); activeChatUnsub = null; }
    if(activeChatSeenUnsub){ activeChatSeenUnsub(); activeChatSeenUnsub = null; }
    if(activeChatTypingInterval){ clearInterval(activeChatTypingInterval); activeChatTypingInterval = null; }
    if(activeChatPresenceUnsub){ activeChatPresenceUnsub(); activeChatPresenceUnsub = null; }
    if(window.visualViewport){
      window.visualViewport.removeEventListener('resize', fitChatModalToViewport);
      window.visualViewport.removeEventListener('scroll', fitChatModalToViewport);
    }
    document.removeEventListener('visibilitychange', onVisibilityChange);
    backdrop.remove();
    updateChatBadge();
  };
  backdrop.className = 'ev-modal-backdrop';
  backdrop.onclick = e => { if(e.target===backdrop) closeThread(); };
  // POZOR: .ev-modal má sdílené CSS pravidlo "overflow-y:auto" na celém sheetu
  // (používá ho spousta jiných modálů), takže na iOS se při rolování zpráv
  // občas rolovací gesto "přeneslo" na celý sheet místo jen na #chatMessages
  // a hlavička se jménem/hipnutím ujela mimo displej — na Androidu se
  // klávesnice chová jinak a stejný chaining scrollu nenastával. Oprava:
  // tady konkrétně sheet přepnutý na flex sloupec s vypnutým vlastním
  // scrollem (overflow:hidden), a rolovat smí jen #chatMessages uprostřed
  // (flex:1, min-height:0, overscroll-behavior:contain) — hlavička ani
  // vstupní řádek se tak nikdy nemůžou odrolovat pryč.
  backdrop.innerHTML = `
    <div class="ev-modal" style="display:flex;flex-direction:column;max-height:88vh;overflow:hidden;">
      <div class="sheet-grabber-down" onclick="document.getElementById('chatThreadClose').click()" style="width:100%;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer;"><div style="width:38px;height:5px;background:#E2664F;border-radius:100px;"></div></div>
      <button class="ev-modal-close" id="chatThreadClose">×</button>
      <div class="ev-modal-title" style="flex:0 0 auto;position:relative;min-height:32px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;">
          <button id="chatMuteBtn" title="Ztlumit notifikace z tohoto vlákna" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;align-items:center;">${bellIconSVG(false)}</button>
          <button id="chatSearchBtn" title="Hledat ve zprávách" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;align-items:center;">${searchIconSVG()}</button>
        </div>
        <span style="padding:0 64px;">${isGroup ? '👥 Celá parta' : `<span id="chatThreadAvatar">👤</span> ${other} <span id="chatThreadPresenceDot" style="display:none;"></span>`}</span>
        ${!isGroup ? `<button id="chatThreadPokeBtn" title="Hipnout" style="position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;padding:4px;line-height:1;">👊</button>` : ''}
      </div>
      <div id="chatTypingIndicator" style="flex:0 0 auto;text-align:center;font-size:11px;color:var(--accent);min-height:14px;margin:0 0 8px;font-family:'Inter', sans-serif;"></div>
      <div id="chatPinnedBanner" style="display:none;flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:8px;cursor:pointer;"></div>
      <div id="chatSearchRow" style="display:none;flex:0 0 auto;margin-bottom:8px;">
        <input id="chatSearchInput" placeholder="Hledat ve zprávách…" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter', sans-serif;font-size:16px;padding:8px 12px;border-radius:var(--radius-sm);outline:none;box-sizing:border-box;">
      </div>
      <div id="chatMessages" style="flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:4px 2px;"></div>
      <div style="flex:0 0 auto;">
        <div id="chatComposerRow" style="display:flex;gap:8px;margin-top:12px;align-items:flex-end;">
          <button id="chatImageBtn" title="Přidat fotku" style="background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;">${cameraIconSVG()}</button>
          <textarea id="chatInput" maxlength="160" placeholder="Napiš…" rows="1" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:'Inter', sans-serif;font-size:16px;padding:10px 12px;border-radius:var(--radius-sm);outline:none;resize:none;overflow-y:auto;max-height:110px;line-height:1.3;"></textarea>
          <button id="chatMicBtn" title="Nahrát hlasovku" style="display:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;flex:0 0 auto;align-items:center;justify-content:center;">${micIconSVG()}</button>
          <button id="chatSendBtn" style="background:var(--accent);border:none;color:#fff;font-weight:700;font-size:13px;padding:11px 18px;border-radius:var(--radius-sm);cursor:pointer;flex:0 0 auto;">Odeslat</button>
        </div>
        <div id="chatRecordRow" style="display:none;margin-top:12px;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--coral);border-radius:var(--radius-sm);padding:8px 12px;">
          <span style="width:9px;height:9px;border-radius:50%;background:var(--coral);flex:0 0 auto;animation:recPulse 1s infinite;"></span>
          <span id="chatRecordTimer" style="flex:1;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);">0:00</span>
          <button id="chatRecordCancelBtn" title="Zahodit nahrávku" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;align-items:center;">${trashIconSVG()}</button>
          <button id="chatRecordSendBtn" title="Odeslat hlasovku" style="background:var(--accent);border:none;color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;">Odeslat</button>
        </div>
      </div>
      <input type="file" id="chatImageInput" accept="image/*" multiple style="display:none;flex:0 0 auto;">
    </div>`;
  document.body.appendChild(backdrop);
  if(window.visualViewport){
    fitChatModalToViewport();
    window.visualViewport.addEventListener('resize', fitChatModalToViewport);
    window.visualViewport.addEventListener('scroll', fitChatModalToViewport);
  }
  document.getElementById('chatThreadClose').onclick = closeThread;
  if(!isGroup){
    getAvatar(other).then(a => { const el = document.getElementById('chatThreadAvatar'); if(el) el.textContent = a; });
    // Živě aktualizovaná tečka podle presence/{other} — reaguje hned, jak
    // druhá strana appku zavře/otevře, ne jen při otevření vlákna.
    const presenceDotEl = document.getElementById('chatThreadPresenceDot');
    if(presenceDotEl) presenceDotEl.innerHTML = onlineDotHTML();
    activeChatPresenceUnsub = db.collection('presence').doc(other).onSnapshot(snap => {
      if(!presenceDotEl) return;
      const online = isPresenceOnline(snap.data() && snap.data().lastActive);
      presenceDotEl.style.display = online ? 'inline-block' : 'none';
    }, err => console.error('Chyba při sledování online stavu:', err));
    const chatPokeBtn = document.getElementById('chatThreadPokeBtn');
    if(chatPokeBtn) chatPokeBtn.onclick = () => sendPoke(other, chatPokeBtn);
  }

  const msgsEl = document.getElementById('chatMessages');
  const isNearChatBottom = () => (msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight) < 120;
  const scrollChatToBottom = () => { msgsEl.scrollTop = msgsEl.scrollHeight; };
  // Tlačítko "dolů" se překresluje spolu se zprávami (viz renderChatMessages
  // níže — je poslední položka uvnitř #chatMessages), takže se pokaždé musí
  // dohledat znovu podle id, místo aby se odkaz zachytil jen jednou napevno.
  const updateScrollDownBtn = () => {
    const btn = document.getElementById('chatScrollDownBtn');
    if(btn) btn.style.display = isNearChatBottom() ? 'none' : 'flex';
  };
  msgsEl.addEventListener('scroll', updateScrollDownBtn);
  const QUICK_CHAT_EMOJIS = ['👍','❤️','😂','😮','😢'];
  let latestMsgDocs = [];
  let otherLastSeenIso = null;
  let latestLastSeenMap = {};
  let latestTypingMap = {};
  let chatSearchQuery = '';
  let pinnedMsgId = null;

  // Vykreslí zprávy znovu, kdykoliv přijdou nové zprávy NEBO se změní, kdy si
  // druhá strana naposledy otevřela vlákno (viz posluchač na chats/{threadId}
  // níže) — u vlastních zpráv tak "Přečteno" naskočí i živě, bez zavření chatu.
  // U skupinového vlákna "Celá parta" se u "Přečteno" navíc vypíšou i jména
  // (podle stejného lastSeen mapování jako u 1:1), ne jen holý čas.
  // Odkazy v textu zprávy (http/https) se automaticky změní na klikatelnou
  // "chipku" s doménou (místo dlouhé holé URL) — otevře se v nové kartě.
  // Plný náhled s titulkem/obrázkem stránky by vyžadoval stažení cizí
  // stránky na serveru (kvůli CORS to z prohlížeče nejde), takže zatím jen
  // hezčí odkaz, ne obrázkový náhled.
  function linkifyChatText(text){
    const urlRegex = /(https?:\/\/[^\s<]+[^\s<.,:;!?"')\]])/g;
    return text.replace(urlRegex, url => {
      let domain = url;
      try{ domain = new URL(url).hostname.replace(/^www\./,''); }catch(e){}
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" style="display:inline-flex;align-items:center;gap:5px;max-width:100%;margin-top:2px;padding:5px 10px;background:rgba(255,255,255,0.1);border-radius:100px;color:inherit;text-decoration:none;font-size:12px;font-weight:600;vertical-align:middle;">${linkIconSVG()}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${domain}</span></a>`;
    });
  }

  function renderChatMessages(){
    const docs = chatSearchQuery
      ? latestMsgDocs.filter(d => normalizeCz(d.data().text||'').includes(chatSearchQuery))
      : latestMsgDocs;
    // Nová zpráva strhne pohled dolů, jen když si člověk zrovna nerolí historii
    // výš — jinak by ho nová příchozí zpráva otravně vytrhla z čtení. Když
    // zůstane výš, jen se mu ukáže tlačítko "dolů" (viz scrollDownBtn).
    const wasNearBottom = msgsEl.childElementCount === 0 || isNearChatBottom();
    msgsEl.innerHTML = docs.map(d => {
      const data = d.data();
      const mine = data.from === me;
      const time = data.at ? new Date(data.at).toLocaleString('cs',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      const read = !isGroup && mine && data.at && otherLastSeenIso && new Date(data.at) <= new Date(otherLastSeenIso);
      // U skupinového vlákna se "kdo přečetl" pozná stejně jako u 1:1 —
      // porovnáním času zprávy s tím, kdy si dotyčný vlákno naposledy otevřel
      // (chats/{threadId}.lastSeen). Kdo nikdy vlákno neotevřel, v mapě
      // vůbec není, takže se logicky počítá za "ještě nepřečetl".
      const groupReaders = (isGroup && mine && data.at) ? Object.keys(latestLastSeenMap).filter(n =>
        n !== me && latestLastSeenMap[n] && new Date(latestLastSeenMap[n]) > new Date(data.at)
      ) : [];
      let status = '';
      if(!isGroup && mine){
        status = `<span style="color:${read?'var(--accent)':'var(--muted)'};">${read?' · Přečteno':' · Odesláno'}</span>`;
      } else if(isGroup && mine){
        const label = groupReaders.length
          ? `Přečteno: ${groupReaders.slice(0,2).join(', ')}${groupReaders.length>2 ? ` +${groupReaders.length-2}` : ''}`
          : 'Odesláno';
        status = `<span title="${groupReaders.join(', ')}" style="color:${groupReaders.length?'var(--accent)':'var(--muted)'};"> · ${label}</span>`;
      }
      const editedLabel = data.edited ? ' · upraveno' : '';
      const senderLabel = (isGroup && !mine) ? `<div style="font-size:11px;font-weight:700;opacity:0.8;margin-bottom:3px;">${data.from}</div>` : '';
      const imageHtml = data.image ? `<img src="${data.image}" onclick="openImageLightbox(this.src, getChatGalleryImages())" style="max-width:100%;max-height:220px;border-radius:10px;display:block;cursor:zoom-in;${data.text?'margin-bottom:6px;':''}">` : '';
      // Hlasovky appka nahrává jako obyčejný WAV (viz startRecording/
      // encodeWavBlob) právě proto, aby se vyhnula MediaRecorder formátům,
      // které Safari na iOS uměla nahrát, ale pak odmítala přehrát — pro
      // WAV žádná taková past nehrozí, stačí prostý <audio src>.
      const audioHtml = data.audio ? `<audio controls preload="metadata" src="${data.audio}" style="width:210px;max-width:100%;height:34px;display:block;${data.text?'margin-bottom:6px;':''}"></audio>` : '';
      const reactions = data.reactions || {};
      // Řádek reakcí se ukazuje, jen když už na zprávě nějaká je (ťuknutím na
      // ni jde vlastní reakci přidat/odebrat) — výběr NOVÉ emoji jde přes
      // dlouhé podržení bubliny (viz wireChatLongPress níže), ne přes natrvalo
      // vypsaných 5 ikon pod každou zprávou.
      const reactionsRow = QUICK_CHAT_EMOJIS.filter(em => (reactions[em]||[]).length > 0).map(em => {
        const users = reactions[em] || [];
        const active = users.includes(me);
        return `<button onclick="toggleChatReaction('${threadId}','${d.id}','${em}')" style="
          background:${active ? 'var(--accent-soft)' : 'transparent'};
          border:1px solid ${active ? 'rgba(62,143,104,0.5)' : 'var(--line)'};
          border-radius:100px; padding:2px 6px; font-size:11px; cursor:pointer;
          display:inline-flex; align-items:center; gap:2px; color:var(--ink); line-height:1.3;
        ">${em}<span style="font-size:9.5px;color:var(--muted);font-family:'Inter', sans-serif;">${users.length}</span></button>`;
      }).join('');
      const isPinned = pinnedMsgId === d.id;
      const pinBtn = `<button onclick="toggleChatPin('${threadId}','${d.id}')" title="${isPinned ? 'Odepnout' : 'Připnout'}" style="background:none;border:none;color:${isPinned ? 'var(--accent)' : 'var(--muted)'};cursor:pointer;padding:0;display:inline-flex;align-items:center;">${pinMsgIconSVG(isPinned)}</button>`;
      const editBtn = mine ? `<button onclick="editChatMessage('${threadId}','${d.id}')" title="Upravit zprávu" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;display:inline-flex;align-items:center;">${editIconSVG()}</button>` : '';
      const deleteBtn = mine ? `<button onclick="deleteChatMessage('${threadId}','${d.id}')" title="Smazat zprávu" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;display:inline-flex;align-items:center;">${trashIconSVG()}</button>` : '';
      return `<div data-msg-id="${d.id}" style="align-self:${mine?'flex-end':'flex-start'};max-width:78%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;">
        <div style="background:${mine?'var(--accent)':'var(--surface)'};color:${mine?'#fff':'var(--ink)'};padding:${(data.image||data.audio)?'6px':'8px 12px'};border-radius:14px;font-size:13.5px;">${senderLabel}${imageHtml}${audioHtml}${data.text ? `<div>${linkifyChatText(data.text)}</div>` : ''}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;${mine?'justify-content:flex-end;':''}">
          <span style="text-align:${mine?'right':'left'};">${time}${status}${editedLabel}</span>
          ${pinBtn}${editBtn}${deleteBtn}
        </div>
        ${reactionsRow ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;${mine?'justify-content:flex-end;':''}">${reactionsRow}</div>` : ''}
      </div>`;
    }).join('') || `<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">${chatSearchQuery ? 'Nic takového jsem nenašel' : 'Zatím žádné zprávy'}</div>`;
    // Tlačítko "dolů" jako poslední prvek v seznamu, position:sticky ho drží
    // u spodního okraje odrolované plochy. Nemá tentokrát nulovou výšku (ta
    // předchozí varianta se v praxi zespoda ořezávala vlastním overflow
    // seznamu) — místo toho si necháváme malou rezervu prostoru pod poslední
    // zprávou, ať je tlačítko vždy celé vidět.
    msgsEl.innerHTML += `<div style="position:sticky;bottom:4px;align-self:flex-end;margin-top:4px;z-index:3;">
      <button id="chatScrollDownBtn" title="Dolů na poslední zprávu" style="display:none;width:34px;height:34px;border-radius:50%;background:var(--surface-strong);border:1px solid var(--line);color:var(--ink);cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    </div>`;
    if(wasNearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    document.getElementById('chatScrollDownBtn').onclick = scrollChatToBottom;
    updateScrollDownBtn();
    wireChatLongPress();
  }

  // Dlouhé podržení bubliny zprávy = otevři výběr emoji reakce (stejný vzor
  // jako dlouhé podržení Dojdu/Nedojdu/lajku jinde v appce). Musí se volat
  // znovu po každém překreslení, protože renderChatMessages() vždycky
  // přepíše celé innerHTML a s ním zmizí i dřív přiřazené posluchače.
  function wireChatLongPress(){
    msgsEl.querySelectorAll('[data-msg-id]').forEach(el => {
      const msgId = el.dataset.msgId;
      let pressTimer, longPressed = false, startX = 0, startY = 0;
      el.addEventListener('touchstart', e => {
        longPressed = false;
        const t = e.touches && e.touches[0];
        startX = t ? t.clientX : 0; startY = t ? t.clientY : 0;
        pressTimer = setTimeout(() => {
          longPressed = true;
          if(navigator.vibrate) navigator.vibrate(15);
          showChatEmojiPicker(threadId, msgId, el);
        }, 450);
      }, {passive:true});
      el.addEventListener('touchend', () => clearTimeout(pressTimer));
      el.addEventListener('touchmove', e => {
        const t = e.touches && e.touches[0];
        if(!t) return;
        const dx = t.clientX - startX, dy = t.clientY - startY;
        if(Math.sqrt(dx*dx + dy*dy) > 15) clearTimeout(pressTimer);
      }, {passive:true});
      el.addEventListener('contextmenu', e => e.preventDefault());
    });
  }

  // "Píše…" — zvadne samo po 3.5s bez nové zprávy o psaní (viz interval níže),
  // takže nezůstane trvale svítit, kdyby si druhá strana zavřela appku
  // uprostřed psaní.
  function updateTypingIndicator(){
    const el = document.getElementById('chatTypingIndicator');
    if(!el) return;
    const now = Date.now();
    const typingNames = Object.keys(latestTypingMap).filter(n => {
      if(n === me) return false;
      const t = latestTypingMap[n];
      if(!t) return false;
      return (now - new Date(t).getTime()) < 3500;
    });
    el.textContent = typingNames.length ? `${typingNames.join(', ')} píše…` : '';
  }
  activeChatTypingInterval = setInterval(updateTypingIndicator, 1000);

  // Pomocná funkce, co zapíše "viděl(a) jsem až sem" — volá se jen když je
  // appka opravdu vidět na obrazovce (viz podmínka níže), ne kdykoliv si
  // appka jen běží na pozadí se zamčeným displejem.
  const markSeenNow = () => {
    db.collection('chats').doc(threadId).set({ lastSeen: { [me]: new Date().toISOString() } }, { merge: true }).catch(()=>{});
  };

  activeChatUnsub = db.collection('chats').doc(threadId).collection('messages').orderBy('at').onSnapshot(snap => {
    latestMsgDocs = snap.docs;
    renderChatMessages();
    // Dokud mám vlákno otevřené A appka je opravdu na obrazovce (ne jen
    // "technicky pořád běží" na pozadí se zamčeným telefonem — přesně tenhle
    // rozdíl dřív způsoboval, že se zprávy tvářily jako přečtené, i když je
    // nikdo neviděl), každá nově příchozí zpráva se rovnou počítá za
    // přečtenou, ať se u odesílatele "Přečteno" objeví hned, ne až po
    // zavření a novém otevření chatu.
    // POZN.: musí to být vnořený objekt {lastSeen:{[me]:...}}, ne klíč s tečkou
    // "lastSeen.me" — ten druhý zápis .set(...,{merge:true}) (na rozdíl od
    // .update()) nerozparsuje na cestu do pole, ale uloží ho jako jeden
    // doslovný název pole s tečkou v názvu, takže se čtení (data.lastSeen[jméno])
    // nikdy netrefilo a "Přečteno" se nikdy nezobrazilo.
    if(!document.hidden) markSeenNow();
  }, err => { console.error('Chyba při načítání zpráv:', err); });

  // Když se appka vrátí do popředí (odemčení telefonu, přepnutí zpět ze
  // záložky) a vlákno pořád běží na pozadí otevřené, doženou se tak i
  // zprávy, co mezitím přišly se zamčenou/skrytou appkou.
  const onVisibilityChange = () => { if(!document.hidden) markSeenNow(); };
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Vlastní dokument vlákna (chats/{threadId}) drží pole lastSeen (kdy si kdo
  // vlákno naposledy otevřel), typing (kdy kdo naposledy něco napsal), muted
  // (kdo má vlákno ztlumené) a pinned (připnutá zpráva) — podle nich se
  // u mých zpráv pozná přečtení, nahoře "píše…", stav zvonečku a banner.
  activeChatSeenUnsub = db.collection('chats').doc(threadId).onSnapshot(snap => {
    const data = snap.data();
    otherLastSeenIso = (!isGroup && data && data.lastSeen) ? data.lastSeen[other] : null;
    latestLastSeenMap = (data && data.lastSeen) || {};
    latestTypingMap = (data && data.typing) || {};
    renderChatMessages();
    updateTypingIndicator();
    const muted = (data && data.muted) || {};
    const isMuted = !!muted[me];
    const muteBtnEl = document.getElementById('chatMuteBtn');
    if(muteBtnEl){
      muteBtnEl.innerHTML = bellIconSVG(isMuted);
      muteBtnEl.title = isMuted ? 'Zapnout notifikace z tohoto vlákna' : 'Ztlumit notifikace z tohoto vlákna';
      muteBtnEl.style.color = isMuted ? 'var(--coral)' : 'var(--muted)';
    }
    const pinned = data && data.pinned;
    pinnedMsgId = pinned ? pinned.msgId : null;
    renderPinnedBanner(pinned);
  }, err => { console.error('Chyba při sledování přečtení:', err); });

  // Zvoneček ztlumí/zapne push notifikace jen z tohoto vlákna, aniž by se
  // muselo vypínat oznámení v celé appce (hodí se hlavně u "Celé party").
  document.getElementById('chatMuteBtn').onclick = () => {
    const muteBtnEl = document.getElementById('chatMuteBtn');
    const nowMuted = muteBtnEl.style.color === 'var(--coral)';
    db.collection('chats').doc(threadId).set({ muted: { [me]: !nowMuted } }, { merge: true }).catch(()=>{});
  };

  // Připnutá zpráva — banner nad seznamem, klik na něj doscrolluje na
  // původní zprávu, × ji odepne. Vykresluje se z dat vlákna (viz posluchač
  // výš), aby se ukázala i tomu, kdo appku teprve otevírá.
  function renderPinnedBanner(pinned){
    const el = document.getElementById('chatPinnedBanner');
    if(!el) return;
    if(!pinned){ el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.gap = '8px';
    const snippet = pinned.text ? pinned.text.slice(0,60) : (pinned.image ? '📷 fotka' : '');
    el.innerHTML = `
      <span style="flex:0 0 auto;color:var(--accent);display:inline-flex;">${pinMsgIconSVG(true)}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-family:'Inter', sans-serif;font-size:12px;text-align:left;"><b>${pinned.from}:</b> ${snippet}</span>
      <button id="chatUnpinBtn" title="Odepnout" style="flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font-size:15px;line-height:1;">×</button>
    `;
    el.onclick = () => {
      const target = msgsEl.querySelector(`[data-msg-id="${pinned.msgId}"]`);
      if(target) target.scrollIntoView({block:'center'});
    };
    document.getElementById('chatUnpinBtn').onclick = (e) => {
      e.stopPropagation();
      db.collection('chats').doc(threadId).update({ pinned: firebase.firestore.FieldValue.delete() }).catch(()=>{});
    };
  }

  // Hledání ve zprávách — filtruje jen to, co je už načtené (celá historie
  // vlákna se stahuje najednou při otevření), takže funguje okamžitě bez
  // dalšího dotazu do Firestore.
  const chatSearchBtn = document.getElementById('chatSearchBtn');
  const chatSearchRow = document.getElementById('chatSearchRow');
  const chatSearchInput = document.getElementById('chatSearchInput');
  chatSearchBtn.onclick = () => {
    const showing = chatSearchRow.style.display !== 'none';
    if(showing){
      chatSearchRow.style.display = 'none';
      chatSearchInput.value = '';
      chatSearchQuery = '';
      renderChatMessages();
    } else {
      chatSearchRow.style.display = 'block';
      chatSearchInput.focus();
    }
  };
  chatSearchInput.addEventListener('input', () => {
    chatSearchQuery = normalizeCz(chatSearchInput.value.trim());
    renderChatMessages();
  });

  const chatInputEl = document.getElementById('chatInput');
  // Textové pole se samo roztahuje do výšky podle napsaného textu (do max-height
  // v CSS výše), ať dlouhá zpráva nemizí do strany, ale řádkuje se a je celá vidět.
  const autoGrowChatInput = () => {
    chatInputEl.style.height = 'auto';
    chatInputEl.style.height = chatInputEl.scrollHeight + 'px';
  };
  let lastTypingWriteAt = 0;
  chatInputEl.addEventListener('input', () => {
    autoGrowChatInput();
    // Zápis "píšu" je omezený max na jednou za 1.5s, ať se při psaní
    // nezapisuje do Firestore na každé stisknuté písmenko.
    const now = Date.now();
    if(now - lastTypingWriteAt > 1500){
      lastTypingWriteAt = now;
      db.collection('chats').doc(threadId).set({ typing: { [me]: new Date().toISOString() } }, { merge: true }).catch(()=>{});
    }
  });

  const send = async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim().slice(0, 160);
    if(!text) return;
    input.value = '';
    autoGrowChatInput();
    try{
      await db.collection('chats').doc(threadId).collection('messages').add({ from: me, text, at: new Date().toISOString() });
    }catch(e){ console.error('Chyba při odesílání zprávy:', e); }
  };
  document.getElementById('chatSendBtn').onclick = send;
  chatInputEl.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

  // Fotka do zprávy — vybrané obrázky se zmenší a zkomprimují (stejná funkce
  // jako u přílohy ve zpětné vazbě) a pošlou se jako víc zpráv za sebou (jde
  // vybrat i víc fotek najednou); napsaný text v poli jde jako popisek jen
  // k té první fotce, zbytek jde bez textu.
  const chatImageBtn = document.getElementById('chatImageBtn');
  const chatImageInput = document.getElementById('chatImageInput');
  chatImageBtn.onclick = () => chatImageInput.click();
  chatImageInput.addEventListener('change', async () => {
    const files = chatImageInput.files ? [...chatImageInput.files] : [];
    if(!files.length) return;
    chatImageBtn.disabled = true;
    const origIcon = chatImageBtn.innerHTML;
    let text = chatInputEl.value.trim().slice(0, 160);
    chatInputEl.value = '';
    autoGrowChatInput();
    for(let i = 0; i < files.length; i++){
      chatImageBtn.textContent = files.length > 1 ? `${i+1}/${files.length}` : '…';
      try{
        const dataUrl = await compressImageSafely(files[i]);
        await db.collection('chats').doc(threadId).collection('messages').add({
          from: me, text, image: dataUrl, at: new Date().toISOString()
        });
        text = ''; // popisek se přiřadí jen první odeslané fotce
      }catch(e){
        console.error('Chyba při odesílání fotky:', e);
        alert('Nepodařilo se odeslat jednu z fotek.');
      }
    }
    chatImageBtn.disabled = false;
    chatImageBtn.innerHTML = origIcon;
    chatImageInput.value = '';
  });

  // --- Hlasovky ---
  // Zvuk se na rozdíl od fotek NEukládá jako base64 do Firestore dokumentu
  // (i pár vteřin řeči by snadno přerostlo přes 1MB limit na dokument), ale
  // nahraje se do Firebase Storage (viz "storage" výš) a do zprávy jde jen
  // URL + délka nahrávky. Nahrávání max. 2 minuty, pak se samo zastaví.
  //
  // POZOR: záměrně se NEPOUŽÍVÁ MediaRecorder. Ten na iOS Safari produkuje
  // "fragmentovaný" MP4/AAC, který sama Safari umí nahrát, ale pak ho svým
  // vlastním <audio> přehrávačem odmítne přehrát (MediaError 4), a Media
  // Source Extensions coby náhradní cesta pro zvuk na iOS vůbec nejsou
  // k dispozici (ověřeno v appce diagnostikou přímo na zařízení). Místo
  // toho appka bere syrová PCM data přímo z mikrofonu přes Web Audio API
  // a sama je poskládá do obyčejného WAV souboru — žádná komprese, žádný
  // kontejner, žádné kodeky — to umí přehrát bez výjimky každý prohlížeč.
  const MAX_RECORD_SECONDS = 120;
  const chatMicBtn = document.getElementById('chatMicBtn');
  const chatComposerRow = document.getElementById('chatComposerRow');
  const chatRecordRow = document.getElementById('chatRecordRow');
  const chatRecordTimer = document.getElementById('chatRecordTimer');
  const chatRecordCancelBtn = document.getElementById('chatRecordCancelBtn');
  const chatRecordSendBtn = document.getElementById('chatRecordSendBtn');
  let recordStream = null;
  let recordAudioCtx = null;
  let recordSourceNode = null;
  let recordProcessorNode = null;
  let recordSilentGain = null;
  let recordChunks = []; // pole Float32Array bloků z onaudioprocess
  let recordStartedAt = null;
  let recordTimerInterval = null;
  let recordCancelled = false;

  function formatRecordTime(sec){
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function stopRecordTracks(){
    if(recordStream){ recordStream.getTracks().forEach(t => t.stop()); recordStream = null; }
    if(recordTimerInterval){ clearInterval(recordTimerInterval); recordTimerInterval = null; }
    if(recordProcessorNode){ recordProcessorNode.disconnect(); recordProcessorNode.onaudioprocess = null; recordProcessorNode = null; }
    if(recordSourceNode){ recordSourceNode.disconnect(); recordSourceNode = null; }
    if(recordSilentGain){ recordSilentGain.disconnect(); recordSilentGain = null; }
    if(recordAudioCtx){ recordAudioCtx.close().catch(()=>{}); recordAudioCtx = null; }
  }

  // Spojí všechny nahrané bloky do jednoho Float32Array a zabalí do
  // standardní 44bajtové WAV hlavičky (16bit PCM, mono, vzorkovací
  // frekvence podle AudioContextu daného zařízení).
  function encodeWavBlob(chunks, sampleRate){
    let totalLen = 0;
    for(const c of chunks) totalLen += c.length;
    const samples = new Float32Array(totalLen);
    let offset = 0;
    for(const c of chunks){ samples.set(c, offset); offset += c.length; }

    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    const writeStr = (o, s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);        // délka fmt bloku
    view.setUint16(20, 1, true);         // PCM
    view.setUint16(22, 1, true);         // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true); // byte rate (mono, 16bit)
    view.setUint16(32, 2, true);         // block align
    view.setUint16(34, 16, true);        // bits per sample
    writeStr(36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let pos = 44;
    for(let i = 0; i < samples.length; i++, pos += 2){
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buffer], { type: 'audio/wav' });
  }

  async function startRecording(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert('Nahrávání zvuku tenhle prohlížeč nepodporuje.');
      return;
    }
    try{
      recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(e){
      alert('Bez povolení mikrofonu nejde hlasovku nahrát.');
      return;
    }
    recordChunks = [];
    recordCancelled = false;
    const AC = window.AudioContext || window.webkitAudioContext;
    recordAudioCtx = new AC();
    recordSourceNode = recordAudioCtx.createMediaStreamSource(recordStream);
    // ScriptProcessorNode je sice oficiálně zastaralý, ale funguje úplně
    // všude (včetně starších Safari) a pro krátké hlasovky je jednodušší
    // a spolehlivější než AudioWorklet. Musí být připojený až do
    // destination (přes tichý gain 0), jinak by v některých prohlížečích
    // onaudioprocess vůbec nezačal chodit.
    recordProcessorNode = recordAudioCtx.createScriptProcessor(4096, 1, 1);
    recordSilentGain = recordAudioCtx.createGain();
    recordSilentGain.gain.value = 0;
    recordProcessorNode.onaudioprocess = e => {
      recordChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    recordSourceNode.connect(recordProcessorNode);
    recordProcessorNode.connect(recordSilentGain);
    recordSilentGain.connect(recordAudioCtx.destination);

    recordStartedAt = Date.now();
    chatComposerRow.style.display = 'none';
    chatRecordRow.style.display = 'flex';
    chatRecordTimer.textContent = '0:00';
    recordTimerInterval = setInterval(() => {
      const sec = Math.round((Date.now() - recordStartedAt) / 1000);
      chatRecordTimer.textContent = formatRecordTime(sec);
      if(sec >= MAX_RECORD_SECONDS) finishRecording();
    }, 250);
  }

  function finishRecording(){
    const durationSec = Math.round((Date.now() - recordStartedAt) / 1000);
    const sampleRate = recordAudioCtx ? recordAudioCtx.sampleRate : 44100;
    const chunks = recordChunks;
    stopRecordTracks();
    chatComposerRow.style.display = 'flex';
    chatRecordRow.style.display = 'none';
    if(recordCancelled || !chunks.length) return;
    uploadVoiceMessage(encodeWavBlob(chunks, sampleRate), durationSec);
  }

  async function uploadVoiceMessage(blob, durationSec){
    if(durationSec < 1) return; // omylem ťuknutý mikrofon na zlomek vteřiny
    chatMicBtn.disabled = true;
    try{
      const path = `chatAudio/${threadId}/${Date.now()}_${me}.wav`;
      const ref = storage.ref(path);
      await ref.put(blob, { contentType: 'audio/wav', contentDisposition: 'inline' });
      const url = await ref.getDownloadURL();
      await db.collection('chats').doc(threadId).collection('messages').add({
        from: me, audio: url, audioType: 'audio/wav', audioDuration: durationSec, at: new Date().toISOString()
      });
    }catch(e){
      console.error('Chyba při odesílání hlasovky:', e);
      alert('Nepodařilo se odeslat hlasovku.');
    }
    chatMicBtn.disabled = false;
  }

  chatMicBtn.onclick = startRecording;
  chatRecordCancelBtn.onclick = () => {
    recordCancelled = true;
    finishRecording();
  };
  chatRecordSendBtn.onclick = finishRecording;
}

// Malá bublina s 5 emoji, co vyskočí po dlouhém podržení zprávy v chatu (viz
// wireChatLongPress výš) — na rozdíl od komentářů, kde je těch 5 ikon vidět
// pořád, tady zůstávají schované, dokud je člověk sám nevyvolá.
function showChatEmojiPicker(threadId, msgId, anchorEl){
  document.getElementById('chatEmojiPicker')?.remove();
  const rect = anchorEl.getBoundingClientRect();
  const picker = document.createElement('div');
  picker.id = 'chatEmojiPicker';
  const left = Math.max(8, Math.min(rect.left, window.innerWidth - 210));
  const top = Math.max(8, rect.top - 46);
  picker.style.cssText = `position:fixed;z-index:95;left:${left}px;top:${top}px;background:var(--bg2);border:1px solid var(--line);border-radius:100px;padding:6px 8px;display:flex;gap:8px;box-shadow:var(--shadow-md);`;
  picker.innerHTML = ['👍','❤️','😂','😮','😢'].map(em =>
    `<button data-em="${em}" style="background:none;border:none;font-size:21px;cursor:pointer;padding:2px;line-height:1;">${em}</button>`
  ).join('');
  document.body.appendChild(picker);
  picker.querySelectorAll('[data-em]').forEach(btn => {
    btn.onclick = () => { toggleChatReaction(threadId, msgId, btn.dataset.em); picker.remove(); };
  });
  setTimeout(() => {
    document.addEventListener('click', function c(e){ if(!picker.contains(e.target)){ picker.remove(); document.removeEventListener('click', c); } });
  }, 50);
