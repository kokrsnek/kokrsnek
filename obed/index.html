<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>Objednávka oběda</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2;--card:#fff;--text:#1c1b19;--hint:#6b6963;--line:#e4e2dc;
    --accent:#c2410c;--accent-text:#fff;--soft:#fdf1ea;--err:#b42318;--ok:#15803d;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#161615;--card:#22211f;--text:#f2f1ee;--hint:#a3a19b;--line:#36342f;--soft:#3a2418;--err:#f97066;--ok:#4ade80}
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--tg-theme-secondary-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--text));
    padding:16px 12px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .sub{color:var(--tg-theme-hint-color,var(--hint));font-size:14px;margin:0 0 16px}
  .card{background:var(--tg-theme-bg-color,var(--card));border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .pad{padding:14px}
  label.f{display:block;font-size:13px;color:var(--tg-theme-hint-color,var(--hint));margin-bottom:6px}
  input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:inherit}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--tg-theme-hint-color,var(--hint));
    background:var(--tg-theme-secondary-bg-color,var(--bg));padding:7px 14px;text-transform:none}
  td{padding:10px 14px;border-top:1px solid var(--line)}
  td.ct{width:132px;text-align:right;white-space:nowrap}
  .stp{display:inline-flex;align-items:center;gap:10px}
  .stp button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:inherit;font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation}
  .stp button.plus{border-color:var(--accent);color:var(--accent)}
  .stp output{min-width:18px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
  .sum{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--tg-theme-hint-color,var(--hint))}
  .msg{font-size:14px;margin:8px 0 0;min-height:20px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .btn{display:block;width:100%;font:inherit;font-weight:600;padding:13px;border-radius:12px;border:0;cursor:pointer;
    background:var(--tg-theme-button-color,var(--accent));color:var(--tg-theme-button-text-color,var(--accent-text));margin-top:10px}
  .btn.sec{background:transparent;color:inherit;border:1px solid var(--line);font-weight:500}
  .btn:disabled{opacity:.5;cursor:default}
  .row2{display:flex;gap:8px} .row2 .btn{flex:1}
  .qrbox{display:flex;gap:14px;align-items:center}
  .qr{background:#fff;padding:6px;border-radius:8px;flex-shrink:0;line-height:0}
  .qr svg{width:100%;height:100%;display:block}
  .kv{font-size:14px;margin:2px 0}
  .kv b{font-weight:600}
  .muted{color:var(--tg-theme-hint-color,var(--hint))}
  .big{font-size:22px;font-weight:700}
  .tot td{padding:7px 14px}
  .tot td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .person{padding:14px;border-top:1px solid var(--line)}
  .person:first-child{border-top:0}
  .banner{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .hidden{display:none!important}
  a{color:var(--tg-theme-link-color,var(--accent))}
</style>
</head>
<body>
<main>
  <h1 id="title">Objednávka oběda</h1>
  <p class="sub" id="sub">Uzávěrka 26. 11. 2026 · 180 Kč za porci (jídlo + příloha)</p>
  <div id="demo" class="banner hidden">Zkušební režim: objednávky se ukládají jen v tomto prohlížeči. Pro ostrý provoz doplň <code>firebaseConfig</code>.</div>

  <!-- Formulář objednávky -->
  <section id="vForm" class="hidden">
    <div class="card pad">
      <label class="f" for="jmeno">Jméno a příjmení</label>
      <input type="text" id="jmeno" autocomplete="name" maxlength="40" placeholder="Jan Novák">
    </div>
    <div class="card">
      <table id="tab"></table>
    </div>
    <div class="card pad">
      <div class="sum"><span id="sumInfo">Porcí: 0</span><span id="sumPril"></span></div>
      <p class="msg" id="formMsg"></p>
      <button class="btn" id="btnSend">Odeslat objednávku</button>
      <button class="btn sec hidden" id="btnCancelEdit">Zpět bez změn</button>
    </div>
  </section>

  <!-- Moje objednávka + QR -->
  <section id="vMine" class="hidden">
    <div class="card pad">
      <div class="muted" style="font-size:13px">Tvoje objednávka</div>
      <div id="mineName" style="font-weight:600;font-size:18px;margin:2px 0 6px"></div>
      <div id="mineItems" class="kv"></div>
    </div>
    <div class="card pad">
      <div class="qrbox">
        <div class="qr" id="mineQr" style="width:150px;height:150px"></div>
        <div>
          <div class="big" id="mineAmount"></div>
          <div class="kv"><span class="muted">Účet</span><br><b>1518140045/3030</b></div>
          <div class="kv"><span class="muted">Zpráva</span><br><b id="mineMsg"></b></div>
        </div>
      </div>
      <p class="muted" style="font-size:13px;margin:12px 0 0">Naskenuj QR kód v bankovnictví (QR Platba).</p>
    </div>
    <div class="row2" id="mineActions">
      <button class="btn sec" id="btnEdit">Upravit</button>
      <button class="btn sec" id="btnDelete">Zrušit objednávku</button>
    </div>
    <p class="msg" id="mineMsgBox"></p>
  </section>

  <!-- Soupis pro organizátora -->
  <section id="vList" class="hidden">
    <div class="card">
      <table class="tot" id="totTab"></table>
    </div>
    <div class="row2">
      <button class="btn" id="btnCopy">Kopírovat souhrn</button>
      <button class="btn sec" id="btnBack">Zpět</button>
    </div>
    <p class="msg" id="listMsg"></p>
    <div class="card" id="people"></div>
  </section>

  <p class="muted hidden" id="loading" style="text-align:center">Načítám…</p>
</main>

<script type="module">
/* ====== NASTAVENÍ ====== */
const firebaseConfig = {
  apiKey: "AIzaSyC8h4BZJKz-SpX3Gl2kJgLIuhYFbp0EXjg",
  authDomain: "obed-mikulas.firebaseapp.com",
  projectId: "obed-mikulas",
  storageBucket: "obed-mikulas.firebasestorage.app",
  messagingSenderId: "793493488011",
  appId: "1:793493488011:web:a94cf032afd83042946f8e"
};
const CENA = 180;
const IBAN = "CZ7930300000001518140045";   // = 1518140045/3030
const UZAVERKA = new Date("2026-11-27T00:00:00+01:00"); // objednávky do 26. 11. 2026 včetně
const KOLEKCE = "objednavky";

const JIDLA   = [["vepr","Řízek vepřový"],["kure","Řízek kuřecí"],["syr","Smažený sýr"]];
const PRILOHY = [["salat","Bramborový salát"],["brambory","Brambory"],["hranolky","Hranolky"]];
const VSE = [...JIDLA, ...PRILOHY];

/* ====== Pomocné funkce ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bezDiakritiky = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const kc = n => n.toLocaleString("cs-CZ") + " Kč";
const slovoPorce = n => n === 1 ? "porce" : (n >= 2 && n <= 4 ? "porce" : "porcí");
const poUzaverce = () => new Date() >= UZAVERKA;

function zprava(jmeno, porce) {
  const t = bezDiakritiky(`${jmeno} ${porce} ${slovoPorce(porce)}`).replace(/[*]/g, " ").replace(/\s+/g, " ").trim();
  return t.slice(0, 60);
}
function spayd(castka, msg) {
  return `SPD*1.0*ACC:${IBAN}*AM:${castka.toFixed(2)}*CC:CZK*MSG:${msg}`;
}
function vykresliQr(el, text) {
  try {
    const q = qrcode(0, "M");
    q.addData(text);
    q.make();
    el.innerHTML = q.createSvgTag(4, 0);
    const svg = el.querySelector("svg");
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("viewBox", `0 0 ${q.getModuleCount() * 4} ${q.getModuleCount() * 4}`);
  } catch (e) { el.textContent = "QR nelze vytvořit"; }
}
function textPolozek(p) {
  return VSE.filter(([k]) => (p[k] || 0) > 0).map(([k, n]) => `${p[k]}× ${n}`);
}

/* ====== Telegram ====== */
const tg = window.Telegram?.WebApp;
const tgUser = tg?.initDataUnsafe?.user;
if (tg && tg.initData) { tg.ready(); tg.expand(); }

/* ====== Úložiště (Firebase nebo zkušební režim) ====== */
let api;
async function initBackend() {
  if (!firebaseConfig.apiKey) {
    $("demo").classList.remove("hidden");
    const KEY = "obed-demo-data", UK = "obed-demo-uid";
    let uid = localStorage.getItem(UK);
    if (!uid) { uid = "demo-" + Math.random().toString(36).slice(2, 10); localStorage.setItem(UK, uid); }
    const all = () => JSON.parse(localStorage.getItem(KEY) || "{}");
    const put = o => localStorage.setItem(KEY, JSON.stringify(o));
    const subs = [];
    const notify = () => { const a = all(); subs.forEach(cb => cb(Object.entries(a).map(([id, d]) => ({ id, ...d })))); };
    window.addEventListener("storage", e => { if (e.key === KEY) notify(); });
    api = {
      uid,
      load: async () => all()[uid] || null,
      save: async d => { const a = all(); a[uid] = d; put(a); notify(); },
      remove: async () => { const a = all(); delete a[uid]; put(a); notify(); },
      watchAll: cb => { subs.push(cb); notify(); }
    };
    return;
  }
  const base = "https://www.gstatic.com/firebasejs/10.12.2";
  const [{ initializeApp }, { getAuth, signInAnonymously, onAuthStateChanged },
         { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, serverTimestamp }] =
    await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const user = await new Promise((res, rej) => {
    const off = onAuthStateChanged(auth, u => { if (u) { off(); res(u); } });
    signInAnonymously(auth).catch(rej);
  });
  const ref = doc(db, KOLEKCE, user.uid);
  api = {
    uid: user.uid,
    load: async () => { const s = await getDoc(ref); return s.exists() ? s.data() : null; },
    save: d => setDoc(ref, { ...d, upraveno: serverTimestamp() }),
    remove: () => deleteDoc(ref),
    watchAll: cb => onSnapshot(collection(db, KOLEKCE), s => cb(s.docs.map(x => ({ id: x.id, ...x.data() }))),
                                e => { $("listMsg").className = "msg err"; $("listMsg").textContent = "Soupis nelze načíst: " + e.message; })
  };
}

/* ====== Formulář ====== */
const pocty = Object.fromEntries(VSE.map(([k]) => [k, 0]));
let moje = null;

function postavTabulku() {
  const radky = (nadpis, seznam) => `<tr><th colspan="2">${nadpis}</th></tr>` + seznam.map(([k, n]) =>
    `<tr><td>${n}</td><td class="ct"><span class="stp">
       <button type="button" data-k="${k}" data-d="-1" aria-label="Ubrat ${n}">−</button>
       <output id="o-${k}">0</output>
       <button type="button" class="plus" data-k="${k}" data-d="1" aria-label="Přidat ${n}">+</button>
     </span></td></tr>`).join("");
  $("tab").innerHTML = radky("Hlavní jídlo", JIDLA) + radky("Příloha", PRILOHY);
  $("tab").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    const k = b.dataset.k;
    pocty[k] = Math.max(0, Math.min(20, pocty[k] + Number(b.dataset.d)));
    tg?.HapticFeedback?.selectionChanged?.();
    obnovSoucet();
  });
}
const soucet = list => list.reduce((s, [k]) => s + pocty[k], 0);
function obnovSoucet() {
  VSE.forEach(([k]) => $("o-" + k).textContent = pocty[k]);
  const j = soucet(JIDLA), p = soucet(PRILOHY);
  $("sumInfo").textContent = `Porcí: ${j}`;
  $("sumPril").textContent = `Přílohy: ${p} / ${j}`;
  $("btnSend").textContent = j > 0 ? `Odeslat objednávku · ${kc(j * CENA)}` : "Odeslat objednávku";
  $("formMsg").textContent = ""; $("formMsg").className = "msg";
}
function chyba(t) { $("formMsg").className = "msg err"; $("formMsg").textContent = t; }

async function odeslat() {
  if (poUzaverce()) return chyba("Objednávky jsou už uzavřené.");
  const jmeno = $("jmeno").value.trim().replace(/\s+/g, " ");
  const j = soucet(JIDLA), p = soucet(PRILOHY);
  if (jmeno.length < 2) { $("jmeno").focus(); return chyba("Vyplň jméno."); }
  if (j === 0) return chyba("Vyber aspoň jedno jídlo.");
  if (p !== j) return chyba(p < j ? `Chybí ${j - p} ${j - p === 1 ? "příloha" : "přílohy"} – ke každému jídlu patří jedna.`
                                  : `Příloh je o ${p - j} víc než jídel.`);
  $("btnSend").disabled = true;
  try {
    const d = { jmeno, polozky: { ...pocty }, porce: j, castka: j * CENA };
    await api.save(d);
    try { localStorage.setItem("obed-jmeno", jmeno); } catch (e) {}
    moje = d;
    tg?.HapticFeedback?.notificationOccurred?.("success");
    ukaz("mine");
  } catch (e) {
    chyba("Odeslání se nepovedlo. Zkus to znovu. (" + (e.code || e.message) + ")");
  } finally { $("btnSend").disabled = false; }
}

/* ====== Moje objednávka ====== */
function vykresliMoji() {
  $("mineName").textContent = moje.jmeno;
  $("mineItems").innerHTML = textPolozek(moje.polozky).map(esc).join("<br>");
  $("mineAmount").textContent = kc(moje.castka);
  const msg = zprava(moje.jmeno, moje.porce);
  $("mineMsg").textContent = msg;
  vykresliQr($("mineQr"), spayd(moje.castka, msg));
  $("mineActions").classList.toggle("hidden", poUzaverce());
}

/* ====== Soupis ====== */
let soupisText = "";
function vykresliSoupis(list) {
  list.sort((a, b) => a.jmeno.localeCompare(b.jmeno, "cs"));
  const tot = Object.fromEntries(VSE.map(([k]) => [k, 0]));
  let porce = 0, castka = 0;
  list.forEach(o => { VSE.forEach(([k]) => tot[k] += o.polozky?.[k] || 0); porce += o.porce; castka += o.castka; });
  $("totTab").innerHTML =
    `<tr><th colspan="2">Celkem pro restauraci</th></tr>` +
    VSE.map(([k, n]) => `<tr><td>${n}</td><td>${tot[k]}</td></tr>`).join("") +
    `<tr><td><b>Porcí celkem</b></td><td>${porce}</td></tr>` +
    `<tr><td>Lidí / k vybrání</td><td>${list.length} / ${kc(castka)}</td></tr>`;
  soupisText = "Objednávka oběda\n" + VSE.filter(([k]) => tot[k]).map(([k, n]) => `${n}: ${tot[k]}`).join("\n") +
    `\nPorcí celkem: ${porce}\n\n` + list.map(o => `${o.jmeno} – ${textPolozek(o.polozky).join(", ")} – ${kc(o.castka)}`).join("\n");
  const box = $("people");
  if (!list.length) { box.innerHTML = `<div class="person muted">Zatím nikdo neobjednal.</div>`; return; }
  box.innerHTML = list.map((o, i) => `
    <div class="person"><div class="qrbox">
      <div class="qr" id="q${i}" style="width:120px;height:120px"></div>
      <div>
        <div style="font-weight:600">${esc(o.jmeno)}</div>
        <div class="kv muted">${textPolozek(o.polozky).map(esc).join("<br>")}</div>
        <div class="kv"><b>${kc(o.castka)}</b></div>
        <div class="kv muted" style="font-size:12px">${esc(zprava(o.jmeno, o.porce))}</div>
      </div></div></div>`).join("");
  list.forEach((o, i) => vykresliQr($("q" + i), spayd(o.castka, zprava(o.jmeno, o.porce))));
}
let soupisBezi = false;

/* ====== Přepínání pohledů ====== */
function ukaz(v) {
  ["vForm", "vMine", "vList"].forEach(id => $(id).classList.add("hidden"));
  if (v === "form") {
    $("vForm").classList.remove("hidden");
    $("btnCancelEdit").classList.toggle("hidden", !moje);
    if (poUzaverce()) { $("btnSend").disabled = true; chyba("Objednávky byly uzavřeny 26. 11. 2026."); }
  }
  if (v === "mine") { vykresliMoji(); $("vMine").classList.remove("hidden"); }
  if (v === "list") {
    $("vList").classList.remove("hidden");
    if (!soupisBezi) { soupisBezi = true; api.watchAll(vykresliSoupis); }
  }
}
const vychozi = () => (location.hash === "#soupis" ? "list" : moje ? "mine" : "form");

/* Skrytý vstup do soupisu: podržet nadpis 1 s (nebo adresa #soupis) */
let tmr;
const title = $("title");
title.addEventListener("pointerdown", () => { tmr = setTimeout(() => { location.hash = "soupis"; }, 1000); });
["pointerup", "pointerleave", "pointercancel"].forEach(e => title.addEventListener(e, () => clearTimeout(tmr)));
window.addEventListener("hashchange", () => ukaz(vychozi()));

$("btnSend").onclick = odeslat;
$("btnEdit").onclick = () => { VSE.forEach(([k]) => pocty[k] = moje.polozky[k] || 0); $("jmeno").value = moje.jmeno; obnovSoucet(); ukaz("form"); };
$("btnCancelEdit").onclick = () => ukaz("mine");
$("btnDelete").onclick = async () => {
  if (!confirm("Opravdu zrušit objednávku?")) return;
  try { await api.remove(); moje = null; VSE.forEach(([k]) => pocty[k] = 0); obnovSoucet(); ukaz("form"); }
  catch (e) { $("mineMsgBox").className = "msg err"; $("mineMsgBox").textContent = "Zrušení se nepovedlo."; }
};
$("btnBack").onclick = () => { history.replaceState(null, "", location.pathname + location.search); ukaz(vychozi()); };
$("btnCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(soupisText); $("listMsg").className = "msg ok"; $("listMsg").textContent = "Souhrn zkopírován."; }
  catch (e) { $("listMsg").className = "msg err"; $("listMsg").textContent = "Kopírování se nepovedlo."; }
};

/* ====== Start ====== */
(async () => {
  $("loading").classList.remove("hidden");
  postavTabulku(); obnovSoucet();
  const tgJmeno = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "";
  let ulozene = ""; try { ulozene = localStorage.getItem("obed-jmeno") || ""; } catch (e) {}
  $("jmeno").value = tgJmeno || ulozene;
  try {
    await initBackend();
    moje = await api.load();
  } catch (e) {
    $("loading").textContent = "Nepodařilo se připojit k databázi. Zkontroluj připojení a obnov stránku.";
    return;
  }
  $("loading").classList.add("hidden");
  ukaz(vychozi());
})();
</script>
</body>
</html>
